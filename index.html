      html += `</span></div>`;
    });
    const pp=pB.plankSeconds, ap=allB.plankSeconds||0;
    html += `<div class="stat-row"><span style="font-size:11px">Plank</span><span style="display:flex">`;
    html += `<span style="font-family:var(--mono);font-size:10px;width:90px;text-align:right;color:${pp>0?'var(--health)':'var(--mute)'}">${pp>0?formatSeconds(pp):'--'}</span>`;
    html += `<span style="font-family:var(--mono);font-size:10px;width:80px;text-align:right;color:${ap>0?'var(--amber)':'var(--mute)'}">${ap>0?formatSeconds(ap):'--'}</span>`;
    html += `</span></div></div>`;
    html += `<div class="card">`;
    html += `<div class="stat-row"><span>Tennis this period</span><span style="font-family:var(--mono);color:${totTennis>0?'var(--health)':'var(--mute)'}">${totTennis>0?totTennis+' min':'--'}</span></div>`;
    html += `<div class="stat-row"><span>Running this period</span><span style="font-family:var(--mono);color:${(totRunning>0||totRunMin>0)?'var(--health)':'var(--mute)'}">${totRunning>0?totRunning+' km':'--'}${totRunMin>0?' / '+totRunMin+' min':''}</span></div>`;
    html += `<div class="stat-row"><span>Hiking this period</span><span style="font-family:var(--mono);color:${totHiking>0?'var(--health)':'var(--mute)'}">${totHiking>0?totHiking+' min':'--'}</span></div>`;
    html += `<div class="stat-row"><span>Walking this period</span><span style="font-family:var(--mono);color:${totWalking>0?'var(--health)':'var(--mute)'}">${totWalking>0?totWalking+' min':'--'}</span></div>`;
    html += `</div>`;
  }

  // ── STREAKS ──
  html += sectionLabel('STREAKS','var(--health)');
  const hB = computeHealthBests();
  const streakItems=[
    {key:'smokeFree',label:'Smoke-free',current:computeStreak(r=>r.health&&r.health.smokeFree===true)},
    {key:'pushupsReps',label:'Push-ups',current:computeStreak(r=>r.health&&((r.health.pushupsReps||0)>0||r.health.pushups))},
    {key:'abrollerReps',label:'Ab roller',current:computeStreak(r=>r.health&&((r.health.abrollerReps||0)>0||r.health.abroller))},
    {key:'kegelReps',label:'Kegel',current:computeStreak(r=>r.health&&((r.health.kegelReps||0)>0||r.health.kegel))},
    {key:'matroutineReps',label:'Mat routine',current:computeStreak(r=>r.health&&((r.health.matroutineReps||0)>0||r.health.matroutine))},
    {key:'plankSeconds',label:'Plank',current:computeStreak(r=>r.health&&((r.health.plankSeconds||0)>0||r.health.plank))},
  ];
  html += `<div class="card">`;
  html += `<div style="display:flex;padding:4px 0 6px;border-bottom:1px solid var(--sep-alt);font-family:var(--mono);font-size:8px;color:var(--mute)">`;
  html += `<span style="flex:1"></span><span style="width:80px;text-align:right">Current</span><span style="width:80px;text-align:right">Best ever</span></div>`;
  streakItems.forEach(({key,label,current})=>{
    const best=hB[key]||0; const hasData=current>0||best>0;
    html += `<div class="stat-row"><span style="font-size:11px">${label}</span><span style="display:flex">`;
    html += `<span style="font-family:var(--mono);font-size:10px;width:80px;text-align:right;color:${current>0?'var(--health)':'var(--mute)'}">${hasData||current>0?current+' d':'--'}</span>`;
    html += `<span style="font-family:var(--mono);font-size:10px;width:80px;text-align:right;color:${best>0?'var(--health)':'var(--mute)'}">${best>0?best+' d':'--'}</span>`;
    html += `</span></div>`;
  });
  html += `</div>`;

  s.innerHTML = html;
  s.querySelector('#health-report-back').addEventListener('click',()=>{ healthReportOpen=false; renderHealth(); });
  s.querySelectorAll('.health-period').forEach(btn=>{
    btn.addEventListener('click',()=>{ healthReportPeriod=btn.dataset.period; renderHealthReport(s); });
  });
}

/* ============ HEALTH ============ */
function sportSectionHtml(h){
  const SPORT_CATS=[
    {key:'squats',label:'Squats',items:[
      ['squats','Squats'],['heelToe','Heel to Toe'],['weightShifting','Weight Shifting'],
      ['elbowCircle','Elbow Circle'],['forwardSlides','Forward Slides'],
      ['diagonalWave','Diagonal Wave'],['plyoLunges','Plyo Lunges']
    ]},
    {key:'abs',label:'Abs',items:[
      ['mtClimbing','Mt Climbing'],['inOut','In &amp; Out'],['plankHipDips','Plank Hip Dips'],
      ['twists','Twists'],['bicycleCrunch','Bicycle Crunch'],['cableCrunch','Cable Crunch'],
      ['abWheelRollout','Ab Wheel Rollout'],['sidePlank','Side Plank'],['hangingLegRaise','Hanging Leg Raise']
    ]},
    {key:'cardio',label:'Cardio/Warm-up',items:[
      ['rope','Rope'],['armCircle','Arm Circle']
    ]}
  ];
  const _s=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
  let out='';
  SPORT_CATS.forEach(cat=>{
    const catData=(h.sport||{})[cat.key]||{};
    const catTotal=_s(catData);
    if(!sportSel[cat.key]){
      const best=cat.items.reduce((a,b)=>(catData[b[0]]||0)>(catData[a[0]]||0)?b:a,cat.items[0]);
      if((catData[best[0]]||0)>0) sportSel[cat.key]=best[0];
    }
    const sel=sportSel[cat.key];
    let opts='<option value=""'+(sel?'':' selected')+'>— Select exercise —</option>';
    cat.items.forEach(([k,lbl])=>{
      const cnt=catData[k]||0;
      opts+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+lbl+(cnt>0?' ('+cnt+')':'')+'</option>';
    });
    out+='<div class="card" style="margin-bottom:10px">';
    out+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
    out+='<span style="font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--health)">'+cat.label.toUpperCase()+'</span>';
    out+='<span style="font-family:var(--mono);font-size:11px;color:'+(catTotal>0?'var(--health)':'var(--mute)')+'">'+catTotal+' pts</span>';
    out+='</div>';
    out+='<select class="sport-sel" data-cat="'+cat.key+'" style="width:100%;background:var(--track-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px;color:var(--text);cursor:pointer;margin-bottom:'+(sel?'10px':'0')+'">'+opts+'</select>';
    if(sel){
      const selLabel=(cat.items.find(([k])=>k===sel)||[])[1]||sel;
      const cnt=catData[sel]||0;
      out+='<div class="checkline"><span style="flex:1;font-size:13px">'+selLabel+'</span>';
      out+='<div class="count-btns">';
      out+='<button class="sport-cnt" data-cat="'+cat.key+'" data-key="'+sel+'" data-d="-1">−</button>';
      out+='<span class="count-val">'+cnt+'</span>';
      out+='<button class="sport-cnt" data-cat="'+cat.key+'" data-key="'+sel+'" data-d="1">+</button>';
      out+='</div></div>';
    }
    out+='</div>';
  });
  return out;
}

function yesNoRow(key, label, val){

      syncDate(); syncAmt(); syncNote();
      if(!date||editAmt<=0) return;
      if(type==='expense' && category==='Other' && !editNote.trim()) return;
      const list = DB.transactions();
      const idx = list.findIndex(t=>t.id===tx.id);
      if(idx===-1) return;
      const updated = {id:tx.id, date, type, amount:editAmt, category:type==='expense'?category:''};

/* ============ MUSIC REPORT ============ */
function renderMusicReport(s){
  const all=DB.allDays();
  const allDates=Object.keys(all).sort();

  let periodDates;
  if(musicReportPeriod==='today'){
    periodDates=allDates.filter(d=>d===EDIT_DATE);
  } else if(musicReportPeriod==='week'){
    const d=new Date(EDIT_DATE);
    const daysSinceMon=(d.getDay()+6)%7;
    d.setDate(d.getDate()-daysSinceMon);
    const weekStart=d.toISOString().slice(0,10);
    periodDates=allDates.filter(d=>d>=weekStart&&d<=EDIT_DATE);
  } else if(musicReportPeriod==='3week'){
    const cut=new Date(EDIT_DATE); cut.setDate(cut.getDate()-20);
    const cutStr=cut.toISOString().slice(0,10);
    periodDates=allDates.filter(d=>d>=cutStr&&d<=EDIT_DATE);
  } else if(musicReportPeriod==='month'){
    periodDates=allDates.filter(d=>d.startsWith(EDIT_DATE.slice(0,7)));
  } else if(musicReportPeriod==='3month'){
    const cut=new Date(EDIT_DATE); cut.setMonth(cut.getMonth()-3);
    const cutStr=cut.toISOString().slice(0,10);
    periodDates=allDates.filter(d=>d>=cutStr);
  } else {
    periodDates=allDates;
  }

  const periodRecs=periodDates.map(d=>all[d]).filter(Boolean);
  const musicRecs=periodRecs.filter(r=>r.music);
  const sessionRecs=musicRecs.filter(r=>(r.music.sessions||[]).length>0);
  const sessionCount=sessionRecs.length;
  const totalMins=sessionRecs.reduce((a,r)=>a+(r.music.sessions||[]).reduce((b,s)=>b+(s.minutes||0),0),0);
  const avgMins=sessionCount>0&&totalMins>0?Math.round(totalMins/sessionCount):0;

  const workedIds=sessionRecs.flatMap(r=>(r.music.sessions||[]).map(s=>s.workedOn).filter(w=>w&&w!=='instrumentals'));
  const workedSet=[...new Set(workedIds)];
  const instrDays=sessionRecs.filter(r=>(r.music.sessions||[]).some(s=>s.workedOn==='instrumentals')).length;
  const projList=DB.projects();
  const projBreakdown=workedSet.map(id=>({
    name:(projList.find(p=>p.id===id)||{name:id}).name,
    days:sessionRecs.filter(r=>(r.music.sessions||[]).some(s=>s.workedOn===id)).length
  })).sort((a,b)=>b.days-a.days);

  // Group period dates by Monday-start calendar week
  function mondayOf(ds){ const d=new Date(ds); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toISOString().slice(0,10); }
  const weekMap={};
  periodDates.forEach(ds=>{
    const wk=mondayOf(ds);
    if(!weekMap[wk]) weekMap[wk]={mins:0};
    const rec=all[ds];
    if(rec&&rec.music) weekMap[wk].mins+=(rec.music.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0);
  });
  const weeks=Object.keys(weekMap).sort();

  const fmtM=m=>m>=60?Math.floor(m/60)+'h'+(m%60>0?' '+Math.round(m%60)+'m':''):(m+'m');

  // Quality stats — only sessions that have a rating set
  const allRatings=sessionRecs.flatMap(r=>(r.music.sessions||[]).map(s=>s.quality).filter(q=>q!=null));
  const avgQuality=allRatings.length>0?(allRatings.reduce((a,q)=>a+q,0)/allRatings.length):null;

  // Pie data — time by project for selected period
  const PIE_COLORS=['var(--amber)','var(--green)','var(--cyan)','var(--red)'];
  const pieMap={};
  let instrPieMins=0;
  sessionRecs.forEach(r=>{
    (r.music.sessions||[]).forEach(s=>{
      if(s.workedOn==='instrumentals'){
        instrPieMins+=(s.minutes||0);
      } else if(s.workedOn){
        if(!pieMap[s.workedOn]) pieMap[s.workedOn]=0;
        pieMap[s.workedOn]+=(s.minutes||0);
      }
    });
  });
  const pieCats=[];
  Object.entries(pieMap).sort((a,b)=>b[1]-a[1]).forEach(([id,mins],i)=>{
    const name=(projList.find(p=>p.id===id)||{name:id}).name;
    pieCats.push({name,mins,pct:0,color:PIE_COLORS[i%PIE_COLORS.length]});
  });
  if(instrPieMins>0) pieCats.push({name:'Instrumentals',mins:instrPieMins,pct:0,color:'var(--music)'});
  const pieTotalMins=pieCats.reduce((a,c)=>a+c.mins,0);
  pieCats.forEach(c=>{ c.pct=pieTotalMins>0?Math.round(c.mins/pieTotalMins*100):0; });

  // Prior-period computation for delta badges
  let priorDates=null;
  if(musicReportPeriod==='today'){
    const prev=new Date(EDIT_DATE); prev.setDate(prev.getDate()-1);
    const prevStr=prev.toISOString().slice(0,10);
    priorDates=allDates.filter(d=>d===prevStr);
  } else if(musicReportPeriod==='week'){
    const d=new Date(EDIT_DATE); d.setDate(d.getDate()-((d.getDay()+6)%7));
    const pe=new Date(d); pe.setDate(pe.getDate()-1);
    const ps=new Date(d); ps.setDate(ps.getDate()-7);
    priorDates=allDates.filter(d=>d>=ps.toISOString().slice(0,10)&&d<=pe.toISOString().slice(0,10));
  } else if(musicReportPeriod==='3week'){
    const ts=new Date(EDIT_DATE); ts.setDate(ts.getDate()-20);
    const pe=new Date(ts); pe.setDate(pe.getDate()-1);
    const ps=new Date(pe); ps.setDate(ps.getDate()-20);
    priorDates=allDates.filter(d=>d>=ps.toISOString().slice(0,10)&&d<=pe.toISOString().slice(0,10));
  } else if(musicReportPeriod==='month'){
    const d=new Date(EDIT_DATE.slice(0,7)+'-01'); d.setMonth(d.getMonth()-1);
    const pm=d.toISOString().slice(0,7);
    priorDates=allDates.filter(d=>d.startsWith(pm));
  } else if(musicReportPeriod==='3month'){
    const d=new Date(EDIT_DATE); d.setMonth(d.getMonth()-3);
    const pe=new Date(d); pe.setDate(pe.getDate()-1);
    const ps=new Date(pe); ps.setMonth(ps.getMonth()-3);
    priorDates=allDates.filter(d=>d>=ps.toISOString().slice(0,10)&&d<=pe.toISOString().slice(0,10));
  }
  // 'all' → priorDates stays null → no badges shown

  let priorCount=null,priorTotal=null,priorAvg=null;
  if(priorDates!==null){
    const pRecs=priorDates.map(d=>all[d]).filter(Boolean);
    const pSess=pRecs.filter(r=>r.music&&(r.music.sessions||[]).length>0);
    priorCount=pSess.length;
    priorTotal=pSess.reduce((a,r)=>a+(r.music.sessions||[]).reduce((b,s)=>b+(s.minutes||0),0),0);
    priorAvg=priorCount>0&&priorTotal>0?Math.round(priorTotal/priorCount):0;
  }

  // Delta badge: returns '' if no prior period, '' if both 0 (noise guard), '' if no change
  function dBadge(curr,prev,fmt){
    if(prev===null) return '';
    if(curr===0&&prev===0) return '';
    const delta=curr-prev;
    if(delta===0) return '';
    const up=delta>0;
    const abs=Math.abs(delta);
    const disp=fmt?fmt(abs):(abs+'');
    return `<span class="delta-pill" style="background:${up?'var(--delta-up-bg)':'var(--delta-dn-bg)'};color:${up?'var(--green)':'var(--red)'};font-size:8px;padding:1px 5px;border-radius:6px;font-family:var(--mono);display:inline-block;margin-top:3px">${up?'+':'−'}${disp}</span>`;
  }

  const pLabel={'today':'TODAY','week':'THIS WEEK','3week':'LAST 3 WEEKS','month':'THIS MONTH','3month':'LAST 3 MONTHS','all':'ALL TIME'}[musicReportPeriod]||'ALL TIME';

  // All-time per-project stats for radar (Active + Done only, not period-filtered)
  const RADAR_COLORS=['var(--amber)','var(--green)','var(--cyan)','var(--red)'];
  const radarRawProjs=DB.projects().filter(p=>p.status==='active'||p.status==='done');
  const todayMs=new Date(EDIT_DATE).getTime();
  const projStats=radarRawProjs.map((p,i)=>{
    const pDateEntries=Object.entries(all).filter(([,rec])=>rec.music&&(rec.music.sessions||[]).some(s=>s.workedOn===p.id));
    const pDays=pDateEntries.map(([,rec])=>rec);
    const lastDate=pDateEntries.length>0?pDateEntries.map(([d])=>d).sort().reverse()[0]:null;
    const daysSince=lastDate?Math.round((todayMs-new Date(lastDate).getTime())/86400000):null;
    const recency=lastDate?Math.max(0,Math.round((1-daysSince/60)*100)):0;
    const stalled=p.status==='active'&&daysSince!==null&&daysSince>14;
    const pMins=pDays.reduce((a,d)=>a+(d.music.sessions||[]).filter(s=>s.workedOn===p.id).reduce((b,s)=>b+(s.minutes||0),0),0);
    const allPRatings=pDays.flatMap(d=>(d.music.sessions||[]).filter(s=>s.workedOn===p.id).map(s=>s.quality).filter(q=>q!=null));
    const pQual=allPRatings.length?allPRatings.reduce((a,q)=>a+q,0)/allPRatings.length:null;
    return {id:p.id,name:p.name,status:p.status,progress:p.progress,sessions:pDays.length,minutes:pMins,quality:pQual,lastDate,daysSince,recency,stalled,color:RADAR_COLORS[i%4]};
  });
  const maxSess=Math.max(...projStats.map(p=>p.sessions),1);
  const maxMins=Math.max(...projStats.map(p=>p.minutes),1);
  const radarProjs=projStats.map(p=>({
    id:p.id,name:p.name,status:p.status,color:p.color,
    values:{
      progress:p.progress,
      sessions:Math.round(p.sessions/maxSess*100),
      minutes:Math.round(p.minutes/maxMins*100),
      quality:p.quality!==null?Math.round(p.quality*20):0,
      recency:p.recency
    }
  }));

  let html=
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">`+
    `<button class="btn-ghost" id="music-report-back" style="border-color:var(--music);color:var(--music);padding:6px 14px;font-size:12px">← Back</button>`+
    `<span style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em">MUSIC REPORT</span>`+
    `</div>`;

  const row1=[['today','Today'],['week','This Week'],['3week','Last 3 Weeks']];
  const row2=[['month','This Month'],['3month','Last 3 Months'],['all','All Time']];
  html+=`<div class="btn-group" style="margin-bottom:6px">`;
  row1.forEach(([key,label])=>{ html+=`<button class="opt-btn music-period${musicReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div><div class="btn-group" style="margin-bottom:14px">`;
  row2.forEach(([key,label])=>{ html+=`<button class="opt-btn music-period${musicReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div>`;

    html+=`<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:20px">No music data logged for this period</div>`;
  } else {
    html+=`<div class="card" style="padding:12px 14px">`;
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--sep-alt)">`;
    html+=`<div><div style="font-family:DM Serif Display,serif;font-size:22px;font-weight:700;color:var(--music)">${sessionCount}</div><div style="font-family:var(--mono);font-size:8px;color:var(--mute)">SESSIONS</div>${dBadge(sessionCount,priorCount)}</div>`;
    html+=`<div><div style="font-family:DM Serif Display,serif;font-size:22px;font-weight:700;color:var(--music)">${totalMins>0?fmtM(totalMins):'--'}</div><div style="font-family:var(--mono);font-size:8px;color:var(--mute)">TOTAL</div>${dBadge(totalMins,priorTotal,fmtM)}</div>`;
    html+=`<div><div style="font-family:DM Serif Display,serif;font-size:22px;font-weight:700;color:var(--music)">${avgMins>0?fmtM(avgMins):'--'}</div><div style="font-family:var(--mono);font-size:8px;color:var(--mute)">AVG SESSION</div>${dBadge(avgMins,priorAvg,fmtM)}</div>`;
    html+=`</div>`;
    html+=musicWeekBarsSvg(weeks,weekMap);
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--sep-alt)">`;
    html+=`<span style="font-family:var(--mono);font-size:8px;color:var(--mute)">AVG QUALITY</span>`;
    html+=`<span style="font-family:DM Serif Display,serif;font-size:16px;font-weight:700;color:var(--music)">${avgQuality!==null?avgQuality.toFixed(1):'--'}<span style="font-size:10px;color:var(--mute)">/5</span></span>`;
    html+=`</div>`;
    html+=`</div>`;
  }

  // ── TIME BY PROJECT pie (period-scoped) ──
  if(pieCats.length>0){
    const pieStat=
      `<div style="font-family:var(--mono);font-size:9px;color:var(--mute);text-align:center;letter-spacing:0.05em;margin-top:6px">TOTAL STUDIO TIME</div>`+
      `<div style="font-family:DM Serif Display,serif;font-size:28px;font-weight:700;color:var(--music);text-align:center;line-height:1;margin-top:1px">${fmtM(pieTotalMins)}</div>`;
    html+=sectionLabel(`TIME BY PROJECT — ${pLabel}`,'var(--music)');
    html+=`<div class="card" style="padding:12px 14px">`;
    html+=timeBudgetPieHtml(pieCats,pieTotalMins,pieStat);
    html+=`</div>`;
  }

  // ── RECENT PATTERN heatmap (fixed 12-week, not period-filtered) ──
  html+=sectionLabel('RECENT PATTERN — LAST 12 WEEKS','var(--music)');
  html+=`<div class="card" style="padding:12px 14px">`;
  html+=musicHeatmapSvg(all);
  html+=`<div style="display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:8px">`;
  html+=`<span style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-right:2px">Less</span>`;
  html+=`<span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--track-bg);opacity:0.35"></span>`;
  html+=`<span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--music);opacity:0.3"></span>`;
  html+=`<span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--music);opacity:0.6"></span>`;
  html+=`<span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--music);opacity:0.9"></span>`;
  html+=`<span style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-left:2px">More</span>`;
  html+=`</div>`;
  html+=`</div>`;

  // ── PROJECT COMPARISON — radar + sortable table ──
  if(radarProjs.length>0){
    const radarLabel=radarProjs.length===1?'PROJECT PROFILE':'PROJECT COMPARISON';
    const activeCount=projStats.filter(p=>p.status==='active').length;
    const stalledCount=projStats.filter(p=>p.stalled).length;
    const bestQ=projStats.filter(p=>p.quality!==null).sort((a,b)=>b.quality-a.quality)[0];
    const macroStr=`${activeCount} active · ${stalledCount} stalled`+(bestQ?` · top quality: ${bestQ.name} ${bestQ.quality.toFixed(1)}/5`:'');
    html+=sectionLabel(radarLabel,'var(--music)');
    html+=`<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:6px;padding:0 2px">${macroStr}</div>`;
    html+=`<div class="card" style="padding:12px 14px">`;
    const visibleRadar=radarProjs.filter(p=>!musicRadarHidden.includes(p.id));
    html+=musicRadarSvg(visibleRadar.length?visibleRadar:radarProjs);
    if(visibleRadar.length===0) html+=`<div style="text-align:center;font-family:var(--mono);font-size:8px;color:var(--mute);margin-top:-6px;margin-bottom:6px">all hidden — tap a dot to show</div>`;
    html+=`<div style="height:8px"></div>`;
    const SH=(col,lbl)=>{
      const on=musicRadarSort===col;
      const arrow=on?(musicRadarSortDir<0?'↓':'↑'):'↕';
      return `<button data-radar-sort="${col}" style="background:none;border:none;padding:0;font-family:var(--mono);font-size:7px;color:${on?'var(--music)':'var(--mute)'};cursor:pointer;text-align:left;width:100%">${lbl} ${arrow}</button>`;
    };
    html+=`<div style="display:grid;grid-template-columns:1fr 36px 52px 36px 58px;gap:2px 4px;padding:4px 2px 4px 6px;border-bottom:1px solid var(--sep-alt)">`;
    html+=SH('name','NAME')+SH('sessions','SESS')+SH('mins','TIME')+SH('quality','QUAL')+SH('last','LAST');
    html+=`</div>`;
    const sortedStats=[...projStats].sort((a,b)=>{
      let va,vb;
      if(musicRadarSort==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase();return musicRadarSortDir*(va>vb?1:va<vb?-1:0);}
      else if(musicRadarSort==='sessions'){va=a.sessions;vb=b.sessions;}
      else if(musicRadarSort==='mins'){va=a.minutes;vb=b.minutes;}
      else if(musicRadarSort==='quality'){va=a.quality??-1;vb=b.quality??-1;}
      else{va=a.recency;vb=b.recency;}
      return musicRadarSortDir*(va-vb);
    });
    sortedStats.forEach(p=>{
      const hidden=musicRadarHidden.includes(p.id);
      const fmtLast=p.lastDate?new Date(p.lastDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'--';
      const stalledTag=p.stalled?`<span style="color:var(--amber);font-family:var(--mono);font-size:7px;margin-left:3px">⚠${p.daysSince}d</span>`:'';
      const doneTag=p.status==='done'?`<span style="color:var(--green);font-family:var(--mono);font-size:7px;margin-left:3px">✓</span>`:'';
      html+=`<div style="display:grid;grid-template-columns:1fr 36px 52px 36px 58px;gap:2px 4px;padding:5px 2px 5px 2px;border-bottom:1px solid var(--sep-alt);align-items:center;opacity:${hidden?0.35:1}">`;
      html+=`<div style="display:flex;align-items:center;gap:5px;min-width:0">`;
      html+=`<button data-radar-toggle="${p.id}" style="width:10px;height:10px;border-radius:2px;background:${p.color};border:none;cursor:pointer;flex-shrink:0;opacity:${hidden?0.25:0.85};padding:0"></button>`;
      html+=`<span style="font-size:10px;font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>${stalledTag}${doneTag}`;
      html+=`</div>`;
      html+=`<span style="font-family:var(--mono);font-size:9px;color:var(--text);text-align:right">${p.sessions}</span>`;
      html+=`<span style="font-family:var(--mono);font-size:9px;color:var(--text);text-align:right">${fmtM(p.minutes)}</span>`;
      html+=`<span style="font-family:var(--mono);font-size:9px;color:${p.quality!==null?'var(--music)':'var(--mute)'};text-align:right">${p.quality!==null?p.quality.toFixed(1):'--'}</span>`;
      html+=`<span style="font-family:var(--mono);font-size:8px;color:var(--mute);text-align:right">${fmtLast}</span>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  // ── PROJECT PIPELINE — CURRENT STATE (not period-filtered) ──
  const projects=DB.projects();
  const planned=projects.filter(p=>p.status==='planned');
  const active=projects.filter(p=>p.status==='active');
  const done=projects.filter(p=>p.status==='done');

  html+=sectionLabel('PROJECT PIPELINE — CURRENT STATE','var(--music)');
  html+=`<div class="card" style="padding:12px 14px">`;

  // Pipeline funnel bars
  const maxCount=Math.max(1,planned.length,active.length,done.length);
  html+=`<div style="padding-bottom:2px;border-bottom:1px solid var(--sep-alt);margin-bottom:10px">`;
  html+=progressRow('PLANNED',Math.round(planned.length/maxCount*100),planned.length,'var(--mute)');
  html+=progressRow('ACTIVE',Math.round(active.length/maxCount*100),active.length,'var(--music)');
  html+=progressRow('DONE',Math.round(done.length/maxCount*100),done.length,'var(--green)');
  html+=`</div>`;

  if(active.length){
    html+=`<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:6px">ACTIVE</div>`;
    const projStatus=pct=>pct===0?'Just started':pct<=40?'In progress':pct<=79?'Halfway there':'Nearly done';
    active.forEach(p=>{ html+=progressRow(p.name,p.progress,p.progress+'% · '+projStatus(p.progress),'var(--music)'); });
    if(done.length) html+=`<div style="height:10px"></div>`;
  }
  if(done.length){
    html+=`<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:4px">DONE</div>`;
    done.forEach(p=>{
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px"><span style="color:var(--green)">&#9632;</span><span style="color:var(--mute)">${p.name}</span></div>`;
    });
  }
  if(!planned.length&&!active.length&&!done.length){
    html+=`<div style="font-size:11px;color:var(--mute);text-align:center;padding:8px 0">No projects yet</div>`;
  }

  // Period-scoped touches — within this card, clearly labeled
  html+=`<div style="border-top:1px solid var(--sep-alt);margin-top:8px;padding-top:10px">`;
  html+=`<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:6px">WORKED THIS PERIOD</div>`;
  if(workedSet.length===0&&instrDays===0){
    html+=`<div style="font-size:11px;color:var(--mute)">No sessions this period</div>`;
  } else {
    projBreakdown.forEach((p,idx)=>{
      const isLast=idx===projBreakdown.length-1&&instrDays===0;
      html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;${isLast?'':'border-bottom:1px solid var(--sep-alt);'}font-size:11px"><span>${p.name}</span><span style="font-family:var(--mono);color:var(--music)">${p.days} day${p.days!==1?'s':''}</span></div>`;
    });
    if(instrDays>0){
      html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px"><span>Instrumentals</span><span style="font-family:var(--mono);color:var(--music)">${instrDays} day${instrDays!==1?'s':''}</span></div>`;
    }
  }
  html+=`</div>`;
  html+=`</div>`; // close pipeline card

  s.innerHTML=html;
  s.querySelector('#music-report-back').addEventListener('click',()=>{ musicReportOpen=false; renderMusic(); });
  s.querySelectorAll('.music-period').forEach(btn=>{ btn.addEventListener('click',()=>{ musicReportPeriod=btn.dataset.period; renderMusicReport(s); }); });
  s.querySelectorAll('[data-radar-sort]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const col=btn.dataset.radarSort;
      if(musicRadarSort===col) musicRadarSortDir*=-1;
      else{musicRadarSort=col;musicRadarSortDir=-1;}
      renderMusicReport(s);
    });
  });
  s.querySelectorAll('[data-radar-toggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.radarToggle;
      const idx=musicRadarHidden.indexOf(id);
      if(idx>=0) musicRadarHidden.splice(idx,1); else musicRadarHidden.push(id);
      renderMusicReport(s);
    });
  });
}

/* ============ MUSIC ============ */
function renderMusic(){
  const s = document.getElementById('s-music');
  if(musicReportOpen){ renderMusicReport(s); return; }
  const projects = DB.projects();
  const active = projects.filter(p=>p.status==='active');
  const planned = projects.filter(p=>p.status==='planned');
  const done = projects.filter(p=>p.status==='done');

  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">`+
    `<button class="btn-ghost" id="open-music-report" style="border-color:var(--music);color:var(--music);padding:6px 14px;font-size:12px">Report →</button>`+
    `</div>`;
  html += compareDayHtml('music','var(--music)');
  html += sectionLabel('ACTIVE PROJECTS','var(--music)');
  html += '<button class="btn-ghost" id="add-project" style="border-color:var(--music);color:var(--music);margin-bottom:10px">+ Log or add project</button>';
  html += '<div class="grid2">';
  active.forEach(p=>{
    html += '<div class="card proj-card" data-proj="'+p.id+'">'+'<div class="name">'+p.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+p.progress+'%;background:var(--music)"></div></div><div class="meta">'+p.progress+'%, touch to update</div></div>';
  });
  html += '</div>';
  if(!active.length) html += '<div style="font-size:11px;color:var(--mute);margin-bottom:10px">No active projects yet.</div>';

  html += sectionLabel('PLANNED');
  html += '<div class="card">'+(planned.length ? planned.map(p=>'<div class="checkline" data-plan="'+p.id+'"><span class="box">&#9633;</span>'+p.name+'</div>').join('') : '<div style="font-size:11px;color:var(--mute)">Nothing planned yet.</div>')+'</div>';

  html += sectionLabel('DONE / HISTORY');
  html += '<div class="card">'+(done.length ? done.map(p=>'<div class="checkline"><span class="box" style="color:var(--green)">&#9632;</span>'+p.name+'</div>').join('') : '<div style="font-size:11px;color:var(--mute)">Nothing finished yet.</div>')+'</div>';

  html += sectionLabel('TODAY','var(--music)');
  const mussSess = day.music.sessions || [];
  html += '<div class="card">';
  if(mussSess.length){
    mussSess.forEach((ms,msi)=>{
      const allProjs = DB.projects();
      const mpn = ms.workedOn==='instrumentals'?'Instrumentals':ms.workedOn?(allProjs.find(p=>p.id===ms.workedOn)||{}).name||ms.workedOn:'—';
      const meta=[];
      if(ms.minutes!=null) meta.push(ms.minutes+' min');
      if(ms.quality!=null) meta.push('★'+ms.quality);
      if(ms.startTime&&ms.endTime) meta.push(ms.startTime+' → '+ms.endTime);
      html += '<div class="checkline" style="align-items:flex-start;gap:8px;padding:6px 0">'
        +'<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">'+mpn+'</div>'
        +(meta.length?'<div style="font-size:11px;color:var(--mute);margin-top:2px;font-family:var(--mono)">'+meta.join(' · ')+'</div>':'')
        +'</div>'
        +'<button data-del-sess="'+msi+'" style="background:none;border:none;color:var(--mute);font-size:20px;cursor:pointer;padding:0 2px;line-height:1" aria-label="Remove session">×</button>'
        +'</div>';
    });
    html += '<div style="height:4px"></div>';
  } else {
    html += '<div style="font-size:11px;color:var(--mute);margin-bottom:8px">No sessions logged yet.</div>';
  }
  html += '<button class="btn-ghost" id="add-session-btn" style="border-color:var(--music);color:var(--music);width:100%;margin-top:2px">+ Add session</button>';
  if(musicDraftActive){
    const drvMins=(musicDraft.startTime&&musicDraft.endTime)?deriveMinutes(musicDraft.startTime,musicDraft.endTime):null;
    const showMins=(musicDraft.minutesSource==='manual'&&musicDraft.minutes!=null)?musicDraft.minutes:(drvMins!=null?drvMins:(musicDraft.minutes!=null?musicDraft.minutes:''));
    html += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">WORKED ON</label>';
    html += '<select class="input" id="draft-worked-on"><option value="">Select</option>';
    active.forEach(p=>{ html += '<option value="'+p.id+'" '+(musicDraft.workedOn===p.id?'selected':'')+'>'+p.name+'</option>'; });
    html += '<option value="instrumentals" '+(musicDraft.workedOn==='instrumentals'?'selected':'')+'>Instrumentals</option></select>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">TIME (OPTIONAL)</label>';
    html += '<div style="display:flex;gap:8px;margin-top:4px">'
      +'<button class="btn-ghost" id="draft-start" style="flex:1;font-family:var(--mono);font-size:12px;padding:8px">Start: '+(musicDraft.startTime||'--:--')+'</button>'
      +'<button class="btn-ghost" id="draft-end" style="flex:1;font-family:var(--mono);font-size:12px;padding:8px">End: '+(musicDraft.endTime||'--:--')+'</button>'
      +'</div>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">DURATION (MINUTES)</label>';
    html += '<input type="number" class="input" id="draft-mins" value="'+showMins+'" placeholder="How long" min="0">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">QUALITY</label>';
    html += '<div class="btn-group">'+[1,2,3,4,5].map(v=>'<button class="opt-btn sq-btn draft-sq'+(musicDraft.quality===v?' sel':'')+'" data-dsq="'+v+'">'+v+'</button>').join('')+'</div>';
    html += '<div style="display:flex;gap:8px;margin-top:12px">'
      +'<button class="btn-cancel" id="draft-cancel" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Cancel</button>'
      +'<button class="btn-primary" id="draft-save" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Save Session</button>'
      +'</div>';
    html += '</div>';
  }
  html += '</div>';

  html += sectionLabel('NOTES', 'var(--music)');
  html += '<div class="card">'+'<textarea class="input textarea" id="music-notes" placeholder="Notes for today">'+(day.music.notes||'')+'</textarea></div>';
  html += sectionLabel('MONTH TO DATE');
  const avg = monthAvg(musicScore, EDIT_DATE.slice(0,7));
  const allDaysMusic = DB.allDays();
  const monthPrefixMusic = EDIT_DATE.slice(0,7);
  const instruCount = Object.keys(allDaysMusic).filter(k=>k.startsWith(monthPrefixMusic) && allDaysMusic[k].music && (allDaysMusic[k].music.sessions||[]).some(s=>s.workedOn==='instrumentals')).length;
  html += '<div class="card">'+progressRow('Session logging rate', avg, avg+'%', 'var(--music)')+
    '<div style="display:flex;justify-content:space-between;padding-top:4px;font-size:11px;"><span>Instrumentals sessions</span><span style="font-family:var(--mono);color:var(--music)">'+instruCount+' this month</span></div></div>';

  const wVals=[]; for(let i=6;i>=0;i--){ const dd=new Date(EDIT_DATE); dd.setDate(dd.getDate()-i); const ds=dd.toISOString().slice(0,10); let m=null; if(i===0){const v=(day.music.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0);if(v>0)m=v;}else if(allDaysMusic[ds]&&allDaysMusic[ds].music){const v=(allDaysMusic[ds].music.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0);if(v>0)m=v;} wVals.push(m); }
  const wChart=waveChartSvg(wVals,'var(--music)','var(--red)');
  if(wChart){ const wLbls=[]; for(let i=6;i>=0;i--){const dd=new Date(EDIT_DATE);dd.setDate(dd.getDate()-i);wLbls.push('<span>'+dd.toLocaleDateString('en-US',{weekday:'short'}).charAt(0)+'</span>');} html+=sectionLabel('STUDIO MINUTES — LAST 7 DAYS','var(--music)')+'<div class="card">'+wChart+'<div class="trend-labels">'+wLbls.join('')+'</div></div>'; }

  const musicPrevAvg = monthAvg(musicScore, prevMonthPrefix());
  html += sectionLabel('THIS MONTH VS LAST MONTH','var(--music)');
  html += '<div class="card">'+momCompareHtml(avg, musicPrevAvg, 'var(--music)')+'</div>';

  html += '<button class="save-btn" id="save-music">'+saveBtnLabel()+'</button>';
  s.innerHTML = html;
  wireCmpArrows(s, 'music', renderMusic);

  document.getElementById('add-project').addEventListener('click', openAddProjectModal);
  s.querySelectorAll('[data-proj]').forEach(c=>{
    c.addEventListener('click', ()=>{ openUpdateProjectModal(c.dataset.proj); });
  });
  s.querySelectorAll('[data-plan]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const list = DB.projects();
      const p = list.find(x=>x.id===c.dataset.plan);
      p.status='active';
      DB.saveProjects(list);
      renderMusic();
    });
  });
  // Session delete buttons
  s.querySelectorAll('[data-del-sess]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.delSess);
      if(!day.music.sessions) day.music.sessions=[];
      day.music.sessions.splice(i,1);
      renderMusic();
    });
  });
  // Add session button
  const addSessBtn=document.getElementById('add-session-btn');
  if(addSessBtn) addSessBtn.addEventListener('click',()=>{
    musicDraftActive=true;
    musicDraft={workedOn:'',startTime:null,endTime:null,minutes:null,minutesSource:'unset',quality:null};
    renderMusic();
  });
  // Draft form handlers
  if(musicDraftActive){
    const draftStartBtn=document.getElementById('draft-start');
    const draftEndBtn=document.getElementById('draft-end');
    const draftMinsEl=document.getElementById('draft-mins');
    const syncDraftFromDom=()=>{
      const woEl=document.getElementById('draft-worked-on');
      if(woEl) musicDraft.workedOn=woEl.value;
      const mEl=document.getElementById('draft-mins');
      if(mEl&&mEl.value!==''){musicDraft.minutes=parseInt(mEl.value)||0;musicDraft.minutesSource='manual';}
    };
    if(draftStartBtn) draftStartBtn.addEventListener('click',()=>{
      syncDraftFromDom();
      openTimePickerModal('Start time',musicDraft.startTime||'07:00',v=>{
        musicDraft.startTime=v;
        if(musicDraft.startTime&&musicDraft.endTime&&musicDraft.minutesSource!=='manual'){
          musicDraft.minutes=deriveMinutes(musicDraft.startTime,musicDraft.endTime);
        }
        renderMusic();
      });
    });
    if(draftEndBtn) draftEndBtn.addEventListener('click',()=>{
      syncDraftFromDom();
      openTimePickerModal('End time',musicDraft.endTime||'09:00',v=>{
        musicDraft.endTime=v;
        if(musicDraft.startTime&&musicDraft.endTime&&musicDraft.minutesSource!=='manual'){
          musicDraft.minutes=deriveMinutes(musicDraft.startTime,musicDraft.endTime);
        }
        renderMusic();
      });
    });
    if(draftMinsEl) draftMinsEl.addEventListener('input',()=>{
      musicDraft.minutesSource='manual';
      musicDraft.minutes=draftMinsEl.value!==''?parseInt(draftMinsEl.value):null;
    });
    s.querySelectorAll('.draft-sq').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const v=parseInt(btn.dataset.dsq);
        musicDraft.quality=(musicDraft.quality===v)?null:v;
        s.querySelectorAll('.draft-sq').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.dsq)===musicDraft.quality));
      });
    });
    const draftCancelBtn=document.getElementById('draft-cancel');
    if(draftCancelBtn) draftCancelBtn.addEventListener('click',()=>{ musicDraftActive=false; musicDraft={}; renderMusic(); });
    const draftSaveBtn=document.getElementById('draft-save');
    if(draftSaveBtn) draftSaveBtn.addEventListener('click',()=>{
      const woEl=document.getElementById('draft-worked-on');
      if(woEl) musicDraft.workedOn=woEl.value;
      const mEl=document.getElementById('draft-mins');
      if(mEl&&mEl.value!==''){
        const typed=parseInt(mEl.value)||0;
        musicDraft.minutes=typed;
        if(musicDraft.startTime&&musicDraft.endTime){
          musicDraft.minutesSource=(typed!==deriveMinutes(musicDraft.startTime,musicDraft.endTime))?'manual':'derived';
        } else {
          musicDraft.minutesSource='manual';
        }
      } else if(musicDraft.startTime&&musicDraft.endTime){
        musicDraft.minutes=deriveMinutes(musicDraft.startTime,musicDraft.endTime);
        musicDraft.minutesSource='derived';
      }
      if(!day.music.sessions) day.music.sessions=[];
      day.music.sessions.push({
        workedOn: musicDraft.workedOn||'',
        minutes: musicDraft.minutes!=null?musicDraft.minutes:0,
        quality: musicDraft.quality!=null?musicDraft.quality:null,
        startTime: musicDraft.startTime||null,
        endTime: musicDraft.endTime||null,
        minutesSource: musicDraft.minutesSource||'manual'
      });
      musicDraftActive=false;
      musicDraft={};
      renderMusic();
    });
  }
  // Save day
  document.getElementById('save-music').addEventListener('click',()=>{
    const notesEl=document.getElementById('music-notes');
    if(notesEl) day.music.notes=notesEl.value;
    const list=DB.projects();
    let changed=false;
    (day.music.sessions||[]).forEach(ms=>{
      if(ms.workedOn&&ms.workedOn!=='instrumentals'){
        const p=list.find(x=>x.id===ms.workedOn);
        if(p){p.lastTouched=EDIT_DATE;changed=true;}
      }
    });
    if(changed) DB.saveProjects(list);
    saveDayNow();
  });
  document.getElementById('open-music-report').addEventListener('click',()=>{ musicReportOpen=true; renderMusic(); });
  patchAriaRoles(s);
}

/* ============ FINANCE ============ */
function renderFinanceReport(s){
  const FIN_CATS=['Rent','Food','Business costs','Transport','Weed','Cigarettes','Given to people','Home bills','Other'];
  const allTxs=DB.transactions();

  // Period filter
  let periodTxs;
  if(financeReportPeriod==='today'){
    periodTxs=allTxs.filter(t=>t.date===EDIT_DATE);
  } else if(financeReportPeriod==='week'){
    const d=new Date(EDIT_DATE);
    const daysSinceMon=(d.getDay()+6)%7;
    d.setDate(d.getDate()-daysSinceMon);
    const weekStart=d.toISOString().slice(0,10);
    periodTxs=allTxs.filter(t=>t.date>=weekStart&&t.date<=EDIT_DATE);
  } else if(financeReportPeriod==='3week'){
    const cut=new Date(EDIT_DATE);
    cut.setDate(cut.getDate()-20);
    const cutStr=cut.toISOString().slice(0,10);
    periodTxs=allTxs.filter(t=>t.date>=cutStr&&t.date<=EDIT_DATE);
  } else if(financeReportPeriod==='month'){
    periodTxs=allTxs.filter(t=>t.date.startsWith(EDIT_DATE.slice(0,7)));
  } else if(financeReportPeriod==='3month'){
    const cut=new Date(EDIT_DATE);
    cut.setMonth(cut.getMonth()-3);
    const cutStr=cut.toISOString().slice(0,10);
    periodTxs=allTxs.filter(t=>t.date>=cutStr);
  } else {
    periodTxs=allTxs;
  }

  const expTxs=periodTxs.filter(t=>t.type==='expense');
  const total=expTxs.reduce((a,b)=>a+b.amount,0);

  // Category totals, non-zero only, sorted by spend desc
  const catData=FIN_CATS.map(name=>{
    const amount=expTxs.filter(t=>t.category===name).reduce((a,b)=>a+b.amount,0);
    const pct=total>0?Math.round(amount/total*100):0;
    return {name,amount,pct,color:FIN_CAT_COLORS[name]};
  }).filter(c=>c.amount>0).sort((a,b)=>b.amount-a.amount);

  let html=
    // Header row: back button + label
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">`+
    `<button class="btn-ghost" id="report-back" style="border-color:var(--finance);color:var(--finance);padding:6px 14px;font-size:12px">← Back</button>`+
    `<span style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em">FINANCE REPORT</span>`+
    `</div>`;

  // Period selector — two rows
  const row1=[['today','Today'],['week','This Week'],['3week','Last 3 Weeks']];
  const row2=[['month','This Month'],['3month','Last 3 Months'],['all','All Time']];
  html+=`<div class="btn-group" style="margin-bottom:6px">`;
  row1.forEach(([key,label])=>{
    html+=`<button class="opt-btn report-period${financeReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`;
  });
  html+=`</div>`;
  html+=`<div class="btn-group" style="margin-bottom:14px">`;
  row2.forEach(([key,label])=>{
    html+=`<button class="opt-btn report-period${financeReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`;
  });
  html+=`</div>`;

  // Pie breakdown
  html+=sectionLabel('SPENDING BREAKDOWN','var(--finance)');
  html+=`<div class="card">${financePieHtml(catData,total)}</div>`;

  // Ranked categories
  html+=sectionLabel('TOP SPENDING CATEGORIES','var(--finance)');
  if(catData.length){
    html+=`<div class="card">`;
    catData.forEach(({name,amount,pct})=>{
      html+=`<div class="stat-row"><span>${name}</span>`+
        `<span style="display:flex;align-items:center;gap:8px">`+
        `<span style="font-family:var(--mono);font-size:9px;color:var(--mute)">${pct}%</span>`+
        `<span style="color:var(--finance);font-family:var(--mono)">${amount.toLocaleString()}</span>`+
        `</span></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:16px">No expenses for this period</div>`;
  }

  // Top 5 individual expenses
  const top5=expTxs.slice().sort((a,b)=>b.amount-a.amount).slice(0,5);
  html+=sectionLabel('BIGGEST INDIVIDUAL EXPENSES','var(--finance)');
  if(top5.length){
    html+=`<div class="card">`;
    top5.forEach(t=>{
      html+=`<div class="stat-row" style="gap:8px">`+
        `<span style="font-family:var(--mono);font-size:10px;color:var(--mute);flex-shrink:0">${t.date}</span>`+
        `<span style="font-size:12px;flex:1">${t.category==='Other'?(t.note||'Other'):t.category}</span>`+
        `<span style="color:var(--finance);font-family:var(--mono);flex-shrink:0">${t.amount.toLocaleString()}</span>`+
        `</div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:16px">No expenses for this period</div>`;
  }

  s.innerHTML=html;

  s.querySelector('#report-back').addEventListener('click',()=>{
    financeReportOpen=false;
    renderFinance();
  });
  s.querySelectorAll('.report-period').forEach(btn=>{
    btn.addEventListener('click',()=>{
      financeReportPeriod=btn.dataset.period;
      renderFinanceReport(s);
    });
  });
}

function renderFinance(){
  const s = document.getElementById('s-finance');
  if(financeReportOpen){ renderFinanceReport(s); return; }

  const goals = DB.goals();
  const txs = DB.transactions();
  const monthPrefix = EDIT_DATE.slice(0,7);
  const monthTx = txs.filter(t=>t.date.startsWith(monthPrefix));
  const deposited = monthTx.filter(t=>t.type==='deposit').reduce((a,b)=>a+b.amount,0);
  const withdrawn = monthTx.filter(t=>t.type==='withdraw').reduce((a,b)=>a+b.amount,0);
  const income = monthTx.filter(t=>t.type==='income'||t.type==='withdraw').reduce((a,b)=>a+b.amount,0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);

  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">`+

    `</div>`;

  html += '<div class="card stat-mini">'+'<div class="v" style="color:var(--finance);font-size:14px">'+deposited.toLocaleString()+'</div><div class="l">DEPOSITED</div></div>';
  html += '<div class="card stat-mini">'+'<div class="v" style="color:var(--finance);font-size:14px">'+withdrawn.toLocaleString()+'</div><div class="l">WITHDRAWN</div></div>';
  html += '</div>';

  const netColor=net>=0?'var(--finance)':'var(--red)';
  html += '<div class="card" style="margin-top:10px">'+donutStat(netPct,'SAVINGS RATE',net.toLocaleString(),netColor)+'</div>';

  html += sectionLabel('MONTHLY TRADING GOAL','var(--finance)');

    '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">TARGET THIS MONTH</label><input type="number" class="input" id="trading-goal" value="'+(goals.trading||'')+'" placeholder="Withdrawal target">'+
    goalBarHtml('Progress', tgtPct, withdrawn.toLocaleString()+' of '+(goals.trading||0).toLocaleString(), 'var(--finance)', 'var(--cyan)')+'</div>';

  html += sectionLabel('LONG-RANGE GOAL');

  html += '<div class="card">'+
    '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">TARGET FIGURE</label><input type="number" class="input" id="longrange-goal" value="'+(goals.longrange||'')+'" placeholder="Set your target">'+
    goalBarHtml('Savings progress', lrPct, (goals.savedSoFar||0).toLocaleString()+' of '+(goals.longrange||0).toLocaleString(), 'var(--finance)', 'var(--cyan)')+'</div>';

  html += sectionLabel('LOG A TRANSACTION');
  html += '<button class="btn-ghost" id="add-tx" style="border-color:var(--finance);color:var(--finance)">+ Log deposit, withdrawal, income, or expense</button>';

  html += sectionLabel('SPENDING BREAKDOWN, TODAY');
  const cats = ['Rent','Food','Business costs','Transport','Weed','Cigarettes','Given to people','Home bills','Other'];
  const todayTx = txs.filter(t=>t.date===EDIT_DATE);
  html += '<div class="card">'+cats.map(c=>{
    const amt = todayTx.filter(x=>x.type==='expense'&&x.category===c).reduce((a,b)=>a+b.amount,0);
    return '<div class="stat-row"><span>'+c+'</span><span style="color:var(--finance);font-family:var(--mono)">'+(amt?amt.toLocaleString():'-')+'</span></div>';
  }).join('')+'</div>';

  html += sectionLabel('RECENT TRANSACTIONS', 'var(--finance)');

  if(recentTxs.length){

      const label = t.type==='expense'?(t.category==='Other'?(t.note||'Other'):t.category):(t.type.charAt(0).toUpperCase()+t.type.slice(1));
      return '<div class="stat-row tx-row" data-txid="'+t.id+'" style="cursor:pointer;gap:8px">'+
        '<span style="font-family:var(--mono);font-size:10px;color:var(--mute);flex-shrink:0">'+t.date+'</span>'+
        '<span style="font-size:12px;flex:1">'+label+'</span>'+
        '<span style="color:var(--finance);font-family:var(--mono);flex-shrink:0">'+t.amount.toLocaleString()+'</span>'+
        '<span style="color:var(--mute);font-size:10px;flex-shrink:0">&#x270E;</span>'+

  html += sectionLabel('MONTH TO DATE');

  html += '<div class="card">'+progressRow('Logging consistency', avg, avg+'%', 'var(--finance)')+'</div>';

  const financePrevAvg = monthAvg(financeScore, prevMonthPrefix());
  html += sectionLabel('THIS MONTH VS LAST MONTH','var(--finance)');
  html += '<div class="card">'+momCompareHtml(avg, financePrevAvg, 'var(--finance)')+'</div>';

  html += '<button class="save-btn" id="save-finance">'+saveBtnLabel()+'</button>';
