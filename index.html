<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050605">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<title>Life OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050605;--card:#0B0E0C;--border:#1A2E28;
  --text:#E4F5EC;--mute:#6B8278;
  --cyan:#3DDCEC;--green:#3DDC97;--red:#E06868;--amber:#E0B454;
  --faith:#3DDC97;--health:#E08A54;--music:#E0B454;--finance:#5CA0E0;--growth:#B08CE0;--home:#3DDCEC;--review:#3DDCEC;
  --serif:'DM Serif Display',serif;--mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
  --nav:64px;--hdr:64px;
  --card-bg:rgba(18,22,20,.6);--card-border:rgba(255,255,255,.08);--card-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 18px rgba(0,0,0,.35);
  --sep:#14201B;--sep-alt:#0E1A12;--track-bg:#152019;--flame-bg:#152019;--nav-bg:#080A09;
  --modal-overlay:rgba(0,0,0,.6);--btn-depth:0 1px 0 rgba(255,255,255,.06) inset,0 3px 8px rgba(0,0,0,.35);
  --sel-shadow:0 0 10px rgba(61,220,236,.5);--fab-glow:0 0 16px rgba(61,220,236,.6),0 4px 10px rgba(0,0,0,.4);
  --on-accent:#04120C;--delta-up-bg:#1E2A21;--delta-dn-bg:#2A1414
}
[data-theme="light"]{
  --bg:#EDEEED;--card:#F8FAF8;--border:#C4D8CE;--text:#0D1C14;--mute:#4D6058;
  --cyan:#3098B0;--green:#2EAA70;--red:#C87070;--amber:#A89030;
  --faith:#2EAA70;--health:#CC6840;--music:#A89030;--finance:#4278CC;--growth:#8056CC;--home:#3098B0;--review:#3098B0;
  --card-bg:rgba(248,250,248,.97);--card-border:rgba(0,0,0,.05);--card-shadow:0 2px 20px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --sep:#D8E6DF;--sep-alt:#EAF2ED;--track-bg:#DBE8E2;--flame-bg:#E4EDE6;--nav-bg:#E4EBE4;
  --modal-overlay:rgba(0,0,0,.3);--btn-depth:0 1px 0 rgba(255,255,255,.9) inset,0 2px 8px rgba(0,0,0,.07);
  --sel-shadow:0 0 0 2px #3098B0;--fab-glow:0 2px 14px rgba(0,0,0,.14),0 4px 8px rgba(0,0,0,.09);
  --on-accent:#FFFFFF;--delta-up-bg:#D0EADA;--delta-dn-bg:#F0D8D8
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 18px;height:var(--hdr);border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.hdr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;object-fit:contain;pointer-events:none}
#edit-banner{display:flex;align-items:center;justify-content:space-between;padding:6px 18px;background:var(--amber);flex-shrink:0}
#edit-banner span{font-family:var(--mono);font-size:9px;color:#111;letter-spacing:1px}
#edit-banner button{font-family:var(--mono);font-size:9px;color:#111;background:rgba(0,0,0,0.12);border:none;border-radius:6px;padding:4px 10px;cursor:pointer;letter-spacing:1px}
#edit-banner.hidden{display:none}
.hdr .brand-mini{font-size:9px;letter-spacing:3px;color:var(--green)}
.hdr .brand-title{font-family:var(--serif);font-size:16px;margin-top:2px}
.hdr .status{display:flex;align-items:center;gap:5px}
.hdr .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.hdr .status-text{font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:1px}
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 18px calc(var(--nav) + 16px);display:none}
.screen.active{display:block}
.screen::-webkit-scrollbar{width:2px}
.nav{position:absolute;bottom:0;left:0;right:0;height:var(--nav);background:var(--nav-bg);border-top:1px solid var(--border);display:flex;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--mute);font-size:7.5px;cursor:pointer;font-family:var(--sans)}
.nb svg{width:16px;height:16px}
.datebar{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:1px;margin-bottom:14px}
.section-label{display:flex;align-items:center;gap:7px;margin:20px 0 10px}
.section-label .sq{width:6px;height:6px;flex-shrink:0}
.section-label span{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--mute)}
.section-label .ln{flex:1;height:1px;background:var(--border)}
.card{position:relative;background:var(--card-bg);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid var(--card-border);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--card-shadow)}
.card-shell{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:26px;padding:5px;margin-bottom:10px}
.card-shell>.card{border-radius:21px;margin-bottom:0;box-shadow:var(--card-shadow),inset 0 1px 1px rgba(255,255,255,0.1)}
[data-theme="light"] .card-shell{background:rgba(0,0,0,0.02);border-color:rgba(0,0,0,0.06)}
.card-animate{opacity:0;transform:translateY(12px);filter:blur(4px);transition:opacity 350ms ease-out,transform 350ms ease-out,filter 350ms ease-out}
.card-animate.visible{opacity:1;transform:translateY(0);filter:blur(0)}
@media(prefers-reduced-motion:reduce){.card-animate{transform:none;filter:none;transition:opacity 200ms ease-out}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat-scroll{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-scroll .card{flex:0 0 100px;min-width:100px}
.stat-mini{text-align:center}
.stat-mini .v{font-family:var(--serif);font-size:18px}
.stat-mini .l{font-family:var(--mono);font-size:8.5px;color:var(--mute);margin-top:4px}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12px;cursor:pointer;border-bottom:1px solid var(--sep)}
.checkline:last-child{border-bottom:none}
.checkline .box{font-size:13px;flex-shrink:0}
.tristate{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--sep)}
.tristate:last-child{border-bottom:none}
.tristate .lbl{font-size:11.5px}
.tristate .pills{display:flex;gap:5px}
.pill{font-size:9px;font-family:var(--mono);padding:3px 8px;border-radius:10px;border:1px solid var(--border);color:var(--mute);cursor:pointer;background:transparent;position:relative}
.pill::before{content:'';position:absolute;inset:-14px -8px}
.progress-row{padding:9px 0;border-bottom:1px solid var(--sep)}
.progress-row:last-child{border-bottom:none}
.progress-row .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
.progress-row .top .note{font-family:var(--mono)}
.bar-track{background:var(--track-bg);height:5px;border-radius:2px;overflow:hidden}
.bar-fill{height:100%}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:11px;padding:8px 14px;border-radius:6px;cursor:pointer;width:100%;text-align:center}
.input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:var(--sans);font-size:12px;outline:none;margin-bottom:8px}
.input:focus{border-color:var(--cyan)}
.textarea{min-height:60px;resize:vertical}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--sep);font-size:11.5px}
.stat-row:last-child{border-bottom:none}
.count-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--sep)}
.count-row:last-child{border-bottom:none}
.count-btns{display:flex;gap:6px;align-items:center}
.count-btns button{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;position:relative}
.count-btns button::before{content:'';position:absolute;inset:-11px}
.count-val{font-family:var(--mono);font-size:12px;min-width:16px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:2px;background:var(--card);border:1px solid var(--border);cursor:pointer}
.cd .n{font-family:var(--mono);font-size:8px;color:var(--mute)}
.cd .s{font-family:var(--mono);font-size:9px}
.proj-card{cursor:pointer}
.proj-card .name{font-size:11px;margin-bottom:8px}
.proj-card .meta{font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:6px}
.save-btn{background:var(--green);color:var(--on-accent);border:none;font-family:var(--sans);font-weight:700;font-size:12px;padding:11px;border-radius:20px;width:100%;cursor:pointer;margin-top:14px}
.hero-num{font-family:var(--serif)}
.modal-backdrop{position:fixed;inset:0;background:var(--modal-overlay);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-sheet{width:100%;max-width:430px;background:var(--card-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--card-border);border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow-y:auto}
.modal-title{font-family:var(--serif);font-size:16px;margin-bottom:14px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.opt-btn{flex:1;min-width:70px;background:var(--bg);border:1px solid var(--border);color:var(--mute);font-family:var(--sans);font-size:11px;padding:9px;border-radius:6px;cursor:pointer;text-align:center}
.opt-btn.sel{color:var(--text);border-color:var(--cyan);box-shadow:var(--sel-shadow)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:11px;border-radius:6px;border:1px solid var(--border);font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.btn-primary{background:var(--green);color:var(--on-accent);border:none !important}
.btn-cancel{background:var(--card);color:var(--mute)}
button{transition:transform .12s ease}
button:active{transform:scale(0.96)}
.save-btn,.btn-ghost,.opt-btn,.nb,.btn-primary,.btn-cancel,.count-btns button{transition:transform .12s ease}
.save-btn:active,.btn-ghost:active,.opt-btn:active,.btn-primary:active,.btn-cancel:active,.count-btns button:active{transform:scale(0.96)}
.nb:active{transform:scale(0.96)}
.btn-ghost,.opt-btn{box-shadow:var(--btn-depth)}
.flame-wrap{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fab{position:fixed;left:50%;bottom:calc(var(--nav) + 8px);transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--fab-glow);transition:transform .12s ease}
.fab::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.fab:active{transform:translateX(-50%) scale(0.96)}
.fab svg{width:14px;height:14px;color:var(--on-accent);transition:transform .2s cubic-bezier(0.34,1.56,0.64,1)}
@media(hover:hover){.fab:hover svg{transform:translateX(1px) translateY(-1px) scale(1.1)}}
.delta-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:10px;font-family:var(--mono)}
.trend-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--mute);margin-top:4px}
.cal2{display:flex;flex-direction:column;gap:4px;overflow:visible}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;overflow:visible}
.cal-card2{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;transition:transform .12s ease;gap:1px}
.cal-card2:active{transform:scale(0.96)}
.cal-bubble-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;cursor:pointer}
.cal-rollup{height:3px;border-radius:2px;background:var(--track-bg);margin:2px 0 6px;overflow:hidden}
.cal-rollup-fill{height:100%;border-radius:2px}
.cal-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.cal-stat-cell{padding:4px 0;border-right:1px solid var(--sep);text-align:center}
.cal-stat-cell:last-child{border-right:none}
.cal-stat-cell .v{font-family:var(--serif);font-size:15px}
.cal-stat-cell .l{font-family:var(--mono);font-size:7px;color:var(--mute);margin-top:2px;letter-spacing:.5px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-dow-row span{font-family:var(--mono);font-size:7.5px;color:var(--mute);text-align:center;padding:1px 0}
.wp-col{flex:1;height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wp-col::-webkit-scrollbar{display:none}
.wp-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--mono);transition:font-size .1s,opacity .1s,color .1s}
.wp-rail{position:absolute;top:44px;left:0;right:0;height:44px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(255,255,255,0.04);pointer-events:none;z-index:1}
.profile-overlay{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:9990;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 18px;box-sizing:border-box}
.profile-card{width:100%;max-width:390px;padding:24px 20px;background:var(--card);border-radius:20px;border:1px solid var(--border);margin:auto}
.profile-avatar-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.profile-avatar-item{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:border-color .15s,background .15s}
.profile-avatar-item.selected{border-color:var(--green);background:rgba(61,220,151,0.08)}
.profile-gender-row{display:flex;gap:8px;margin-bottom:4px}
.profile-gender-pill{flex:1;padding:8px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--fg);font-family:var(--mono);font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s}
.profile-gender-pill.selected{border-color:var(--green);background:rgba(61,220,151,0.08);color:var(--green)}
.profile-input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--fg);font-family:var(--mono);font-size:13px;outline:none;box-sizing:border-box;-webkit-appearance:none}
.profile-input:focus{border-color:var(--green)}
.profile-save-btn{width:100%;margin-top:20px;padding:14px;border-radius:20px;border:1px solid var(--green);background:rgba(61,220,151,0.08);color:var(--green);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity .15s}
.profile-save-btn:disabled{opacity:.35;cursor:default}
.profile-gear-btn{background:transparent;border:none;color:var(--mute);font-size:13px;cursor:pointer;padding:0 0 0 4px;vertical-align:middle;line-height:1}
.profile-gear-btn:hover{color:var(--fg)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div><div class="brand-mini" id="brand-name">DAVYDENKO</div><div class="brand-title">Life OS <button class="profile-gear-btn" onclick="showProfileSettings()" aria-label="Profile settings">⚙</button></div></div>
    <img src="image_holographic_logo-825a1b.png" class="hdr-logo" alt="Life OS logo">
    <div class="status"><div class="dot"></div><span class="status-text">SYSTEM ONLINE</span></div>
  </div>

  <div id="edit-banner" class="hidden">
    <span id="edit-banner-label"></span>
    <button onclick="exitEditMode()" id="edit-banner-btn">Back to Today</button>
  </div>

  <div class="screens">
    <div class="screen active" id="s-home"></div>
    <div class="screen" id="s-faith"></div>
    <div class="screen" id="s-health"></div>
    <div class="screen" id="s-music"></div>
    <div class="screen" id="s-finance"></div>
    <div class="screen" id="s-growth"></div>
    <div class="screen" id="s-review"></div>
  </div>

  <div class="nav">
    <button class="fab" id="fab-btn" aria-label="Quick log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nb" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Home</button>
    <button class="nb" data-tab="faith"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>Faith</button>
    <button class="nb" data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>Health</button>
    <button class="nb" data-tab="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Music</button>
    <button class="nb" data-tab="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10a3 3 0 013-1c2 0 3 1 3 2s-1 2-3 2-3 1-3 2 1 2 3 2a3 3 0 003-1"/></svg>Finance</button>
    <button class="nb" data-tab="growth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22v-9M12 13c-4 0-7-3-7-7 4 0 7 3 7 7zm0 0c4 0 7-3 7-7-4 0-7 3-7 7z"/></svg>Growth</button>
    <button class="nb" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>Review</button>
  </div>
</div>

<div id="modal-root"></div>

<div id="faceid-lock" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;max-width:430px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%">
  <div style="font-size:48px;margin-bottom:16px">&#128274;</div>
  <div id="faceid-name" style="color:var(--green);font-size:10px;letter-spacing:3px;font-weight:700;margin-bottom:6px;font-family:var(--mono)">DAVYDENKO</div>
  <div style="font-family:var(--serif);font-size:18px;margin-bottom:10px">Life OS</div>
  <div style="color:var(--mute);font-size:11px;margin-bottom:32px;text-align:center;font-family:var(--sans)">This app is protected by Face ID</div>
  <button onclick="unlockWithFaceId()" style="width:100%;max-width:280px;padding:14px;background:rgba(61,220,151,0.08);border:1px solid var(--green);border-radius:20px;color:var(--green);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:var(--sans)">Unlock with Face ID</button>
  <button onclick="resetFaceIdLock()" style="background:transparent;border:none;color:var(--mute);font-size:10px;cursor:pointer;margin-top:20px;opacity:.5;text-decoration:underline;font-family:var(--sans)">Reset Face ID lock</button>
</div>

<script>
/* ============ STORAGE ============ */
const DB = {
  day(dateStr){
    const all = JSON.parse(localStorage.getItem('lo_days')||'{}');

const HEALTH_BOOL_GOOD = ['fruits','milk','stopstart','smokeFree','knifesharpening','penilemassage'];
const HEALTH_BOOL_BAD = ['junk','weed','nailbiting'];
function healthScore(d){
  const h = d.health;
  // Bucket 1: Sleep (20 pts) — full at 7-9h, linear ramp below 7h, linear decay above 9h to 0 at 12h
  const sh = h.sleepHours || 0;
  let sleepPts;
  if(sh >= 7 && sh <= 9)  sleepPts = 20;
  else if(sh < 7)          sleepPts = (sh / 7) * 20;
  else                      sleepPts = Math.max(0, (1 - (sh - 9) / 3)) * 20;
  // Bucket 2: Habits & avoidances (25 pts, 9 items, 25/9 each — sum then round once)
  const wt = 25 / 9;
  let habitPts = 0;
  HEALTH_BOOL_GOOD.forEach(k=>{ if(h[k]) habitPts += wt; });
  HEALTH_BOOL_BAD.forEach(k=>{ if(!h[k]) habitPts += wt; });
  // Bucket 3: Water + Brushing (5 pts each, proportional)
  const waterPts = Math.min((h.water||0)/5, 1) * 5;
  const brushPts = Math.min((h.brushing||0)/2, 1) * 5;
  // Bucket 4: Exercise/movement (45 pts ceiling — 9 existing items + 3 sport categories)
  const oldExPts =
    Math.min((h.pushupsReps||0)/30, 1) * 5 +
    Math.min((h.abrollerReps||0)/15, 1) * 5 +
    Math.min((h.kegelReps||0)/20, 1) * 5 +
    Math.min((h.matroutineReps||0)/15, 1) * 5 +
    Math.min((h.plankSeconds||0)/90, 1) * 5 +
    Math.min((h.tennisMinutes||0)/45, 1) * 5 +
    Math.min((h.runningKm||0)/3, 1) * 5 +
    Math.min((h.hikingMinutes||0)/30, 1) * 5 +
    Math.min((h.walkingMinutes||0)/30, 1) * 5;
  const sp = h.sport || {};
  const _s = o => Object.values(o||{}).reduce((a,b)=>a+b, 0);
  const sportPts =
    Math.min(_s(sp.squats)/50, 1)*5 +
    Math.min(_s(sp.abs)   /50, 1)*5 +
    Math.min(_s(sp.cardio)/50, 1)*5;
  const exercisePts = Math.min(oldExPts + sportPts, 45);
  return Math.round(sleepPts + habitPts + waterPts + brushPts + exercisePts);
}

function growthScore(d){
  const g = d.growth || {};
  // New format: has reps or checks sub-objects
  if(g.reps || g.checks){
    const reps = g.reps || {};
    const chks = g.checks || {};
    let pts = 0;
    // Reps: each key scores proportionally to target (capped at 1.0)
    GR_REPS_KEYS.forEach(k=>{ pts += Math.min((reps[k]||0)/GR_REPS_TARGET, 1); });
    // Checks: each yes = 1 point
    GR_CHK_KEYS.forEach(k=>{ if(chks[k]==='yes') pts++; });
    const total = GR_REPS_KEYS.length + GR_CHK_KEYS.length;
    return Math.round((pts / total) * 100);
  }
  // Old format: flat booleans
  let c=0; GROWTH_ITEMS.forEach(k=>{ if(g[k]) c++; });
  if(d.reading && (d.reading.sessions||[]).length > 0) c++;
  if(d.meditation && (d.meditation.sessions||[]).length > 0) c++;
  return Math.round((c/(GROWTH_ITEMS.length+2))*100);
}
function musicScore(d){
  const sessions = (d.music&&d.music.sessions)||[];
  if(!sessions.length) return 0;
  const distinctProjects = new Set(sessions.map(s=>s.workedOn).filter(w=>w&&w!=='')).size;
  const totalMinutes = sessions.reduce((a,s)=>a+(s.minutes||0),0);
  const ratedSessions = sessions.filter(s=>s.quality!=null);
  const avgQuality = ratedSessions.length ? ratedSessions.reduce((a,s)=>a+s.quality,0)/ratedSessions.length : 0;
  const projectPts = Math.min(distinctProjects/3,1)*40;
  const minutePts  = Math.min(totalMinutes/90,1)*40;
  const qualityPts = (avgQuality/5)*20;
  return Math.round(projectPts+minutePts+qualityPts);
}

function sleepZoneChartSvg(vals, targetLow, targetHigh){
  const W=260, H=60, maxH=12;
  const hasData = vals.some(v=>v!==null&&v>0);
  if(!hasData) return '';
  const barW = Math.max(4, Math.floor(W/vals.length)-5);
  const toY = v => H - Math.round((Math.min(v,maxH)/maxH)*H);
  const isLight = document.documentElement.dataset.theme==='light';
  let svg = '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  const zTop=toY(targetHigh), zBot=toY(targetLow);
  svg+='<rect x="0" y="'+zTop+'" width="'+W+'" height="'+(zBot-zTop)+'" fill="var(--green)" fill-opacity="0.09"/>';
  svg+='<line x1="0" y1="'+zTop+'" x2="'+W+'" y2="'+zTop+'" stroke="var(--green)" stroke-width="1.2" opacity="0.45"/>';
  svg+='<line x1="0" y1="'+zBot+'" x2="'+W+'" y2="'+zBot+'" stroke="var(--green)" stroke-width="1.2" opacity="0.45"/>';
  svg+='<text x="'+(W-2)+'" y="'+(zTop-3)+'" text-anchor="end" font-size="7" font-family="Space Mono,monospace" fill="var(--green)" opacity="0.6">9h</text>';
  svg+='<text x="'+(W-2)+'" y="'+(zBot-3)+'" text-anchor="end" font-size="7" font-family="Space Mono,monospace" fill="var(--green)" opacity="0.6">7h</text>';
  vals.forEach((v,i)=>{
    if(v===null||v<=0) return;
    const x=(i*(W/vals.length))+3;
    const bH=Math.round((Math.min(v,maxH)/maxH)*H);
    const y=H-bH;
    const inZone=v>=targetLow&&v<=targetHigh;
    const col=inZone?'var(--green)':v>targetHigh?'var(--amber)':'var(--red)';
    const glow=isLight?'':'filter:drop-shadow(0 0 4px '+col+')';
    svg+='<g'+(glow?' style="'+glow+'"':'')+'>';
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+barW+'" height="'+bH+'" rx="2" fill="'+col+'" fill-opacity="0.75"/>';
    svg+='</g>';
    const tx=x+barW/2;
    svg+='<text x="'+tx.toFixed(1)+'" y="'+(Math.max(y-3,8))+'" text-anchor="middle" font-size="7.5" font-family="Space Mono,monospace" fill="'+col+'">'+v+'h</text>';
  });
  svg+='<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--border)" stroke-width="1"/>';
  svg+='</svg>';
  return svg;
}

function fiveSliceDonutHtml(scores){
  const cats=[
    {k:'faith',   c:'var(--faith)'  },
    {k:'health',  c:'var(--health)' },
    {k:'music',   c:'var(--music)'  },
    {k:'finance', c:'var(--finance)'},
    {k:'growth',  c:'var(--growth)' }
  ];
  const total=cats.reduce((s,{k})=>s+(scores[k]||0),0);
  const avg=Math.round(cats.reduce((s,{k})=>s+(scores[k]||0),0)/cats.length);

  // Tilted 3D pie: top face on a flattened ellipse, depth wall only on front-facing arc.
  // Angle convention: t=0 = top (12 o'clock), increases clockwise.
  // px(t) = cx + rx*sin(t),  pyt(t) = topcy - ry*cos(t),  pyw(t) = pyt(t) + depth
  // W=290 gives ~65px on each side of the pie (rx=80) for floating labels.
  const W=290,H=155,cx=145,topcy=68,rx=80,ry=28,depth=20;
  const px =t=>cx+rx*Math.sin(t);
  const pyt=t=>topcy-ry*Math.cos(t);
  const pyw=t=>topcy-ry*Math.cos(t)+depth;
  const f2=n=>n.toFixed(2);

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">`;

  if(total===0){
    svg+=`<g style="filter:brightness(0.5)"><ellipse cx="${cx}" cy="${topcy+depth}" rx="${rx}" ry="${ry}" fill="var(--track-bg)"/></g>`;
    svg+=`<ellipse cx="${cx}" cy="${topcy}" rx="${rx}" ry="${ry}" fill="var(--track-bg)"/>`;
    svg+='</svg>';
    const emptyLine=`<div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em;margin-top:4px">SCORE TODAY</div>`+
      `<div style="font-family:DM Serif Display,serif;font-size:28px;font-weight:700;color:var(--mute);line-height:1;margin-top:1px">0</div>`;
    return `<div style="text-align:center;padding:8px 0">${svg}${emptyLine}</div>`;
  }

  const GAP=0.06;
  const nz=cats.filter(({k})=>(scores[k]||0)>0).length;
  const TARC=Math.PI*2-GAP*nz;
  let angle=0;
  const slices=[];
  cats.forEach(({k,c})=>{
    const sc=scores[k]||0;
    if(!sc) return;
    const span=sc/total*TARC;
    slices.push({k,c,sc,a0:angle,a1:angle+span});
    angle+=span+GAP;
  });

  // Front-visible arc: angles where pyt(t) > topcy, i.e. cos(t)<0, i.e. t∈(π/2, 3π/2)
  const FS=Math.PI/2, FE=3*Math.PI/2;

  // 1. Walls — darkened, only the front-visible portion of each slice's outer rim
  svg+='<g style="filter:brightness(0.52)">';
  slices.forEach(({c,a0,a1})=>{
    const wa0=Math.max(a0,FS), wa1=Math.min(a1,FE);
    if(wa1<=wa0) return;
    const lg=(wa1-wa0)>Math.PI?1:0;
    svg+=`<path d="M${f2(px(wa0))},${f2(pyt(wa0))} A${rx},${ry},0,${lg},1,${f2(px(wa1))},${f2(pyt(wa1))} L${f2(px(wa1))},${f2(pyw(wa1))} A${rx},${ry},0,${lg},0,${f2(px(wa0))},${f2(pyw(wa0))} Z" fill="${c}"/>`;
  });
  svg+='</g>';

  // 2. Top face pie sectors
  slices.forEach(({c,a0,a1})=>{
    const lg=(a1-a0)>Math.PI?1:0;
    svg+=`<path d="M${cx},${topcy} L${f2(px(a0))},${f2(pyt(a0))} A${rx},${ry},0,${lg},1,${f2(px(a1))},${f2(pyt(a1))} Z" fill="${c}"/>`;
  });

  // 3. Divider lines between slices
  slices.forEach(({a1})=>{
    svg+=`<line x1="${cx}" y1="${topcy}" x2="${f2(px(a1))}" y2="${f2(pyt(a1))}" stroke="var(--bg)" stroke-width="1.5"/>`;
  });

  // 4. Gloss highlight (top-left portion of top face)
  svg+=`<ellipse cx="${cx-rx*0.15}" cy="${topcy-ry*0.35}" rx="${rx*0.48}" ry="${ry*0.4}" fill="white" opacity="0.09"/>`;

  // 5. Leader lines + floating labels — one per non-zero slice, omit at score 0
  slices.forEach(({k,c,sc,a0,a1})=>{
    const tm=(a0+a1)/2;
    const rimx=px(tm), rimy=pyt(tm);
    const dx=rimx-cx, dy=rimy-topcy;
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=dx/len, ny=dy/len;
    const LEAD=11;
    const lx1=f2(rimx+nx*LEAD), ly1=f2(rimy+ny*LEAD);
    const tx=f2(rimx+nx*(LEAD+4)), ty=f2(rimy+ny*(LEAD+4)+3);
    const anchor=dx>=0?'start':'end';
    const name=k.charAt(0).toUpperCase()+k.slice(1);
    svg+=`<line x1="${f2(rimx)}" y1="${f2(rimy)}" x2="${lx1}" y2="${ly1}" stroke="var(--text)" stroke-width="0.8" opacity="0.6"/>`;
    svg+=`<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="8" font-family="Space Mono,monospace" fill="var(--text)">${name} ${sc}</text>`;
  });

  svg+='</svg>';
  // Score label + number sit below the pie — same hierarchy as Code Score widget (mono label above, serif number below)
  const statLine=`<div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em;margin-top:4px">SCORE TODAY</div>`+
    `<div style="font-family:DM Serif Display,serif;font-size:28px;font-weight:700;color:var(--text);line-height:1;margin-top:1px">${avg}</div>`;
  return `<div style="text-align:center;padding:8px 0">${svg}${statLine}</div>`;
}

    svg+=`<text text-anchor="${anchor}" font-size="8" font-family="Space Mono,monospace" fill="var(--text)"><tspan x="${tx}" y="${ty}">${pct}%</tspan><tspan x="${tx}" dy="10">${amount.toLocaleString()}</tspan></text>`;
  });

  svg+='</svg>';

  // Legend — 2-col grid, every non-zero category regardless of label threshold
  const legend='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:6px 12px 2px">'+
    catData.map(({name,amount,color})=>
      `<div style="display:flex;align-items:center;gap:5px">`+

        `<span style="font-family:var(--mono);font-size:8px;color:var(--text);flex-shrink:0">${amount.toLocaleString()}</span>`+
      `</div>`
    ).join('')+
  '</div>';

  const statLine=
    `<div style="font-family:var(--mono);font-size:9px;color:var(--mute);text-align:center;letter-spacing:0.05em;margin-top:6px">TOTAL SPENT</div>`+
    `<div style="font-family:DM Serif Display,serif;font-size:28px;font-weight:700;color:var(--text);text-align:center;line-height:1;margin-top:1px">${total.toLocaleString()}</div>`;

  return `<div style="padding:8px 0">${svg}${legend}${statLine}</div>`;
}

// Time Budget multi-slice pie — direct adaptation of financePieHtml for 6 activity segments.
// catData = [{name,mins,pct,color}], totalMins = period minutes, sleepStat = pre-built HTML string.
function timeBudgetPieHtml(catData, totalMins, sleepStat){
  const fmtMin=m=>m>=60?(Math.floor(m/60)+'h'+(m%60>0?' '+Math.round(m%60)+'m':'')):(Math.round(m)+'m');
  const W=290,H=155,cx=145,topcy=68,rx=80,ry=28,depth=20;
  const px =t=>cx+rx*Math.sin(t);
  const pyt=t=>topcy-ry*Math.cos(t);
  const pyw=t=>topcy-ry*Math.cos(t)+depth;
  const f2=n=>n.toFixed(2);

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">`;

  if(!catData.length||totalMins===0){
    svg+=`<g style="filter:brightness(0.5)"><ellipse cx="${cx}" cy="${topcy+depth}" rx="${rx}" ry="${ry}" fill="var(--track-bg)"/></g>`;
    svg+=`<ellipse cx="${cx}" cy="${topcy}" rx="${rx}" ry="${ry}" fill="var(--track-bg)"/>`;
    svg+='</svg>';
    return `<div style="padding:8px 0">${svg}<div style="font-family:var(--mono);font-size:9px;color:var(--mute);text-align:center;margin-top:6px">No activity logged for this period</div></div>`;
  }

  const GAP=0.06;
  const TARC=Math.PI*2-GAP*catData.length;
  let angle=0;
  const slices=[];
  catData.forEach(({name,mins,pct,color})=>{
    const span=mins/totalMins*TARC;
    slices.push({name,mins,pct,color,a0:angle,a1:angle+span});
    angle+=span+GAP;
  });

  const FS=Math.PI/2,FE=3*Math.PI/2;

  // 1. Walls
  svg+='<g style="filter:brightness(0.52)">';
  slices.forEach(({color,a0,a1})=>{
    const wa0=Math.max(a0,FS),wa1=Math.min(a1,FE);
    if(wa1<=wa0) return;
    const lg=(wa1-wa0)>Math.PI?1:0;
    svg+=`<path d="M${f2(px(wa0))},${f2(pyt(wa0))} A${rx},${ry},0,${lg},1,${f2(px(wa1))},${f2(pyt(wa1))} L${f2(px(wa1))},${f2(pyw(wa1))} A${rx},${ry},0,${lg},0,${f2(px(wa0))},${f2(pyw(wa0))} Z" fill="${color}"/>`;
  });
  svg+='</g>';

  // 2. Top faces
  slices.forEach(({color,a0,a1})=>{
    const lg=(a1-a0)>Math.PI?1:0;
    svg+=`<path d="M${cx},${topcy} L${f2(px(a0))},${f2(pyt(a0))} A${rx},${ry},0,${lg},1,${f2(px(a1))},${f2(pyt(a1))} Z" fill="${color}"/>`;
  });

  // 3. Dividers
  slices.forEach(({a1})=>{
    svg+=`<line x1="${cx}" y1="${topcy}" x2="${f2(px(a1))}" y2="${f2(pyt(a1))}" stroke="var(--bg)" stroke-width="1.5"/>`;
  });

  // 4. Gloss
  svg+=`<ellipse cx="${cx-rx*0.15}" cy="${topcy-ry*0.35}" rx="${rx*0.48}" ry="${ry*0.4}" fill="white" opacity="0.09"/>`;

  // 5. Labels — suppress segments < 2% (avoids invisible-sliver labels)
  const LABEL_THRESH=2;
  slices.forEach(({name,mins,pct,color,a0,a1})=>{
    if(pct<LABEL_THRESH) return;
    const tm=(a0+a1)/2;
    const rimx=px(tm),rimy=pyt(tm);
    const dx=rimx-cx,dy=rimy-topcy;
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=dx/len,ny=dy/len;
    const LEAD=11;
    const lx1=f2(rimx+nx*LEAD),ly1=f2(rimy+ny*LEAD);
    const tx=f2(rimx+nx*(LEAD+4)),ty=f2(rimy+ny*(LEAD+4)+3);
    const anchor=dx>=0?'start':'end';
    svg+=`<line x1="${f2(rimx)}" y1="${f2(rimy)}" x2="${lx1}" y2="${ly1}" stroke="var(--text)" stroke-width="0.8" opacity="0.6"/>`;
    svg+=`<text text-anchor="${anchor}" font-size="8" font-family="Space Mono,monospace" fill="var(--text)"><tspan x="${tx}" y="${ty}">${pct}%</tspan><tspan x="${tx}" dy="10">${fmtMin(mins)}</tspan></text>`;
  });

  svg+='</svg>';

  // Legend — same 2-col grid as Finance
  const legend='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:6px 12px 2px">'+
    catData.map(({name,mins,color})=>
      `<div style="display:flex;align-items:center;gap:5px">`+
        `<span style="width:8px;height:8px;border-radius:2px;background:${color};flex-shrink:0"></span>`+
        `<span style="font-family:var(--mono);font-size:8px;color:var(--mute);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>`+
        `<span style="font-family:var(--mono);font-size:8px;color:var(--text);flex-shrink:0">${fmtMin(mins)}</span>`+
      `</div>`
    ).join('')+
  '</div>';

  return `<div style="padding:8px 0">${svg}${legend}${sleepStat}</div>`;
}

// Weekly aggregate bar chart for Music Report.
// weeks = sorted array of Monday date strings; weekMap = {[monday]: {mins:number}}
function musicWeekBarsSvg(weeks, weekMap){
  const W=290,H=90,PL=4,PR=4,PT=8,PB=24;
  const chartW=W-PL-PR, chartH=H-PT-PB;
  const maxMins=Math.max(...weeks.map(wk=>weekMap[wk].mins),1);
  const n=weeks.length;
  const gap=3;
  const barW=n===1?40:Math.max(6,(chartW-(n-1)*gap)/n);
  const fmtM=m=>m>=60?Math.floor(m/60)+'h'+(m%60>0?Math.round(m%60)+'m':''):m+'m';
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">`;
  weeks.forEach((wk,i)=>{
    const mins=weekMap[wk].mins;
    const x=n===1?(W-barW)/2:PL+i*(barW+gap);
    const barH=mins>0?Math.max(3,Math.round(mins/maxMins*chartH)):2;
    const y=PT+chartH-barH;
    svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${mins>0?'var(--music)':'var(--track-bg)'}" opacity="${mins>0?'0.85':'0.3'}"/>`;
    if(mins>0) svg+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="6.5" font-family="Space Mono,monospace" fill="var(--music)" opacity="0.9">${fmtM(mins)}</text>`;
    const lbl=new Date(wk).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    svg+=`<text x="${(x+barW/2).toFixed(1)}" y="${(PT+chartH+14).toFixed(1)}" text-anchor="middle" font-size="6.5" font-family="Space Mono,monospace" fill="var(--mute)">${lbl}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

function moodEnergyTrendSvg(moodDays){
  const W=290,H=100,PL=4,PR=4,PT=14,PB=20;
  const chartW=W-PL-PR,chartH=H-PT-PB;
  const n=moodDays.length;
  const xAt=i=>n===1?PL+chartW/2:PL+i*(chartW/(n-1));
  const yAt=v=>PT+chartH-Math.round((v-1)/9*chartH);
  let moodPts='',energyPts='';
  moodDays.forEach((md,i)=>{
    const x=xAt(i).toFixed(1),ym=yAt(md.avgMood).toFixed(1),ye=yAt(md.avgEnergy).toFixed(1);
    moodPts+=(i===0?'M':'L')+x+','+ym+' ';
    energyPts+=(i===0?'M':'L')+x+','+ye+' ';
  });
  const base=(PT+chartH).toFixed(1),x0=xAt(0).toFixed(1),xLast=xAt(n-1).toFixed(1);
  const moodArea=moodPts+`L${xLast},${base} L${x0},${base} Z`;
  const energyArea=energyPts+`L${xLast},${base} L${x0},${base} Z`;
  const showIdxs=n<=5?moodDays.map((_,i)=>i):n<=12?[0,Math.floor(n/2),n-1]:[0,n-1];
  let labels='';
  showIdxs.forEach(i=>{
    const anchor=i===0?'start':i===n-1?'end':'middle';
    const lbl=new Date(moodDays[i].ds).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    labels+=`<text x="${xAt(i).toFixed(1)}" y="${H-3}" text-anchor="${anchor}" font-size="6.5" font-family="Space Mono,monospace" fill="var(--mute)">${lbl}</text>`;
  });
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">`;
  svg+=`<text x="4" y="9" font-size="6" font-family="Space Mono,monospace" fill="var(--growth)">■ MOOD</text>`;
  svg+=`<text x="54" y="9" font-size="6" font-family="Space Mono,monospace" fill="var(--finance)">■ ENERGY</text>`;
  svg+=`<path d="${moodArea}" fill="var(--growth)" opacity="0.12"/>`;
  svg+=`<path d="${energyArea}" fill="var(--finance)" opacity="0.12"/>`;
  svg+=`<path d="${moodPts.trim()}" fill="none" stroke="var(--growth)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg+=`<path d="${energyPts.trim()}" fill="none" stroke="var(--finance)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg+=labels;
  svg+=`</svg>`;
  return svg;
}

function musicRadarSvg(radarProjs){
  const W=275,H=230,cx=138,cy=112,R=70;
  const TWO_PI=Math.PI*2;
  const AXES=[
    {label:'Progress', angle:-Math.PI/2},
    {label:'Sessions', angle:-Math.PI/2+TWO_PI/5},
    {label:'Minutes',  angle:-Math.PI/2+2*TWO_PI/5},
    {label:'Quality',  angle:-Math.PI/2+3*TWO_PI/5},
    {label:'Recency',  angle:-Math.PI/2+4*TWO_PI/5}
  ];
  const pt=(a,r)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const f=v=>v.toFixed(1);
  const mkPath=pts=>pts.map(([x,y],i)=>(i?'L':'M')+f(x)+','+f(y)).join(' ')+'Z';
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">`;
  [0.33,0.66,1].forEach(t=>{
    const pts=AXES.map(a=>pt(a.angle,R*t));
    svg+=`<path d="${mkPath(pts)}" fill="none" stroke="var(--sep-alt)" stroke-width="${t===1?1:0.7}" opacity="0.55"/>`;
  });
  AXES.forEach(a=>{
    const [x,y]=pt(a.angle,R);
    svg+=`<line x1="${f(cx)}" y1="${f(cy)}" x2="${f(x)}" y2="${f(y)}" stroke="var(--sep-alt)" stroke-width="0.7" opacity="0.45"/>`;
  });
  AXES.forEach(a=>{
    const [x,y]=pt(a.angle,R+18);
    const anchor=Math.cos(a.angle)>0.3?'start':Math.cos(a.angle)<-0.3?'end':'middle';
    const dy=Math.sin(a.angle)>0.5?7:3;
    svg+=`<text x="${f(x)}" y="${f(y+dy)}" text-anchor="${anchor}" font-size="7" font-family="Space Mono,monospace" fill="var(--mute)">${a.label}</text>`;
  });
  radarProjs.forEach(proj=>{
    const vals=[proj.values.progress,proj.values.sessions,proj.values.minutes,proj.values.quality,proj.values.recency];
    const pts=AXES.map((a,i)=>pt(a.angle,(vals[i]||0)/100*R));
    const isDone=proj.status==='done';
    if(isDone){
      svg+=`<path d="${mkPath(pts)}" fill="${proj.color}" fill-opacity="0.07" stroke="${proj.color}" stroke-width="1.2" stroke-dasharray="4,2.5" stroke-linejoin="round" opacity="0.55"/>`;
    } else {
      svg+=`<path d="${mkPath(pts)}" fill="${proj.color}" fill-opacity="0.15" stroke="${proj.color}" stroke-width="1.5" stroke-linejoin="round"/>`;
    }
    pts.forEach(([x,y])=>svg+=`<circle cx="${f(x)}" cy="${f(y)}" r="${isDone?1.8:2.5}" fill="${proj.color}" opacity="${isDone?0.5:0.9}"/>`);
  });
  svg+=`</svg>`;
  return svg;
}

function musicHeatmapSvg(all){
  // Fixed 12-week lookback, Monday-start, ending on current edit-date week
  const today=new Date(EDIT_DATE);
  const startMonday=new Date(today);
  startMonday.setDate(today.getDate()-((today.getDay()+6)%7)-77); // 11 full weeks back from this Monday
  const CELL=13,GAP=2,LW=30,TH=16,ROWS=12,COLS=7;
  const W=LW+(CELL+GAP)*COLS+GAP;
  const H=TH+(CELL+GAP)*ROWS+GAP;
  const DOW=['M','T','W','T','F','S','S'];
  const f=v=>v.toFixed(1);
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:280px;height:auto;display:block;margin:0 auto">`;
  // Day-of-week header
  DOW.forEach((lbl,i)=>{
    const x=LW+i*(CELL+GAP)+CELL/2;
    svg+=`<text x="${f(x)}" y="11" text-anchor="middle" font-size="6.5" font-family="Space Mono,monospace" fill="var(--mute)">${lbl}</text>`;
  });
  for(let w=0;w<12;w++){
    const wkMon=new Date(startMonday); wkMon.setDate(startMonday.getDate()+w*7);
    const y=TH+w*(CELL+GAP);
    const monLbl=wkMon.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    svg+=`<text x="${f(LW-3)}" y="${f(y+CELL/2+2.5)}" text-anchor="end" font-size="6" font-family="Space Mono,monospace" fill="var(--mute)">${monLbl}</text>`;
    for(let d=0;d<7;d++){
      const dd=new Date(wkMon); dd.setDate(wkMon.getDate()+d);
      const ds=dd.toISOString().slice(0,10);
      const rec=all[ds];
      const mussSess=(rec&&rec.music&&rec.music.sessions)||[];
      const hasSession=mussSess.length>0;
      const mins=hasSession?mussSess.reduce((a,s)=>a+(s.minutes||0),0):0;
      const x=LW+d*(CELL+GAP);
      // Base empty cell
      svg+=`<rect x="${f(x)}" y="${f(y)}" width="${CELL}" height="${CELL}" rx="2.5" fill="var(--track-bg)" opacity="0.3"/>`;
      // Session overlay (intensity by minutes)
      if(hasSession){
        const op=mins<=30?0.3:mins<=60?0.6:0.9;
        svg+=`<rect x="${f(x)}" y="${f(y)}" width="${CELL}" height="${CELL}" rx="2.5" fill="var(--music)" opacity="${op}"/>`;
      }
    }
  }
  svg+=`</svg>`;
  return svg;

function convergenceClusterHtml(convCount, loggedCount, hitRates){
  const isLight=document.documentElement.dataset.theme==='light';
  const W=220,H=215,cx=110,cy=100;
  const d=20, rMin=13, rSpan=16; // radius: 13 (0%) → 29 (100%)
  const labelR=68;               // center → label anchor
  const f2=n=>n.toFixed(2);
  const cats=[
    {color:'var(--faith)',   name:'FAITH'},
    {color:'var(--health)',  name:'HEALTH'},
    {color:'var(--music)',   name:'MUSIC'},
    {color:'var(--finance)', name:'FINANCE'},
    {color:'var(--growth)',  name:'GROWTH'},
  ];
  const thetas=cats.map((_,i)=>-Math.PI/2+i*2*Math.PI/5);
  const radii=hitRates.map(h=>rMin+h*rSpan);

  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;height:auto;display:block;margin:0 auto">';

  // 1. Circles — translucent, sized by hit-rate, per-color glow
  cats.forEach((c,i)=>{
    const θ=thetas[i];
    const r=radii[i];
    const ccx=(cx+d*Math.cos(θ)).toFixed(2);
    const ccy=(cy+d*Math.sin(θ)).toFixed(2);
    const glw=isLight?'':' style="filter:drop-shadow(0 0 6px '+c.color+')"';
    svg+='<circle cx="'+ccx+'" cy="'+ccy+'" r="'+f2(r)+'" fill="'+c.color+'" fill-opacity="0.22"'+glw+'/>';
  });

  // 2. Backing ellipse for center legibility
  svg+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="13" ry="10" fill="var(--card-bg)" fill-opacity="0.88"/>';

  // 3. Center count
  svg+='<text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text)" font-family="DM Serif Display,serif">'+convCount+'</text>';

  // 4. Connector lines + two-line labels (name above, percentage below)
  cats.forEach((c,i)=>{
    const θ=thetas[i];
    const r=radii[i];
    const pct=Math.round(hitRates[i]*100);
    const ex=cx+(d+r)*Math.cos(θ);
    const ey=cy+(d+r)*Math.sin(θ);
    const lx=cx+labelR*Math.cos(θ);
    const ly=cy+labelR*Math.sin(θ);
    const lineEndX=cx+(labelR-15)*Math.cos(θ);
    const lineEndY=cy+(labelR-15)*Math.sin(θ);
    if((labelR-15)-(d+r)>2){
      svg+='<line x1="'+f2(ex)+'" y1="'+f2(ey)+'" x2="'+f2(lineEndX)+'" y2="'+f2(lineEndY)+'" stroke="'+c.color+'" stroke-width="0.9" stroke-opacity="0.65"/>';
    }
    // Category name (smaller, above the percentage)
    svg+='<text x="'+f2(lx)+'" y="'+f2(ly-4)+'" text-anchor="middle" font-size="6.5" font-weight="700" fill="'+c.color+'" font-family="Space Mono,monospace">'+c.name+'</text>';
    // Percentage (larger, below the name)
    svg+='<text x="'+f2(lx)+'" y="'+f2(ly+8)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+c.color+'" font-family="Space Mono,monospace">'+pct+'%</text>';
  });

  svg+='</svg>';

  const dayWord=loggedCount===1?'DAY':'DAYS';
  const sub1='<div style="text-align:center;font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.04em;margin-top:5px">CENTER = DAYS WITH 3+ CATS ≥70</div>';
  const sub2='<div style="text-align:center;font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.04em;margin-top:2px">'+loggedCount+' '+dayWord+' LOGGED</div>';
  return '<div style="padding:4px 0">'+svg+sub1+sub2+'</div>';
}

function _wupdate(col,IT){
  const ci=Math.round(col.scrollTop/IT);
  col.querySelectorAll('.wp-item').forEach((item,i)=>{
    const d=Math.abs(i-ci);
    item.style.fontSize=d===0?'26px':d===1?'18px':'13px';
    item.style.opacity=d===0?'1':d===1?'0.38':'0.15';
    item.style.color=d===0?'var(--text)':'var(--mute)';
    item.style.fontWeight=d===0?'700':'400';
  });

function _wgetVal(col,items,IT){
  IT=IT||44;
  return items[Math.min(items.length-1,Math.max(0,Math.round(col.scrollTop/IT)))];
}
function deriveMinutes(start, end){
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  let d=(eh*60+em)-(sh*60+sm);
  if(d<0)d+=1440;
  return d;
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ openModal('<div class="modal-title">Could not read file</div><div style="font-size:12px;color:var(--text);margin-bottom:14px">That file is not valid. Nothing was changed.</div><div class="modal-actions"><button class="btn-primary" onclick="closeModal()">OK</button></div>'); return; }
    if(!parsed || parsed.app!=='lifeos' || !parsed.days){
      openModal('<div class="modal-title">Not a Life OS backup</div><div style="font-size:12px;color:var(--text);margin-bottom:14px">That file does not look like a Life OS backup. Nothing was changed.</div><div class="modal-actions"><button class="btn-primary" onclick="closeModal()">OK</button></div>');
      return;
    }
    const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'unknown date';
    openModal(
      '<div class="modal-title">Restore backup</div>'+
      '<div style="font-size:12px;color:var(--text);margin-bottom:14px">This backup is from '+when+'. Restoring replaces all data currently on this device. This cannot be undone.</div>'+
      '<div class="modal-actions"><button class="btn-cancel" id="restore-cancel">Cancel</button><button class="btn-primary" id="restore-confirm">Restore</button></div>'
    );
    document.getElementById('restore-cancel').addEventListener('click', closeModal);
    document.getElementById('restore-confirm').addEventListener('click', ()=>{
      localStorage.setItem('lo_days', JSON.stringify(parsed.days||{}));
      localStorage.setItem('lo_projects', JSON.stringify(parsed.projects||[]));
      localStorage.setItem('lo_transactions', JSON.stringify(parsed.transactions||[]));
      localStorage.setItem('lo_goals', JSON.stringify(parsed.goals||{trading:0,longrange:0,savedSoFar:0,tradingWithdrawn:0}));
      localStorage.setItem('lo_books', JSON.stringify(parsed.books||[]));
      day = DB.day(EDIT_DATE);
      closeModal();
      renderAll();
    });
  };
  reader.readAsText(file);
}

  const refRec=(cachedAll||DB.allDays())[refStr]||null;
  const refLabel=offset===1?'YESTERDAY':rd.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
  let rows='';

  if(tab==='faith'){
    const sc=s=>s==='caught'?'var(--green)':s==='delayed'?'var(--amber)':s==='notprayed'?'var(--red)':'var(--mute)';
    const sl=s=>s==='caught'?'C':s==='delayed'?'D':s==='notprayed'?'M':'--';
    [['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']].forEach(([k,n])=>{
      const rs=refRec?(refRec.faith[k]||'unset'):null;
      const ts=day.faith[k]||'unset';
      rows+=cmpRow(n, rs?'<span style="color:'+sc(rs)+'">'+sl(rs)+'</span>':'<span style="color:var(--mute)">--</span>', '<span style="color:'+sc(ts)+'">'+sl(ts)+'</span>');
    });
    rows+=cmpRow('Score', refRec?'<span style="color:'+color+'">'+faithScore(refRec)+'</span>':'<span style="color:var(--mute)">--</span>', '<span style="color:'+color+'">'+faithScore(day)+'</span>');
  }

  else if(tab==='health'){
    const rh=refRec&&refRec.health?refRec.health:null;
    const th=day.health;
    const repV=(h,rk,bk)=>h?((h[rk]||0)>0?h[rk]+' reps':(h[bk]?'&#10003;':'--')):'--';
    const plankV=h=>h?(h.plankSeconds>0?formatSeconds(h.plankSeconds):(h.plank?'&#10003;':'--')):'--';
    const movV=(h,mk,bk,u)=>h?(h[mk]>0?h[mk]+u:(h[bk]?'&#10003;':'--')):'--';
    rows+=cmpRow('Sleep', rh?(rh.sleepHours?rh.sleepHours+'h':'--'):'--', th.sleepHours?th.sleepHours+'h':'--');
    rows+=cmpRow('Water', rh?(rh.water||0)+'/5':'--', (th.water||0)+'/5');
    rows+=cmpRow('Push-ups', repV(rh,'pushupsReps','pushups'), repV(th,'pushupsReps','pushups'));
    rows+=cmpRow('Ab roller', repV(rh,'abrollerReps','abroller'), repV(th,'abrollerReps','abroller'));
    rows+=cmpRow('Kegel', repV(rh,'kegelReps','kegel'), repV(th,'kegelReps','kegel'));
    rows+=cmpRow('Mat routine', repV(rh,'matroutineReps','matroutine'), repV(th,'matroutineReps','matroutine'));
    rows+=cmpRow('Plank', plankV(rh), plankV(th));
    rows+=cmpRow('Tennis', movV(rh,'tennisMinutes','tennis',' min'), movV(th,'tennisMinutes','tennis',' min'));
    rows+=cmpRow('Running (km)', movV(rh,'runningKm','running',' km'), movV(th,'runningKm','running',' km'));
    rows+=cmpRow('Running (min)', movV(rh,'runningMinutes','',' min'), movV(th,'runningMinutes','',' min'));
    rows+=cmpRow('Hiking', movV(rh,'hikingMinutes','',' min'), movV(th,'hikingMinutes','',' min'));
    rows+=cmpRow('Walking', movV(rh,'walkingMinutes','',' min'), movV(th,'walkingMinutes','',' min'));
  }

  else if(tab==='music'){
    const rm=refRec&&refRec.music?refRec.music:null;
    const tm=day.music;
    const pn=id=>{if(!id)return '--';if(id==='instrumentals')return 'Instru.';const p=DB.projects().find(x=>x.id===id);return p?p.name:'--';};
    const rmSess=(rm&&rm.sessions)||[];
    const tmSess=(tm&&tm.sessions)||[];
    const rmTotal=rmSess.reduce((a,s)=>a+(s.minutes||0),0);
    const tmTotal=tmSess.reduce((a,s)=>a+(s.minutes||0),0);
    const rmProj=[...new Set(rmSess.map(s=>s.workedOn).filter(Boolean))].map(pn).join(', ')||'--';
    const tmProj=[...new Set(tmSess.map(s=>s.workedOn).filter(Boolean))].map(pn).join(', ')||'--';
    rows+=cmpRow('Sessions', rm?(rmSess.length+' session'+(rmSess.length!==1?'s':'')):'--', tmSess.length+' session'+(tmSess.length!==1?'s':''));
    rows+=cmpRow('Projects', rm?rmProj:'--', tmProj);
    rows+=cmpRow('Total time', rm?(rmTotal>0?rmTotal+' min':'--'):'--', tmTotal>0?tmTotal+' min':'--');
  }

  else if(tab==='finance'){
    const txs=DB.transactions();
    const rTx=txs.filter(t=>t.date===refStr);
    const tTx=txs.filter(t=>t.date===EDIT_DATE);
    const rTot=rTx.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
    const tTot=tTx.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
    rows+=cmpRow('Total spend',
      '<span style="color:'+(rTot>0?'var(--red)':'var(--mute)')+'">'+rTot.toLocaleString()+'</span>',
      '<span style="color:'+(tTot>0?'var(--red)':'var(--mute)')+'">'+tTot.toLocaleString()+'</span>');
    ['Rent','Food','Business costs','Transport','Weed','Cigarettes','Given to people','Home bills','Other'].forEach(cat=>{
      const rA=rTx.filter(t=>t.type==='expense'&&t.category===cat).reduce((a,b)=>a+b.amount,0);
      const tA=tTx.filter(t=>t.type==='expense'&&t.category===cat).reduce((a,b)=>a+b.amount,0);
      if(rA>0||tA>0) rows+=cmpRow(cat, rA?rA.toLocaleString():'-', tA?tA.toLocaleString():'-');
    });
    if(!rTot&&!tTot) rows+='<div style="font-size:10px;color:var(--mute);padding:4px 0">No expenses on either day.</div>';
  }

  else if(tab==='growth'){
    const tg=day.growth||{};
    const rg=refRec&&refRec.growth?refRec.growth:null;
    const _growthSummary=g=>{
      if(!g) return '<span style="color:var(--mute)">--</span>';
      if(g.reps||g.checks){
        const reps=g.reps||{}, chks=g.checks||{};
        const repPts=GR_REPS_KEYS.reduce((s,k)=>s+Math.min((reps[k]||0)/GR_REPS_TARGET,1),0);
        const chkPts=GR_CHK_KEYS.filter(k=>chks[k]==='yes').length;
        return '<span style="color:'+color+'">'+(repPts+chkPts).toFixed(1)+'/'+(GR_REPS_KEYS.length+GR_CHK_KEYS.length)+'</span>';
      }
      return '<span style="color:'+color+'">'+GROWTH_ITEMS.filter(k=>g[k]).length+'/'+GROWTH_ITEMS.length+'</span>';
    };
    rows+=cmpRow('Items hit', _growthSummary(rg), _growthSummary(tg));
  }

  const ab='font-family:var(--mono);font-size:13px;padding:1px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;';
  return '<div class="card" style="padding:12px 14px 10px">'+
    '<div style="display:flex;align-items:center;margin-bottom:8px;gap:6px">'+
    '<button data-cmp-back style="'+ab+'color:var(--text)">&#8592;</button>'+
    '<div style="flex:1;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:1px">'+
    '<span style="color:'+color+'">'+refLabel+'</span>'+
    '<span style="color:var(--mute)"> &middot; vs &middot; </span>'+
    '<span style="color:var(--text)">'+(EDIT_DATE===TODAY?'TODAY':new Date(EDIT_DATE+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase())+'</span>'+
    '</div>'+
    '<button data-cmp-fwd style="'+ab+'color:'+(offset<=1?'var(--border)':'var(--text)')+'">&#8594;</button>'+
    '</div>'+rows+'</div>';
}
function wireCmpArrows(s, tab, renderFn){
  const back=s.querySelector('[data-cmp-back]');
  const fwd=s.querySelector('[data-cmp-fwd]');
  if(back) back.addEventListener('click',()=>{ cmpOffset[tab]++; renderFn(); });
  if(fwd) fwd.addEventListener('click',()=>{ if(cmpOffset[tab]>1){ cmpOffset[tab]--; renderFn(); } });
}

/* ============ CALENDAR ============ */
function calendarHtml(all, calY, calM, calMode){
  const daysInMonth = new Date(calY, calM, 0).getDate();
  const prefix = calY+'-'+String(calM).padStart(2,'0');
  const scores = {};
  for(let d=1;d<=daysInMonth;d++){
    const ds=prefix+'-'+String(d).padStart(2,'0');
    const rec=all[ds];
    scores[d]=rec?dayScore(rec):null;
  }
  const logged=Object.values(scores).filter(s=>s!==null);
  const bestScore=logged.length?Math.max(...logged):null;
  const worstScore=logged.length?Math.min(...logged):null;
  const monthAve=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):null;
  const bestDay=bestScore!==null?parseInt(Object.keys(scores).find(d=>scores[d]===bestScore)):null;
  const worstDay=worstScore!==null?parseInt(Object.keys(scores).find(d=>scores[d]===worstScore)):null;
  const streak=computeStreak(r=>dayScore(r)>0);
  const isLight=document.documentElement.dataset.theme==='light';
  let h='';
  // Stats row
  h+='<div class="cal-stat-grid">';
  const sc2=(v,col,lbl)=>'<div class="cal-stat-cell"><div class="v" style="color:'+col+'">'+v+'</div><div class="l">'+lbl+'</div></div>';
  h+=sc2(bestScore!==null?bestScore:'--','var(--green)','BEST');
  h+=sc2(worstScore!==null?worstScore:'--','var(--red)','WORST');
  h+=sc2(streak,'var(--cyan)','STREAK');
  h+=sc2(monthAve!==null?monthAve:'--','var(--text)','AVG');
  h+='</div>';
  // View toggle
  h+='<div style="display:flex;gap:6px;margin-bottom:8px">'+
    '<button class="opt-btn cal-mode-btn'+(calMode==='cards'?' sel':'')+'" data-cal-mode="cards" style="flex:1;padding:6px 0;font-size:10px">Cards</button>'+
    '<button class="opt-btn cal-mode-btn'+(calMode==='bubbles'?' sel':'')+'" data-cal-mode="bubbles" style="flex:1;padding:6px 0;font-size:10px">Bubbles</button>'+
    '</div>';
  // Day-of-week header
  h+='<div class="cal-dow-row"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
  // Grid
  const firstDow=(new Date(calY,calM-1,1).getDay()+6)%7;
  let dn=1-firstDow;
  h+='<div class="cal2">';
  while(dn<=daysInMonth){
    const weekStartDn=dn;
    h+='<div class="cal-week">';
    for(let col=0;col<7;col++){
      if(dn<1||dn>daysInMonth){
        h+='<div style="aspect-ratio:1"></div>';
      } else {
        const sc=scores[dn];
        const ds=prefix+'-'+String(dn).padStart(2,'0');
        const isBest=dn===bestDay;
        const isWorst=dn===worstDay;
        if(calMode==='cards'){
          const isHighlight=(isBest||isWorst)&&sc!==null;
          let bg,sc_col;
          if(sc===null){
            bg='var(--track-bg)'; sc_col='var(--mute)';
          } else {
            const isGreen=sc>=50;
            const intensity=isGreen?(sc-50)/50:(50-sc)/50;
            const bgOp=isHighlight?0.35:(0.12+intensity*0.38);
            bg='rgba('+(isGreen?'61,220,151':'210,45,45')+','+bgOp.toFixed(2)+')';
            sc_col=isGreen?'var(--green)':'rgba(230,85,85,1)';
          }
          // Glow ring: worst takes priority over best when the same day is tied
          let shadow='';
          if(isWorst&&sc!==null) shadow=isLight?'box-shadow:0 0 0 2px rgba(210,45,45,.9)':'box-shadow:0 0 0 2px rgba(210,45,45,.9),0 0 8px rgba(210,45,45,.5)';
          else if(isBest&&sc!==null) shadow=isLight?'box-shadow:0 0 0 2px var(--green)':'box-shadow:0 0 0 2px var(--green),0 0 8px var(--green)';
          h+='<div class="cal-card2" data-date="'+ds+'" style="background:'+bg+';border:1px solid var(--card-border);'+(shadow||'')+'">'
           +'<span style="font-family:var(--mono);font-size:7px;color:var(--mute)">'+dn+'</span>'
           +(sc!==null?'<span style="font-family:var(--mono);font-size:9px;font-weight:700;color:'+sc_col+'">'+sc+'</span>':'')
           +'</div>';
        } else {
          const r=sc!==null?Math.max(4,Math.round((sc/100)*60)):0;
          const cc=isBest&&sc!==null?'var(--green)':isWorst&&sc!==null?'var(--red)':'var(--cyan)';
          const glow=((isBest||isWorst)&&sc!==null&&!isLight)?'filter:drop-shadow(0 0 5px '+cc+')':'';
          h+='<div class="cal-bubble-cell" data-date="'+ds+'">'
           +(sc!==null?'<svg width="100%" height="100%" viewBox="0 0 100 100" style="position:absolute;inset:0;overflow:visible;pointer-events:none;'+glow+'"><circle cx="50" cy="50" r="'+r+'" fill="'+cc+'" fill-opacity="0.55"/></svg>':'')
           +'<span style="font-family:var(--mono);font-size:8px;color:var('+(sc!==null?'--text':'--mute')+');position:relative;z-index:1">'+dn+'</span>'
           +'</div>';
        }
      }
      dn++;
    }
    h+='</div>';
    // Weekly rollup bar
    const wStart=Math.max(1,weekStartDn);
    const wEnd=Math.min(daysInMonth,dn-1);
    const wScores=[];
    for(let wd=wStart;wd<=wEnd;wd++){if(scores[wd]!==null)wScores.push(scores[wd]);}
    const wAvg=wScores.length?Math.round(wScores.reduce((a,b)=>a+b,0)/wScores.length):0;
    const wColor=wAvg>=80?'var(--green)':wAvg>=50?'var(--amber)':'var(--red)';
    h+='<div class="cal-rollup"><div class="cal-rollup-fill" style="width:'+(wScores.length?wAvg:0)+'%;background:'+(wScores.length?wColor:'transparent')+'"></div></div>';
  }
  h+='</div>';
  return h;
}

  if(fBStreak>0||sBStreak>0){

  }

    const dd = new Date(TODAY); dd.setDate(dd.getDate()-i);

    trendDays.push({date:dd, score: rec?dayScore(rec):null});
  }
  const validScores = trendDays.filter(t=>t.score!==null).map(t=>t.score);
  const maxS = validScores.length?Math.max(...validScores,1):100;
  const minS = validScores.length?Math.min(...validScores,0):0;
  const range = Math.max(maxS-minS,1);
  const chartW=260, chartH=50;
  const pts = trendDays.map((t,i)=>{
    const x = (i/(trendDays.length-1))*chartW;
    const y = t.score===null ? chartH/2 : chartH - ((t.score-minS)/range)*chartH;
    return {x,y,score:t.score};
  });
  const linePts = pts.filter(p=>p.score!==null);

/* ============ PRAYER TIMES (Kigali, MWL method) ============ */
function calcPrayerTimes(dateStr){
  const LAT=-1.9441, LNG=30.0619;
  const d=new Date(dateStr+'T00:00:00Z');
  const Y=d.getUTCFullYear(), Mo=d.getUTCMonth()+1, DD=d.getUTCDate();
  const A=Math.floor((14-Mo)/12), y=Y+4800-A, m=Mo+12*A-3;
  const JD=DD+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  const D=JD-2451545.0;
  const toR=x=>x*Math.PI/180;
  const g=toR(((357.529+0.98560028*D)%360+360)%360);
  const q=((280.459+0.98564736*D)%360+360)%360;
  const L=toR(((q+1.915*Math.sin(g)+0.02*Math.sin(2*g))%360+360)%360);
  const e=toR(23.439-0.00000036*D);
  const RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))*180/Math.PI/15;
  const decl=Math.asin(Math.sin(e)*Math.sin(L));
  const Tnoon=12-LNG/15-(q/15-RA);
  const ha=alt=>{
    const c=(Math.sin(toR(alt))-Math.sin(toR(LAT))*Math.sin(decl))/(Math.cos(toR(LAT))*Math.cos(decl));
    return(c<=-1||c>=1)?null:Math.acos(c)*180/Math.PI/15;
  };
  const nAlt=90-Math.abs(LAT-decl*180/Math.PI);
  const asrAlt=Math.atan(1/(1+1/Math.tan(toR(nAlt))))*180/Math.PI;
  const pad=n=>String(n).padStart(2,'0');
  const toHM=h=>{
    if(h===null)return'--:--';
    const loc=((h+3)%24+24)%24;
    return pad(Math.floor(loc))+':'+pad(Math.floor((loc%1)*60));
  };
  const fH=ha(-18),aH=ha(asrAlt),mH=ha(-0.833),iH=ha(-17);
  return{
    fajr:toHM(fH!==null?Tnoon-fH:null),dhuhr:toHM(Tnoon+1/60),
    asr:toHM(aH!==null?Tnoon+aH:null),maghrib:toHM(mH!==null?Tnoon+mH:null),isha:toHM(iH!==null?Tnoon+iH:null),
    fajrUTC:fH!==null?Tnoon-fH:null,dhuhrUTC:Tnoon+1/60,
    asrUTC:aH!==null?Tnoon+aH:null,maghribUTC:mH!==null?Tnoon+mH:null,ishaUTC:iH!==null?Tnoon+iH:null
  };
}
function renderFaithCountdown(){
  const el=document.getElementById('swalat-cd');
  if(!el)return;
  // Skip silently when faith tab isn't visible — avoids background compositor pressure
  if(!document.getElementById('s-faith').classList.contains('active'))return;
  const pt=calcPrayerTimes(TODAY);
  const names=['fajr','dhuhr','asr','maghrib','isha'];
  const labels={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
  const utcK={fajr:'fajrUTC',dhuhr:'dhuhrUTC',asr:'asrUTC',maghrib:'maghribUTC',isha:'ishaUTC'};
  const now=Date.now();
  const base=new Date(TODAY+'T00:00:00Z').getTime();
  let nextName=null,nextMs=null,nextDisp=null;
  for(const n of names){
    const u=pt[utcK[n]];
    if(u===null)continue;
    const ms=base+u*3600000;
    if(ms>now){nextName=n;nextMs=ms;nextDisp=pt[n];break;}
  }
  if(!nextName){
    const tmr=new Date(now+86400000).toISOString().slice(0,10);
    const tp=calcPrayerTimes(tmr);
    if(tp.fajrUTC!==null){nextName='fajr';nextMs=new Date(tmr+'T00:00:00Z').getTime()+tp.fajrUTC*3600000;nextDisp=tp.fajr;}
  }
  if(!nextName){el.innerHTML='';return;}
  const diff=Math.max(0,Math.floor((nextMs-now)/1000));
  const pad=n=>String(n).padStart(2,'0');
  const digits=pad(Math.floor(diff/3600))+':'+pad(Math.floor(diff%3600/60))+':'+pad(diff%60);
  // Fast path: only update digits textContent when prayer hasn't changed
  const cdSpan=document.getElementById('swalat-cd-digits');
  if(cdSpan&&cdCurrentPrayer===nextName){
    cdSpan.textContent=digits;
    return;
  }
  // Full build: first render or prayer just rolled over to the next one
  cdCurrentPrayer=nextName;
  el.innerHTML='<div style="text-align:center;padding:10px 0">'
    +'<div style="font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:1px">NEXT PRAYER</div>'
    +'<div style="margin:5px 0 2px">'
    +'<span style="font-size:16px;font-weight:700;color:var(--faith);font-family:var(--sans)">'+labels[nextName]+'</span>'
    +'<span style="font-family:var(--mono);font-size:13px;color:var(--mute);margin:0 5px">&middot;</span>'
    +'<span style="font-family:var(--mono);font-size:14px;color:var(--faith)">'+nextDisp+'</span>'
    +'</div>'
    +'<div id="swalat-cd-digits" style="font-family:var(--mono);font-size:30px;font-weight:700;color:var(--text);letter-spacing:3px;margin:4px 0">'+digits+'</div>'
    +'<div style="font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:1px">REMAINING</div>'
    +'</div>';
}

function computeFaithBests(){
  const all = DB.allDays();
  const dates = Object.keys(all).sort();
  const prayers = ['fajr','dhuhr','asr','maghrib','isha'];
  const extras = ['tahajjud','fasting','dhikr','gratitude'];
  const runs = {};
  const bests = {};
  [...prayers,...extras].forEach(k=>{ runs[k]=0; bests[k]=0; });
  dates.forEach(ds=>{
    const r = all[ds];
    const f = r.faith || {};
    prayers.forEach(k=>{
      if(f[k]==='caught'){ runs[k]++; if(runs[k]>bests[k]) bests[k]=runs[k]; } else runs[k]=0;
    });
    extras.forEach(k=>{
      if(f[k]===true){ runs[k]++; if(runs[k]>bests[k]) bests[k]=runs[k]; } else runs[k]=0;
    });
  });
  return bests;
}

    d.setDate(d.getDate()-daysSinceMon);
    const weekStart=d.toISOString().slice(0,10);

  } else if(faithReportPeriod==='3week'){
    const cut=new Date(EDIT_DATE); cut.setDate(cut.getDate()-20);

function formatSeconds(s){
  const m=Math.floor(s/60),sec=s%60;
  return m+':'+(sec<10?'0':'')+sec;
}
function allTimeBest(key){
  const all=DB.allDays(); let best=0;
  Object.values(all).forEach(d=>{ if(d.health&&(d.health[key]||0)>best) best=d.health[key]||0; });
  return best;
}
function repSparklineHtml(key){
  const all=DB.allDays();
  const bars=[];
  for(let i=6;i>=0;i--){
    const dd=new Date(EDIT_DATE); dd.setDate(dd.getDate()-i);
    const ds=dd.toISOString().slice(0,10);
    const val=i===0?(day.health[key]||0):(all[ds]&&all[ds].health?(all[ds].health[key]||0):0);
    bars.push(val);
  }
  const maxVal=Math.max(...bars,1);
  const H=26,bw=9,gap=3,W=81;
  const isLight=document.documentElement.dataset.theme==='light';
  const normalRects=[],prRects=[];
  bars.forEach((val,i)=>{
    const x=i*(bw+gap);
    const barH=Math.max(val>0?3:1,Math.round((val/maxVal)*H));
    const y=H-barH;
    const isToday=i===6;
    const isBest=val===maxVal&&val>0;
    const col=isToday?'var(--health)':isBest?'var(--amber)':'var(--border)';
    const rect='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+barH+'" rx="2" fill="'+col+'"/>';
    if(isBest&&!isToday&&!isLight) prRects.push(rect);
    else normalRects.push(rect);
  });
  let svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;flex-shrink:0">';
  svg+=normalRects.join('');
  if(prRects.length) svg+='<g style="filter:drop-shadow(0 0 3px var(--amber))">'+prRects.join('')+'</g>';
  return svg+'</svg>';
}
function repRowHtml(key,label){
  const val=day.health[key]||0;
  const best=allTimeBest(key);
  const isPR=val>0&&val>best;
  return '<div class="checkline" data-rep="'+key+'">'+
    '<span style="flex:1">'+label+'</span>'+
    (isPR?'<span style="font-family:var(--mono);font-size:8px;background:rgba(224,180,84,.15);color:var(--amber);padding:2px 5px;border-radius:3px;margin-right:6px">NEW PR</span>':'')+
    '<span style="font-family:var(--mono);font-size:11px;color:'+(val>0?'var(--health)':'var(--mute)')+';margin-right:8px">'+(val>0?val+' reps':'--')+'</span>'+
    repSparklineHtml(key)+
    '</div>';
}

function computeAllTimeBests(){
  const all=DB.allDays();
  const dates=Object.keys(all).sort();
  let fajrRun=0,maxFajr=0,smokeRun=0,maxSmoke=0;
  dates.forEach(d=>{
    const r=all[d];
    if(r.faith&&r.faith.fajr==='caught'){fajrRun++;if(fajrRun>maxFajr)maxFajr=fajrRun;}else fajrRun=0;
    if(r.health&&r.health.smokeFree===true){smokeRun++;if(smokeRun>maxSmoke)maxSmoke=smokeRun;}else smokeRun=0;
  });
  const b={fajrStreak:maxFajr,smokeStreak:maxSmoke,studioMins:0,pushupsReps:0,abrollerReps:0,kegelReps:0,matroutineReps:0,plankSeconds:0};
  Object.values(all).forEach(d=>{
    if(d.music) b.studioMins=Math.max(b.studioMins,(d.music.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0));
    if(d.health){
      const h=d.health;
      b.pushupsReps=Math.max(b.pushupsReps,h.pushupsReps||0);
      b.abrollerReps=Math.max(b.abrollerReps,h.abrollerReps||0);
      b.kegelReps=Math.max(b.kegelReps,h.kegelReps||0);
      b.matroutineReps=Math.max(b.matroutineReps,h.matroutineReps||0);
      b.plankSeconds=Math.max(b.plankSeconds,h.plankBestSession||h.plankSeconds||0);
    }
  });
  return b;
}

function computeHealthBests(){
  const all = DB.allDays();
  const dates = Object.keys(all).sort();
  const runs = {smokeFree:0,pushupsReps:0,abrollerReps:0,kegelReps:0,matroutineReps:0,plankSeconds:0};
  const bests = {smokeFree:0,pushupsReps:0,abrollerReps:0,kegelReps:0,matroutineReps:0,plankSeconds:0};
  dates.forEach(ds=>{
    const h = (all[ds]&&all[ds].health)||{};
    const check=(k,cond)=>{ if(cond){runs[k]++;if(runs[k]>bests[k])bests[k]=runs[k];}else runs[k]=0; };
    check('smokeFree', h.smokeFree===true);
    check('pushupsReps', (h.pushupsReps||0)>0||h.pushups);
    check('abrollerReps', (h.abrollerReps||0)>0||h.abroller);
    check('kegelReps', (h.kegelReps||0)>0||h.kegel);
    check('matroutineReps', (h.matroutineReps||0)>0||h.matroutine);
    check('plankSeconds', (h.plankSeconds||0)>0||h.plank);
  });
  return bests;
}

/* ============ HEALTH REPORT ============ */
function renderHealthReport(s){
  const all = DB.allDays();
  const allDates = Object.keys(all).sort();

  let periodDates;
  if(healthReportPeriod==='today'){
    periodDates = allDates.filter(d=>d===EDIT_DATE);
  } else if(healthReportPeriod==='week'){
    const d=new Date(EDIT_DATE); const daysSinceMon=(d.getDay()+6)%7; d.setDate(d.getDate()-daysSinceMon);
    const weekStart=d.toISOString().slice(0,10);
    periodDates = allDates.filter(d=>d>=weekStart&&d<=EDIT_DATE);
  } else if(healthReportPeriod==='3week'){
    const cut=new Date(EDIT_DATE); cut.setDate(cut.getDate()-20);
    periodDates = allDates.filter(d=>d>=cut.toISOString().slice(0,10)&&d<=EDIT_DATE);
  } else if(healthReportPeriod==='month'){
    periodDates = allDates.filter(d=>d.startsWith(EDIT_DATE.slice(0,7)));
  } else if(healthReportPeriod==='3month'){
    const cut=new Date(EDIT_DATE); cut.setMonth(cut.getMonth()-3);
    periodDates = allDates.filter(d=>d>=cut.toISOString().slice(0,10));
  } else {
    periodDates = allDates;
  }

  const periodRecs = periodDates.map(d=>all[d]).filter(Boolean);
  const healthRecs = periodRecs.filter(r=>r.health);
  const N = healthRecs.length;

  // Calendar days in selected period (for sleep donut denominator: total available hours = periodDays×24)
  let periodDays=1;
  if(healthReportPeriod==='today') periodDays=1;
  else if(healthReportPeriod==='week'){ const d=new Date(EDIT_DATE); periodDays=(d.getDay()+6)%7+1; }
  else if(healthReportPeriod==='3week') periodDays=21;
  else if(healthReportPeriod==='month') periodDays=parseInt(EDIT_DATE.slice(8,10));
  else if(healthReportPeriod==='3month') periodDays=90;
  else { // all time
    if(allDates.length>0){ const first=new Date(allDates[0]+'T00:00:00'),last=new Date(EDIT_DATE+'T00:00:00'); periodDays=Math.round((last-first)/86400000)+1; } else periodDays=1;
  }

  let html =
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">`+
    `<button class="btn-ghost" id="health-report-back" style="border-color:var(--health);color:var(--health);padding:6px 14px;font-size:12px">← Back</button>`+
    `<span style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em">HEALTH REPORT</span>`+
    `</div>`;

  const row1=[['today','Today'],['week','This Week'],['3week','Last 3 Weeks']];
  const row2=[['month','This Month'],['3month','Last 3 Months'],['all','All Time']];
  html+=`<div class="btn-group" style="margin-bottom:6px">`;
  row1.forEach(([key,label])=>{ html+=`<button class="opt-btn health-period${healthReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div><div class="btn-group" style="margin-bottom:14px">`;
  row2.forEach(([key,label])=>{ html+=`<button class="opt-btn health-period${healthReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div>`;

  // ── HABIT CONSISTENCY ──
  // Water threshold: >=5 glasses = full point (matches healthScore() partial-credit ceiling)
  // Brushing threshold: >=2 sessions = full point (same rationale)
  html += sectionLabel('HABIT CONSISTENCY','var(--health)');
  if(N===0){
    html += `<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:20px">No Health data logged for this period</div>`;
  } else {
    const goodHabits=[['fruits','Fruits'],['milk','Milk'],['stopstart','Stop-start'],['smokeFree','Smoke-free'],['knifesharpening','Knife sharpening'],['penilemassage','Penile massage']];
    const cnt={};
    goodHabits.forEach(([k])=>{ cnt[k]=healthRecs.filter(r=>r.health[k]===true).length; });
    cnt.water_target = healthRecs.filter(r=>(r.health.water||0)>0).length;
    cnt.brushing_target = healthRecs.filter(r=>(r.health.brushing||0)>0).length;
    const bars=[...goodHabits,['water_target','Water (any)'],['brushing_target','Brushing (any)']];
    html += `<div class="card" style="padding:12px 14px">`;
    html += `<div style="display:flex;gap:12px;margin-bottom:10px;font-family:var(--mono);font-size:8px;color:var(--mute)">`;
    html += `<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--green);display:inline-block"></span>Done</span>`;
    html += `<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--track-bg);display:inline-block"></span>Not logged</span>`;
    html += `</div>`;
    bars.forEach(([key,name])=>{
      const done=cnt[key]||0; const rest=N-done;
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">`;
      html += `<span style="font-family:var(--mono);font-size:9px;color:var(--mute);width:94px;flex-shrink:0">${name}</span>`;
      html += `<div style="flex:1;display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--track-bg)">`;
      if(done>0) html += `<div style="flex:${done};background:var(--green);opacity:0.85"></div>`;
      if(rest>0) html += `<div style="flex:${rest};background:transparent"></div>`;
      html += `</div>`;
      html += `<span style="font-family:var(--mono);font-size:8px;color:${done>0?'var(--green)':'var(--mute)'};width:36px;flex-shrink:0;text-align:right">${done}/${N}</span>`;
      html += `</div>`;
    });
    const junkFree=healthRecs.filter(r=>r.health.junk!==true).length;
    const weedFree=healthRecs.filter(r=>r.health.weed!==true).length;
    const nbFree=healthRecs.filter(r=>r.health.nailbiting!==true).length;
    html += `<div style="border-top:1px solid var(--sep-alt);margin-top:8px;padding-top:10px">`;
    html += `<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:6px;letter-spacing:1px">AVOIDANCES</div>`;
    [['Junk-free',junkFree],['Weed-free',weedFree],['Nail-biting-free',nbFree]].forEach(([label,c])=>{
      html += `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">`;
      html += `<span>${label}</span><span style="font-family:var(--mono);color:${c===N?'var(--green)':c>0?'var(--health)':'var(--mute)'}">${c}/${N} days</span>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  // ── TIME BUDGET ──
  const sleepDates = periodDates.slice(-60);
  const sleepVals = sleepDates.map(d=>{ const r=all[d]; return (r&&r.health&&r.health.sleepHours>0)?r.health.sleepHours:null; });
  const totalSleepH = healthRecs.reduce((s,r)=>s+(r.health.sleepHours||0),0);

    const totalMinsInPeriod = periodDays*24*60;

    const tLoH=Math.round(7*periodDays), tHiH=Math.round(9*periodDays);
    const dispSleepH=totalSleepH>0?(Math.round(totalSleepH*10)/10)+'h':'--';
    let sleepDelta='';
    if(totalSleepH>0){
      if(totalSleepH>=tLoH&&totalSleepH<=tHiH) sleepDelta=' · on target';
      else if(totalSleepH>tHiH) sleepDelta=' · '+Math.round(totalSleepH-tHiH)+'h over';

    if(sleepDates.length<=10){
      html += `<div class="trend-labels">`+sleepDates.map(d=>`<span>${new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).charAt(0)}</span>`).join('')+`</div>`;
    }
    html += `</div>`;
  }

  // ── STAMINA RECORDS ──
  html += sectionLabel('STAMINA RECORDS','var(--health)');
  const allB = computeAllTimeBests();
  const pB = {pushupsReps:0,abrollerReps:0,kegelReps:0,matroutineReps:0,plankSeconds:0};
  let totRunning=0;
  healthRecs.forEach(r=>{
    const h=r.health;
    pB.pushupsReps=Math.max(pB.pushupsReps,h.pushupsReps||0);
    pB.abrollerReps=Math.max(pB.abrollerReps,h.abrollerReps||0);
    pB.kegelReps=Math.max(pB.kegelReps,h.kegelReps||0);
    pB.matroutineReps=Math.max(pB.matroutineReps,h.matroutineReps||0);
    pB.plankSeconds=Math.max(pB.plankSeconds,h.plankBestSession||h.plankSeconds||0);
    totRunning+=h.runningKm||0;
  });
  totRunning=Math.round(totRunning*10)/10;
  if(N===0){
    html += `<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:20px">No data for this period</div>`;
  } else {
    html += `<div class="card">`;
    html += `<div style="display:flex;padding:4px 0 6px;border-bottom:1px solid var(--sep-alt);font-family:var(--mono);font-size:8px;color:var(--mute)">`;
    html += `<span style="flex:1"></span><span style="width:90px;text-align:right">Period best</span><span style="width:80px;text-align:right">All time</span></div>`;
    [['pushupsReps','Push-ups','reps'],['abrollerReps','Ab roller','reps'],['kegelReps','Kegel','reps'],['matroutineReps','Mat routine','reps']].forEach(([k,label,unit])=>{
      const pv=pB[k], av=allB[k]||0;
      html += `<div class="stat-row"><span style="font-size:11px">${label}</span><span style="display:flex">`;
