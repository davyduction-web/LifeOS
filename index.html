  wireCmpArrows(s, 'finance', renderFinance);

  document.getElementById('open-report').addEventListener('click',()=>{
    financeReportOpen=true;
    renderFinance();
  });
  document.getElementById('add-tx').addEventListener('click', openTxModal);
  s.querySelectorAll('.tx-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = parseInt(row.dataset.txid, 10);
      const tx = DB.transactions().find(t=>t.id===id);
      if(tx) openEditTxModal(tx);
    });
  });
  document.getElementById('save-finance').addEventListener('click', ()=>{
    const notesEl=document.getElementById('finance-notes');
    if(notesEl) day.finance.notes=notesEl.value;
    const g = DB.goals();
    g.trading = parseFloat(document.getElementById('trading-goal').value)||0;
    g.longrange = parseFloat(document.getElementById('longrange-goal').value)||0;
    DB.saveGoals(g);
    saveDayNow();
  });
  patchAriaRoles(s);
}

/* ============ GROWTH REPORT ============ */
function renderGrowthReport(s){
  const all = DB.allDays();
  const allDates = Object.keys(all).sort();

  let periodDates;
  if(growthReportPeriod==='today'){
    periodDates = allDates.filter(d=>d===EDIT_DATE);
  } else if(growthReportPeriod==='week'){
    const d=new Date(EDIT_DATE); const daysSinceMon=(d.getDay()+6)%7; d.setDate(d.getDate()-daysSinceMon);
    const weekStart=d.toISOString().slice(0,10);
    periodDates = allDates.filter(d=>d>=weekStart&&d<=EDIT_DATE);
  } else if(growthReportPeriod==='3week'){
    const cut=new Date(EDIT_DATE); cut.setDate(cut.getDate()-20);
    periodDates = allDates.filter(d=>d>=cut.toISOString().slice(0,10)&&d<=EDIT_DATE);
  } else if(growthReportPeriod==='month'){
    periodDates = allDates.filter(d=>d.startsWith(EDIT_DATE.slice(0,7)));
  } else if(growthReportPeriod==='3month'){
    const cut=new Date(EDIT_DATE); cut.setMonth(cut.getMonth()-3);
    periodDates = allDates.filter(d=>d>=cut.toISOString().slice(0,10));
  } else {
    periodDates = allDates;
  }

  const periodRecs = periodDates.map(d=>all[d]).filter(Boolean);
  const N = periodRecs.length;
  const scoredDays = periodRecs.map(r=>growthScore(r));
  const activeDays = scoredDays.filter(s=>s>0).length;
  const periodAvg = N>0 ? Math.round(scoredDays.reduce((a,b)=>a+b,0)/N) : 0;

  // Best streak (all-time: consecutive days growthScore > 0)
  let bestStreak=0, run=0;
  allDates.forEach(ds=>{ const r=all[ds]; if(r&&growthScore(r)>0){run++;if(run>bestStreak)bestStreak=run;}else run=0; });

  // Weekly aggregation (avg growthScore per calendar week)
  function mondayOf(ds){ const d=new Date(ds); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toISOString().slice(0,10); }
  const weekMap={};
  periodDates.forEach(ds=>{
    const wk=mondayOf(ds);
    if(!weekMap[wk]) weekMap[wk]={total:0,count:0,score:0};
    const rec=all[ds];
    if(rec){ weekMap[wk].total+=growthScore(rec); weekMap[wk].count++; }
  });
  Object.keys(weekMap).forEach(wk=>{ weekMap[wk].score=weekMap[wk].count>0?Math.round(weekMap[wk].total/weekMap[wk].count):0; });
  const weeks=Object.keys(weekMap).sort();

  const pLabel={'today':'TODAY','week':'THIS WEEK','3week':'LAST 3 WEEKS','month':'THIS MONTH','3month':'LAST 3 MONTHS','all':'ALL TIME'}[growthReportPeriod]||'ALL TIME';

  let html =
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">`+
    `<button class="btn-ghost" id="growth-report-back" style="border-color:var(--growth);color:var(--growth);padding:6px 14px;font-size:12px">← Back</button>`+
    `<span style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em">GROWTH REPORT</span>`+
    `</div>`;

  const row1=[['today','Today'],['week','This Week'],['3week','Last 3 Weeks']];
  const row2=[['month','This Month'],['3month','Last 3 Months'],['all','All Time']];
  html+=`<div class="btn-group" style="margin-bottom:6px">`;
  row1.forEach(([key,label])=>{ html+=`<button class="opt-btn growth-rpt-period${growthReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div><div class="btn-group" style="margin-bottom:14px">`;
  row2.forEach(([key,label])=>{ html+=`<button class="opt-btn growth-rpt-period${growthReportPeriod===key?' sel':''}" data-period="${key}">${label}</button>`; });
  html+=`</div>`;

  html += sectionLabel(`CONSISTENCY — ${pLabel}`,'var(--growth)');
  if(N===0){
    html += `<div class="card" style="color:var(--mute);font-size:12px;text-align:center;padding:20px">No Growth data logged for this period</div>`;
  } else {
    html += `<div class="card" style="padding:12px 14px">`;
    html += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--sep-alt)">`;
    html += ringSvg(periodAvg,'var(--growth)',periodAvg+'%',72);
    html += `<div style="flex:1;display:flex;flex-direction:column;gap:8px">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">PERIOD AVG</span><span style="font-family:DM Serif Display,serif;font-size:18px;font-weight:700;color:var(--growth)">${periodAvg}<span style="font-size:10px;color:var(--mute)">%</span></span></div>`;
    html += `<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">BEST STREAK</span><span style="font-family:DM Serif Display,serif;font-size:18px;font-weight:700;color:var(--growth)">${bestStreak}<span style="font-size:10px;color:var(--mute)">d</span></span></div>`;
    html += `<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">ACTIVE DAYS</span><span style="font-family:DM Serif Display,serif;font-size:18px;font-weight:700;color:var(--growth)">${activeDays}<span style="font-size:10px;color:var(--mute)">/${N}</span></span></div>`;
    html += `</div></div>`;
    if(weeks.length>0) html += growthWeekBarsSvg(weeks, weekMap);
    html += `</div>`;
  }

  // ── PHASE 2: REPS AVERAGES + CHECKS HIT RATE ──
  if(N>0){
    // Split records by format
    const newRecs = periodRecs.filter(r=>r.growth&&(r.growth.reps||r.growth.checks));
    const oldRecs = periodRecs.filter(r=>r.growth&&!r.growth.reps&&!r.growth.checks);

    if(newRecs.length>0){
      // Reps: avg count per key
      html += sectionLabel(`AFFIRMATIONS AVG — ${pLabel}`,'var(--growth)');
      html += `<div class="card" style="padding:10px 14px">`;
      GR_REPS_KEYS.forEach((k,i)=>{
        const avg=newRecs.reduce((s,r)=>s+((r.growth.reps&&r.growth.reps[k])||0),0)/newRecs.length;
        const pct=Math.min(avg/GR_REPS_TARGET,1);
        html += `<div style="margin-bottom:${i<GR_REPS_KEYS.length-1?10:0}px">`;
        html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">${GR_REPS_LABELS[k]}</span><span style="font-family:var(--mono);font-size:9px;color:var(--growth)">${avg.toFixed(1)}</span></div>`;
        html += `<div style="height:4px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${Math.round(pct*100)}%;background:var(--growth);border-radius:2px"></div></div>`;
        html += `</div>`;
      });
      html += `</div>`;

      // Checks: hit rate per key
      html += sectionLabel(`CHECKS HIT RATE — ${pLabel}`,'var(--growth)');
      html += `<div class="card" style="padding:10px 14px">`;
      GR_CHK_KEYS.forEach((k,i)=>{
        const hits=newRecs.filter(r=>r.growth.checks&&r.growth.checks[k]==='yes').length;
        const rate=Math.round(hits/newRecs.length*100);
        html += `<div style="margin-bottom:${i<GR_CHK_KEYS.length-1?10:0}px">`;
        html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">${GR_CHK_LABELS[k]}</span><span style="font-family:var(--mono);font-size:9px;color:var(--growth)">${rate}%</span></div>`;
        html += `<div style="height:4px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${rate}%;background:var(--growth);border-radius:2px"></div></div>`;
        html += `</div>`;
      });
      html += `</div>`;
    }

    if(oldRecs.length>0){
      // Legacy: 8-group bars
      const grpDefs=[
        ['PRESENCE & SOCIAL',['eyecontact','posture','spokefirst','heldsilence','stayedconvo','approached','smiledstranger','heldground','normshrink','frame']],
        ['EMOTIONAL CONTROL',['noticedreaction','pausedbefore','nameemotion','impulse','letgo','calmunder','notpersonal','satwith']],
        ['COURAGE & INITIATIVE',['fear','initiated','askedwanted','tookrisk','hardercall','saidyes','confronted']],
        ['BOUNDARIES & DIRECT',['setboundary','saidno','words','toldtruth','askedneeded','endedit']],
        ['DISCIPLINE',['keptcommit','finishedit','nodistract','stucktoplan','didthing','delayedgrat','showedup','strictself']],
        ['RELATIONSHIPS',['reachedout','listening','appreciated','repaired','fullattention','checkedin']],
        ['MIND & REFLECTION',['learned','reflectedmistake','hardquestion','changedmind','tookfeedback','rehearsal']],
        ['LEADERSHIP',['tookrespons','madedecision','spokegroup','tooklead','delegated','protectedtime']]
      ];
      html += sectionLabel(`GROUPS (legacy) — ${pLabel}`,'var(--growth)');
      html += `<div class="card" style="padding:10px 14px">`;
      grpDefs.forEach(([grpName,keys],gi)=>{
        let hits=0;
        oldRecs.forEach(r=>{ keys.forEach(k=>{ if(r.growth[k]) hits++; }); });
        const rate=Math.round(hits/(keys.length*oldRecs.length)*100);
        html += `<div style="margin-bottom:${gi<grpDefs.length-1?10:0}px">`;
        html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-family:var(--mono);font-size:8px;color:var(--mute)">${grpName}</span><span style="font-family:var(--mono);font-size:9px;color:var(--growth)">${rate}%</span></div>`;
        html += `<div style="height:4px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${rate}%;background:var(--growth);border-radius:2px"></div></div>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
  }

  // ── MOOD & ENERGY TREND ──
  const moodDays=periodDates.map(ds=>{
    const rec=all[ds];
    if(!rec||!rec.mood||!rec.mood.entries||!rec.mood.entries.length) return null;
    const ents=rec.mood.entries;
    const avgMood=Math.round(ents.reduce((a,e)=>a+(e.moodScore||0),0)/ents.length*10)/10;
    const avgEnergy=Math.round(ents.reduce((a,e)=>a+(e.energyScore||0),0)/ents.length*10)/10;
    return {ds,avgMood,avgEnergy};
  }).filter(Boolean);
  if(moodDays.length>0){
    const avgM=Math.round(moodDays.reduce((a,m)=>a+m.avgMood,0)/moodDays.length*10)/10;
    const avgE=Math.round(moodDays.reduce((a,m)=>a+m.avgEnergy,0)/moodDays.length*10)/10;
    html += sectionLabel(`MOOD & ENERGY — ${pLabel}`,'var(--growth)');
    html += `<div class="card" style="padding:12px 14px">`;
    html += `<div style="display:flex;gap:12px;margin-bottom:${moodDays.length>1?14:0}px">`;
    html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:4px">AVG MOOD</div><div style="font-family:DM Serif Display,serif;font-size:22px;font-weight:700;color:var(--growth)">${avgM}</div></div>`;
    html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:4px">AVG ENERGY</div><div style="font-family:DM Serif Display,serif;font-size:22px;font-weight:700;color:var(--finance)">${avgE}</div></div>`;
    html += `</div>`;
    if(moodDays.length>1) html += moodEnergyTrendSvg(moodDays);
    html += `</div>`;
  }

  // ── READING SUMMARY ──
  {
    const allBooks=DB.books();
    let rdSessions=[];
    periodRecs.forEach(r=>{ (r.reading&&r.reading.sessions?r.reading.sessions:[]).forEach(s=>rdSessions.push(s)); });
    const rdTotalSess=rdSessions.length;
    const rdTotalMins=rdSessions.reduce((a,s)=>a+(s.minutes||0),0);
    const rdTotalPages=rdSessions.reduce((a,s)=>a+(s.pages||0),0);
    const rdDates=periodDates, rdMinsArr=periodDates.map(ds=>{ const r=all[ds]; return r&&r.reading?(r.reading.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0):0; });
    const rdActiveDays=rdMinsArr.filter(m=>m>0).length;
    if(rdTotalSess>0||allBooks.length>0){
      html += sectionLabel(`READING — ${pLabel}`,'var(--growth)');
      if(rdTotalSess>0){
        html += `<div class="card" style="padding:12px 14px">`;
        html += `<div style="display:flex;gap:8px;margin-bottom:${rdActiveDays>1?14:0}px">`;
        html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">SESSIONS</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${rdTotalSess}</div></div>`;
        html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">MINUTES</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${rdTotalMins}</div></div>`;
        if(rdTotalPages>0) html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">PAGES</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${rdTotalPages}</div></div>`;
        html += `</div>`;
        if(rdActiveDays>1) html += dailyMinsBarSvg(rdDates, rdMinsArr,'var(--growth)');
        html += `</div>`;
      }
      const rdBooks=allBooks.filter(b=>b.status==='reading');
      const plannedBooks=allBooks.filter(b=>b.status==='planned');
      const doneBooks=allBooks.filter(b=>b.status==='done');
      const abandonedBooks=allBooks.filter(b=>b.status==='abandoned');
      if(allBooks.length>0){
        html += `<div class="card" style="padding:10px 14px">`;
        html += `<div style="font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:0.05em;margin-bottom:${rdBooks.length?8:4}px">BOOKS PIPELINE <span style="font-size:7px;opacity:0.5">(all-time — no finish date recorded)</span></div>`;
        rdBooks.forEach(b=>{
          html += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:11px;color:var(--text)">${b.title}</span><span style="font-family:var(--mono);font-size:9px;color:var(--growth)">${b.progress}%</span></div>`;
          html += `<div style="height:3px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${b.progress}%;background:var(--growth);border-radius:2px"></div></div></div>`;
        });
        const pMeta=[];
        if(plannedBooks.length) pMeta.push(plannedBooks.length+' planned');
        if(doneBooks.length) pMeta.push(doneBooks.length+' finished');
        if(abandonedBooks.length) pMeta.push(abandonedBooks.length+' abandoned');
        if(pMeta.length) html += `<div style="font-size:10px;color:var(--mute);margin-top:${rdBooks.length?2:0}px">${pMeta.join(' · ')}</div>`;
        html += `</div>`;
      }
    }
  }

  // ── MEDITATION SUMMARY ──
  {
    const MT_TYPE_LABELS={breathing:'Breathing',bodyscan:'Body scan',mantra:'Mantra',guided:'Guided',silent:'Silent'};
    let mtSessions=[],mtTypeCounts={};
    periodRecs.forEach(r=>{ (r.meditation&&r.meditation.sessions?r.meditation.sessions:[]).forEach(s=>{ mtSessions.push(s); if(s.type) mtTypeCounts[s.type]=(mtTypeCounts[s.type]||0)+1; }); });
    const mtTotalSess=mtSessions.length;
    const mtTotalMins=mtSessions.reduce((a,s)=>a+(s.minutes||0),0);
    const mtAvgMins=mtTotalSess>0?Math.round(mtTotalMins/mtTotalSess):0;
    const mtDates=periodDates, mtMinsArr=periodDates.map(ds=>{ const r=all[ds]; return r&&r.meditation?(r.meditation.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0):0; });
    const mtActiveDays=mtMinsArr.filter(m=>m>0).length;
    const typeKeys=Object.keys(mtTypeCounts).sort((a,b)=>mtTypeCounts[b]-mtTypeCounts[a]);
    if(mtTotalSess>0){
      html += sectionLabel(`MEDITATION — ${pLabel}`,'var(--growth)');
      html += `<div class="card" style="padding:12px 14px">`;
      html += `<div style="display:flex;gap:8px;margin-bottom:${typeKeys.length>0||mtActiveDays>1?12:0}px">`;
      html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">SESSIONS</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${mtTotalSess}</div></div>`;
      html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">MINUTES</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${mtTotalMins}</div></div>`;
      html += `<div style="flex:1;text-align:center"><div style="font-family:var(--mono);font-size:7px;color:var(--mute);margin-bottom:3px">AVG / SESSION</div><div style="font-family:DM Serif Display,serif;font-size:20px;font-weight:700;color:var(--growth)">${mtAvgMins}<span style="font-size:10px;color:var(--mute)">m</span></div></div>`;
      html += `</div>`;
      if(typeKeys.length>0){
        html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${mtActiveDays>1?12:0}px">`;
        typeKeys.forEach(t=>{ html += `<span style="font-family:var(--mono);font-size:9px;padding:3px 8px;border:1px solid var(--growth);border-radius:20px;color:var(--growth)">${MT_TYPE_LABELS[t]||t} <span style="opacity:0.6">${mtTypeCounts[t]}×</span></span>`; });
        html += `</div>`;
      }
      if(mtActiveDays>1) html += dailyMinsBarSvg(mtDates, mtMinsArr,'var(--growth)');
      html += `</div>`;
    }
  }

  s.innerHTML = html;

  s.querySelector('#growth-report-back').addEventListener('click',()=>{
    growthReportOpen=false;
    renderGrowth();
  });
  s.querySelectorAll('.growth-rpt-period').forEach(btn=>{
    btn.addEventListener('click',()=>{
      growthReportPeriod=btn.dataset.period;
      renderGrowthReport(s);
    });
  });
}

/* ============ GROWTH ============ */
function renderGrowth(){
  const s = document.getElementById('s-growth');
  if(growthReportOpen){ renderGrowthReport(s); return; }
  const g = day.growth;
  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">`+
    `<button class="btn-ghost" id="open-growth-report" style="border-color:var(--growth);color:var(--growth);padding:6px 14px;font-size:12px">Report →</button>`+
    `</div>`;
  html += compareDayHtml('growth','var(--growth)');

  // ── MOOD & ENERGY ──
  if(!day.mood) day.mood = {entries:[]};
  const mo = day.mood;
  const moEntries = mo.entries || [];
  const MOOD_OPTS = [null,{n:1,emoji:'😞',word:'Awful'},{n:2,emoji:'😔',word:'Rough'},{n:3,emoji:'😕',word:'Off'},{n:4,emoji:'😐',word:'Meh'},{n:5,emoji:'🙂',word:'Okay'},{n:6,emoji:'😊',word:'Good'},{n:7,emoji:'😄',word:'Great'},{n:8,emoji:'🤗',word:'Really good'},{n:9,emoji:'🥳',word:'Amazing'},{n:10,emoji:'🤩',word:'Best day'}];
  const ENERGY_OPTS = [null,{n:1,emoji:'🪫',word:'Empty'},{n:2,emoji:'😴',word:'Exhausted'},{n:3,emoji:'🥱',word:'Drained'},{n:4,emoji:'😑',word:'Low'},{n:5,emoji:'😌',word:'Steady'},{n:6,emoji:'🙂',word:'Decent'},{n:7,emoji:'💪',word:'Strong'},{n:8,emoji:'⚡',word:'Energized'},{n:9,emoji:'🔥',word:'Charged'},{n:10,emoji:'🚀',word:'Unstoppable'}];
  html += sectionLabel('MOOD & ENERGY', 'var(--growth)');
  html += '<div class="card">';
  html += '<div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:8px">CHECK-INS TODAY</div>';
  if(moEntries.length){
    moEntries.forEach((me,mei)=>{
      const moo = me.moodScore ? MOOD_OPTS[me.moodScore] : null;
      const ene = me.energyScore ? ENERGY_OPTS[me.energyScore] : null;
      const moodStr = moo ? moo.emoji+' '+moo.n+' — '+moo.word : '—';
      const energyStr = ene ? ene.emoji+' '+ene.n+' — '+ene.word : '—';
      html += '<div class="checkline" style="align-items:flex-start;gap:8px;padding:6px 0">'
        +'<div style="flex:1"><div style="font-size:12px;color:var(--text)">'+moodStr+' · '+energyStr+'</div>'
        +(me.note?'<div style="font-size:10px;color:var(--mute);margin-top:2px">"'+me.note+'"</div>':'')
        +'</div>'
        +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'
        +'<span style="font-family:var(--mono);font-size:10px;color:var(--mute)">'+me.loggedAt+'</span>'
        +'<button data-del-moentry="'+mei+'" style="background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;padding:0;line-height:1">×</button>'
        +'</div>'
        +'</div>';
    });
  } else {
    html += '<div style="font-size:11px;color:var(--mute);margin-bottom:6px">No check-ins yet today.</div>';
  }
  html += '<button class="btn-ghost" id="add-mood-btn" style="border-color:var(--growth);color:var(--growth);width:100%;margin-top:2px">+ Add check-in</button>';
  if(moodDraftActive){
    html += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">MOOD</label>';
    html += '<div style="margin-top:6px">';
    for(let i=1;i<=10;i++){
      const mo_o=MOOD_OPTS[i]; const mo_sel=moodDraft.moodScore===i;
      html += '<button data-mood-score="'+i+'" style="display:flex;align-items:center;width:100%;padding:8px 10px;background:'+(mo_sel?'rgba(61,220,151,0.08)':'transparent')+';border:1px solid '+(mo_sel?'var(--growth)':'var(--border)')+';border-radius:10px;margin-bottom:4px;cursor:pointer;gap:10px;text-align:left"><span style="font-size:16px">'+mo_o.emoji+'</span><span style="font-family:var(--mono);font-size:11px;color:var(--mute);min-width:16px">'+mo_o.n+'</span><span style="font-size:12px;color:'+(mo_sel?'var(--growth)':'var(--text)')+'">'+mo_o.word+'</span></button>';
    }
    html += '</div>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:10px;display:block">ENERGY</label>';
    html += '<div style="margin-top:6px">';
    for(let i=1;i<=10;i++){
      const en_o=ENERGY_OPTS[i]; const en_sel=moodDraft.energyScore===i;
      html += '<button data-energy-score="'+i+'" style="display:flex;align-items:center;width:100%;padding:8px 10px;background:'+(en_sel?'rgba(61,220,151,0.08)':'transparent')+';border:1px solid '+(en_sel?'var(--growth)':'var(--border)')+';border-radius:10px;margin-bottom:4px;cursor:pointer;gap:10px;text-align:left"><span style="font-size:16px">'+en_o.emoji+'</span><span style="font-family:var(--mono);font-size:11px;color:var(--mute);min-width:16px">'+en_o.n+'</span><span style="font-size:12px;color:'+(en_sel?'var(--growth)':'var(--text)')+'">'+en_o.word+'</span></button>';
    }
    html += '</div>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">NOTE (OPTIONAL)</label>';
    html += '<textarea class="input textarea" id="mood-draft-note" placeholder="How are you feeling?">'+(moodDraft.note||'')+'</textarea>';
    html += '<div style="display:flex;gap:8px;margin-top:12px">'
      +'<button class="btn-cancel" id="mood-draft-cancel" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Cancel</button>'
      +'<button class="btn-primary" id="mood-draft-save" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Save</button>'
      +'</div>';
    html += '</div>';
  }
  html += '</div>';

  // ── SECTION 1: AFFIRMATIONS (REPS) ──
  const reps = (g.reps||{});
  const chks = (g.checks||{});
  const totalRepPts = GR_REPS_KEYS.reduce((s,k)=>s+Math.min((reps[k]||0)/GR_REPS_TARGET,1),0);
  const repPct = Math.round(totalRepPts/GR_REPS_KEYS.length*100);
  html += sectionLabel('AFFIRMATIONS (REPS)', 'var(--growth)');
  html += '<div class="card" style="padding:10px 14px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'
    +'<span style="font-family:var(--mono);font-size:8px;color:var(--mute)">TARGET: '+GR_REPS_TARGET+' EACH</span>'
    +'<span style="font-family:var(--mono);font-size:9px;color:var(--growth)">'+repPct+'%</span>'
    +'</div>';
  GR_REPS_KEYS.forEach((k,i)=>{
    const cnt = reps[k]||0;
    const pct = Math.min(cnt/GR_REPS_TARGET,1);
    html += '<div style="margin-bottom:'+(i<GR_REPS_KEYS.length-1?12:0)+'px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      +'<span style="font-size:12px;color:var(--text)">'+GR_REPS_LABELS[k]+'</span>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<button data-rep-key="'+k+'" data-rep-delta="-1" style="background:none;border:1px solid var(--border);border-radius:50%;width:26px;height:26px;color:var(--mute);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">−</button>'
      +'<span style="font-family:var(--mono);font-size:13px;color:var(--growth);min-width:24px;text-align:center">'+cnt+'</span>'
      +'<button data-rep-key="'+k+'" data-rep-delta="1" style="background:none;border:1px solid var(--growth);border-radius:50%;width:26px;height:26px;color:var(--growth);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">+</button>'
      +'</div></div>';
    html += '<div style="height:4px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+Math.round(pct*100)+'%;background:var(--growth);border-radius:2px;transition:width 0.2s"></div></div>';
    html += '</div>';
  });
  html += '</div>';

  // ── SECTION 2: SITUATIONAL CHECKS ──
  const totalChkHits = GR_CHK_KEYS.filter(k=>chks[k]==='yes').length;
  html += sectionLabel('SITUATIONAL CHECKS', 'var(--growth)');
  html += '<div class="card" style="padding:10px 14px">';
  html += '<div style="text-align:right;font-family:var(--mono);font-size:9px;color:var(--mute);margin-bottom:8px"><span style="color:var(--growth)">'+totalChkHits+'</span>/'+GR_CHK_KEYS.length+'</div>';
  GR_CHK_KEYS.forEach((k,i)=>{
    const val = chks[k]||null;
    const yesActive = val==='yes', noActive = val==='no';
    html += '<div style="margin-bottom:'+(i<GR_CHK_KEYS.length-1?12:0)+'px">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(yesActive?6:0)+'px">'
      +'<span style="font-size:12px;color:var(--text);flex:1">'+GR_CHK_LABELS[k]+'</span>'
      +'<button data-chk-key="'+k+'" data-chk-val="yes" style="padding:4px 12px;border-radius:12px;font-size:11px;font-family:var(--mono);border:1px solid '+(yesActive?'var(--growth)':'var(--border)')+';background:'+(yesActive?'rgba(61,220,151,0.12)':'transparent')+';color:'+(yesActive?'var(--growth)':'var(--mute)')+';cursor:pointer">YES</button>'
      +'<button data-chk-key="'+k+'" data-chk-val="no" style="padding:4px 12px;border-radius:12px;font-size:11px;font-family:var(--mono);border:1px solid '+(noActive?'var(--red)':'var(--border)')+';background:'+(noActive?'rgba(255,80,80,0.10)':'transparent')+';color:'+(noActive?'var(--red)':'var(--mute)')+';cursor:pointer">NO</button>'
      +'</div>';
    if(yesActive){
      html += '<textarea class="input textarea" data-chk-note="'+k+'" placeholder="Optional note..." style="font-size:11px;padding:6px 8px;min-height:44px;resize:vertical">'+(chks[k+'_note']||'')+'</textarea>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ── READING ──
  if(!day.reading) day.reading = {sessions:[], notes:''};
  const rd = day.reading;
  const rdSess = rd.sessions || [];
  const allBooks = DB.books();
  const readingBooks = allBooks.filter(b=>b.status==='reading');
  const plannedBooks = allBooks.filter(b=>b.status==='planned');
  const doneBooks = allBooks.filter(b=>b.status==='done');
  const abandonedBooks = allBooks.filter(b=>b.status==='abandoned');
  const habitSatisfied = rdSess.length > 0;

  html += sectionLabel('READING', 'var(--growth)');

  // Derived habit indicator (read-only, non-tappable)
  html += '<div class="card" style="padding:10px 14px">';
  if(habitSatisfied){
    html += '<div class="checkline"><span style="color:var(--green);font-size:15px">✓</span><span style="color:var(--growth)">Reading habit satisfied</span><span style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:auto">auto</span></div>';
  } else {
    html += '<div class="checkline"><span class="box" style="color:var(--mute)">&#9633;</span><span style="color:var(--mute)">No reading session logged yet</span><span style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:auto">auto</span></div>';
  }
  html += '</div>';

  // Book list
  html += '<div class="card">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<span style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px">BOOKS</span>'
    +'<button class="btn-ghost" id="add-book-btn" style="border-color:var(--growth);color:var(--growth);padding:4px 10px;font-size:11px">+ Add book</button>'
    +'</div>';
  if(readingBooks.length){
    readingBooks.forEach(b=>{
      html += '<div class="checkline" style="display:block;padding:6px 0;border-bottom:1px solid var(--sep-alt)" data-book="'+b.id+'">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline">'
        +'<span style="font-size:12px;font-weight:600;color:var(--text)">'+b.title+'</span>'
        +'<span style="font-family:var(--mono);font-size:9px;color:var(--growth)">'+b.progress+'%</span>'
        +'</div>';
      if(b.author) html += '<div style="font-size:10px;color:var(--mute);margin-top:1px">'+b.author+'</div>';
      html += '<div class="bar-track" style="margin-top:5px"><div class="bar-fill" style="width:'+b.progress+'%;background:var(--growth)"></div></div>';
      html += '</div>';
    });
  }
  if(plannedBooks.length){
    plannedBooks.forEach(b=>{
      html += '<div class="checkline" style="padding:5px 0;border-bottom:1px solid var(--sep-alt)" data-book="'+b.id+'">'
        +'<span class="box">&#9633;</span>'
        +'<span style="font-size:12px;color:var(--text)">'+b.title+'</span>'
        +(b.author?'<span style="font-size:10px;color:var(--mute);margin-left:4px">· '+b.author+'</span>':'')
        +'</div>';
    });
  }
  if(!readingBooks.length && !plannedBooks.length){
    html += '<div style="font-size:11px;color:var(--mute);padding:4px 0">No books added yet.</div>';
  }
  if(doneBooks.length) html += '<div style="font-size:10px;color:var(--mute);padding:5px 0 2px">'+doneBooks.length+' finished · '+(abandonedBooks.length)+' abandoned</div>';
  else if(abandonedBooks.length) html += '<div style="font-size:10px;color:var(--mute);padding:5px 0 2px">'+abandonedBooks.length+' abandoned</div>';
  html += '</div>';

  // Today's sessions
  html += '<div class="card">';
  html += '<div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:8px">TODAY\'S SESSIONS</div>';
  if(rdSess.length){
    rdSess.forEach((rs,rsi)=>{
      const bookName = rs.bookId ? (allBooks.find(b=>b.id===rs.bookId)||{}).title||rs.bookId : '—';
      const meta=[];
      if(rs.minutes!=null && rs.minutes>0) meta.push(rs.minutes+' min');
      if(rs.pages!=null && rs.pages>0) meta.push(rs.pages+' pages');
      if(rs.startTime&&rs.endTime) meta.push(rs.startTime+' → '+rs.endTime);
      html += '<div class="checkline" style="align-items:flex-start;gap:8px;padding:6px 0">'
        +'<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">'+bookName+'</div>'
        +(meta.length?'<div style="font-size:10px;color:var(--mute);margin-top:2px">'+meta.join(' · ')+'</div>':'')
        +'</div>'
        +'<button data-del-rsess="'+rsi+'" style="background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;padding:0;line-height:1">×</button>'
        +'</div>';
    });
  } else {
    html += '<div style="font-size:11px;color:var(--mute);margin-bottom:6px">No sessions logged yet today.</div>';
  }
  html += '<button class="btn-ghost" id="add-reading-session-btn" style="border-color:var(--growth);color:var(--growth);width:100%;margin-top:2px">+ Add session</button>';
  if(readingDraftActive){
    const rdDrvMins=(readingDraft.startTime&&readingDraft.endTime)?deriveMinutes(readingDraft.startTime,readingDraft.endTime):null;
    const rdShowMins=(readingDraft.minutesSource==='manual'&&readingDraft.minutes!=null)?readingDraft.minutes:(rdDrvMins!=null?rdDrvMins:(readingDraft.minutes!=null?readingDraft.minutes:''));
    html += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">BOOK</label>';
    html += '<select class="input" id="rd-book-select"><option value="">Select (optional)</option>';
    [...readingBooks,...plannedBooks].forEach(b=>{ html += '<option value="'+b.id+'" '+(readingDraft.bookId===b.id?'selected':'')+'>'+b.title+(b.author?' — '+b.author:'')+'</option>'; });
    html += '</select>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">TIME (OPTIONAL)</label>';
    html += '<div style="display:flex;gap:8px;margin-top:4px">'
      +'<button class="btn-ghost" id="rd-draft-start" style="flex:1;font-family:var(--mono);font-size:12px;padding:8px">Start: '+(readingDraft.startTime||'--:--')+'</button>'
      +'<button class="btn-ghost" id="rd-draft-end" style="flex:1;font-family:var(--mono);font-size:12px;padding:8px">End: '+(readingDraft.endTime||'--:--')+'</button>'
      +'</div>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">DURATION (MINUTES)</label>';
    html += '<input type="number" class="input" id="rd-draft-mins" value="'+rdShowMins+'" placeholder="How long" min="0">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">PAGES READ (OPTIONAL)</label>';
    html += '<input type="number" class="input" id="rd-draft-pages" value="'+(readingDraft.pages!=null?readingDraft.pages:'')+'" placeholder="How many pages" min="0">';
    html += '<div style="display:flex;gap:8px;margin-top:12px">'
      +'<button class="btn-cancel" id="rd-draft-cancel" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Cancel</button>'
      +'<button class="btn-primary" id="rd-draft-save" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Save</button>'
      +'</div>';
    html += '</div>';
  }
  html += '</div>';

  // ── MEDITATION ──
  if(!day.meditation) day.meditation = {sessions:[], notes:''};
  const mt = day.meditation;
  const mtSess = mt.sessions || [];
  const mtHabitSatisfied = mtSess.length > 0;
  const MT_TYPE_LABELS = {breathing:'Breathing',bodyscan:'Body scan',mantra:'Mantra',guided:'Guided',silent:'Silent'};

  html += sectionLabel('MEDITATION', 'var(--growth)');
  html += '<div class="card" style="padding:10px 14px">';
  if(mtHabitSatisfied){
    html += '<div class="checkline"><span style="color:var(--green);font-size:15px">✓</span><span style="color:var(--growth)">Meditation habit satisfied</span><span style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:auto">auto</span></div>';
  } else {
    html += '<div class="checkline"><span class="box" style="color:var(--mute)">&#9633;</span><span style="color:var(--mute)">No meditation session logged yet</span><span style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:auto">auto</span></div>';
  }
  html += '</div>';
  html += '<div class="card">';
  html += '<div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:8px">TODAY\'S SESSIONS</div>';
  if(mtSess.length){
    mtSess.forEach((ms,msi)=>{
      const mmeta=[];
      if(ms.minutes!=null&&ms.minutes>0) mmeta.push(ms.minutes+' min');
      html += '<div class="checkline" style="align-items:flex-start;gap:8px;padding:6px 0">'
        +'<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">'+(ms.type?(MT_TYPE_LABELS[ms.type]||ms.type):'Session')+'</div>'
        +(mmeta.length||ms.note?'<div style="font-size:10px;color:var(--mute);margin-top:2px">'+mmeta.join(' · ')+(ms.note?(mmeta.length?' · ':'')+'"'+ms.note+'"':'')+'</div>':'')
        +'</div>'
        +'<button data-del-msess="'+msi+'" style="background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;padding:0;line-height:1">×</button>'
        +'</div>';
    });
  } else {
    html += '<div style="font-size:11px;color:var(--mute);margin-bottom:6px">No sessions logged yet today.</div>';
  }
  html += '<button class="btn-ghost" id="add-meditation-session-btn" style="border-color:var(--growth);color:var(--growth);width:100%;margin-top:2px">+ Add session</button>';
  if(meditationDraftActive){
    const MT_TYPES=[['breathing','Breathing'],['bodyscan','Body scan'],['mantra','Mantra'],['guided','Guided'],['silent','Silent']];
    html += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute)">TYPE</label>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">';
    MT_TYPES.forEach(([val,lbl])=>{
      const msel=meditationDraft.type===val;
      html += '<button class="opt-btn mt-type-btn'+(msel?' sel':'')+'" data-mt-type="'+val+'" style="flex:unset;min-width:0;padding:5px 12px'+(msel?';border-color:var(--growth)':'')+'">'+'<span style="font-size:11px">'+lbl+'</span></button>';
    });
    html += '</div>';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">DURATION (MINUTES)</label>';
    html += '<input type="number" class="input" id="mt-draft-mins" value="'+(meditationDraft.minutes!=null?meditationDraft.minutes:'')+'" placeholder="How long" min="0">';
    html += '<label style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px;display:block">NOTE (OPTIONAL)</label>';
    html += '<textarea class="input textarea" id="mt-draft-note" placeholder="How was the session?">'+(meditationDraft.note||'')+'</textarea>';
    html += '<div style="display:flex;gap:8px;margin-top:12px">'
      +'<button class="btn-cancel" id="mt-draft-cancel" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Cancel</button>'
      +'<button class="btn-primary" id="mt-draft-save" style="flex:1;padding:10px;border-radius:16px;font-family:var(--sans);font-weight:700;font-size:13px">Save</button>'
      +'</div>';
    html += '</div>';
  }
  html += '</div>';

  html += sectionLabel('NOTES', 'var(--growth)');
  html += '<div class="card">'+'<textarea class="input textarea" id="growth-notes" placeholder="Notes for today">'+(g.notes||'')+'</textarea></div>';
  html += sectionLabel('MONTH TO DATE');
  const avg = monthAvg(growthScore, EDIT_DATE.slice(0,7));
  html += '<div class="card">'+progressRow('Growth consistency', avg, avg+'%', 'var(--growth)')+'</div>';

  const growthPrevAvg = monthAvg(growthScore, prevMonthPrefix());
  html += sectionLabel('THIS MONTH VS LAST MONTH','var(--growth)');
  html += '<div class="card">'+momCompareHtml(avg, growthPrevAvg, 'var(--growth)')+'</div>';

  html += '<button class="save-btn" id="save-growth">'+saveBtnLabel()+'</button>';
  s.innerHTML = html;
  wireCmpArrows(s, 'growth', renderGrowth);

  s.querySelectorAll('[data-yn-key]').forEach(p=>{
    p.addEventListener('click', ()=>{ g[p.dataset.ynKey] = p.dataset.ynVal==='yes'; renderGrowth(); });
  });

  // Rep counter buttons
  s.querySelectorAll('[data-rep-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!g.reps) g.reps = {};
      const k = btn.dataset.repKey;
      const delta = parseInt(btn.dataset.repDelta);
      g.reps[k] = Math.max(0, (g.reps[k]||0) + delta);
      renderGrowth();
    });
  });

  // Check yes/no buttons
  s.querySelectorAll('[data-chk-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!g.checks) g.checks = {};
      const k = btn.dataset.chkKey;
      const val = btn.dataset.chkVal;
      // Toggle off if already selected
      g.checks[k] = (g.checks[k]===val) ? null : val;
      renderGrowth();
    });
  });

  // Book tap → update modal
  s.querySelectorAll('[data-book]').forEach(card=>{
    card.addEventListener('click', ()=> openUpdateBookModal(card.dataset.book));
  });
  document.getElementById('add-book-btn').addEventListener('click', openAddBookModal);

  // Delete reading session
  s.querySelectorAll('[data-del-rsess]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      rdSess.splice(parseInt(btn.dataset.delRsess), 1);
      renderGrowth();
    });
  });

  // Add reading session
  const addRSessBtn = document.getElementById('add-reading-session-btn');
  if(addRSessBtn) addRSessBtn.addEventListener('click', ()=>{
    readingDraftActive = true;
    readingDraft = {bookId:'', startTime:null, endTime:null, minutes:null, pages:null, minutesSource:'unset'};
    renderGrowth();
  });

  if(readingDraftActive){
    const syncRdDraft = ()=>{
      const bkEl = document.getElementById('rd-book-select');
      if(bkEl) readingDraft.bookId = bkEl.value || null;
      const mEl = document.getElementById('rd-draft-mins');
      if(mEl && mEl.value!==''){readingDraft.minutes=parseInt(mEl.value)||0; readingDraft.minutesSource='manual';}
      const pEl = document.getElementById('rd-draft-pages');
      if(pEl && pEl.value!=='') readingDraft.pages = parseInt(pEl.value)||0;
    };
    const rdStartBtn = document.getElementById('rd-draft-start');
    if(rdStartBtn) rdStartBtn.addEventListener('click', ()=>{
      syncRdDraft();
      openTimePickerModal('Start time', readingDraft.startTime||'07:00', v=>{
        readingDraft.startTime = v;
        if(readingDraft.startTime&&readingDraft.endTime&&readingDraft.minutesSource!=='manual'){
          readingDraft.minutes = deriveMinutes(readingDraft.startTime, readingDraft.endTime);
        }
        renderGrowth();
      });
    });
    const rdEndBtn = document.getElementById('rd-draft-end');
    if(rdEndBtn) rdEndBtn.addEventListener('click', ()=>{
      syncRdDraft();
      openTimePickerModal('End time', readingDraft.endTime||'09:00', v=>{
        readingDraft.endTime = v;
        if(readingDraft.startTime&&readingDraft.endTime&&readingDraft.minutesSource!=='manual'){
          readingDraft.minutes = deriveMinutes(readingDraft.startTime, readingDraft.endTime);
        }
        renderGrowth();
      });
    });
    const rdMinsEl = document.getElementById('rd-draft-mins');
    if(rdMinsEl) rdMinsEl.addEventListener('input', ()=>{
      readingDraft.minutesSource = 'manual';
      readingDraft.minutes = rdMinsEl.value!=='' ? parseInt(rdMinsEl.value) : null;
    });
    const rdCancelBtn = document.getElementById('rd-draft-cancel');
    if(rdCancelBtn) rdCancelBtn.addEventListener('click', ()=>{ readingDraftActive=false; renderGrowth(); });
    const rdSaveBtn = document.getElementById('rd-draft-save');
    if(rdSaveBtn) rdSaveBtn.addEventListener('click', ()=>{
      syncRdDraft();
      const mEl = document.getElementById('rd-draft-mins');
      if(mEl && mEl.value!==''){
        const typed = parseInt(mEl.value)||0;
        readingDraft.minutes = typed;
        if(readingDraft.startTime && readingDraft.endTime){
          readingDraft.minutesSource = (typed !== deriveMinutes(readingDraft.startTime, readingDraft.endTime)) ? 'manual' : 'derived';
        } else { readingDraft.minutesSource = 'manual'; }
      } else if(readingDraft.startTime && readingDraft.endTime){
        readingDraft.minutes = deriveMinutes(readingDraft.startTime, readingDraft.endTime);
        readingDraft.minutesSource = 'derived';
      }
      const pEl = document.getElementById('rd-draft-pages');
      if(pEl && pEl.value!=='') readingDraft.pages = parseInt(pEl.value)||null;
      if(!rd.sessions) rd.sessions = [];
      rd.sessions.push({
        bookId: readingDraft.bookId || null,
        minutes: readingDraft.minutes != null ? readingDraft.minutes : 0,
        pages: readingDraft.pages != null ? readingDraft.pages : null,
        startTime: readingDraft.startTime || null,
        endTime: readingDraft.endTime || null,
        minutesSource: readingDraft.minutesSource || 'manual'
      });
      // Stamp lastTouched on the book
      if(readingDraft.bookId){
        const bkList = DB.books();
        const bk = bkList.find(b=>b.id===readingDraft.bookId);
        if(bk){ bk.lastTouched=EDIT_DATE; if(bk.status==='planned'){bk.status='reading';bk.startedAt=bk.startedAt||EDIT_DATE;} DB.saveBooks(bkList); }
      }
      readingDraftActive = false;
      renderGrowth();
    });
  }

  // Delete meditation session
  s.querySelectorAll('[data-del-msess]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mtSess.splice(parseInt(btn.dataset.delMsess), 1);
      renderGrowth();
    });
  });

  // Add meditation session
  const addMSessBtn = document.getElementById('add-meditation-session-btn');
  if(addMSessBtn) addMSessBtn.addEventListener('click', ()=>{
    meditationDraftActive = true;
    meditationDraft = {type:null, minutes:null, note:''};
    renderGrowth();
  });

  if(meditationDraftActive){
    s.querySelectorAll('.mt-type-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        meditationDraft.type = meditationDraft.type===btn.dataset.mtType ? null : btn.dataset.mtType;
        renderGrowth();
      });
    });
    const mtCancelBtn = document.getElementById('mt-draft-cancel');
    if(mtCancelBtn) mtCancelBtn.addEventListener('click', ()=>{ meditationDraftActive=false; renderGrowth(); });
    const mtSaveBtn = document.getElementById('mt-draft-save');
    if(mtSaveBtn) mtSaveBtn.addEventListener('click', ()=>{
      const minsEl=document.getElementById('mt-draft-mins');
      const noteEl=document.getElementById('mt-draft-note');
      const mins=minsEl&&minsEl.value!==''?parseInt(minsEl.value)||0:0;
      const note=noteEl&&noteEl.value.trim()?noteEl.value.trim():null;
      if(!mt.sessions) mt.sessions=[];
      mt.sessions.push({minutes:mins, type:meditationDraft.type||null, note:note});
      meditationDraftActive=false;
      renderGrowth();
    });
  }

  // Delete mood entry
  s.querySelectorAll('[data-del-moentry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      moEntries.splice(parseInt(btn.dataset.delMoentry), 1);
      renderGrowth();
    });
  });

  // Add mood check-in
  const addMoodBtn = document.getElementById('add-mood-btn');
  if(addMoodBtn) addMoodBtn.addEventListener('click', ()=>{
    moodDraftActive = true;
    moodDraft = {moodScore:null, energyScore:null, note:''};
    renderGrowth();
  });

  if(moodDraftActive){
    s.querySelectorAll('[data-mood-score]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const sc = parseInt(btn.dataset.moodScore);
        moodDraft.moodScore = moodDraft.moodScore===sc ? null : sc;
        renderGrowth();
      });
    });
    s.querySelectorAll('[data-energy-score]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const sc = parseInt(btn.dataset.energyScore);
        moodDraft.energyScore = moodDraft.energyScore===sc ? null : sc;
        renderGrowth();
      });
    });
    const moodCancelBtn = document.getElementById('mood-draft-cancel');
    if(moodCancelBtn) moodCancelBtn.addEventListener('click', ()=>{ moodDraftActive=false; renderGrowth(); });
    const moodSaveBtn = document.getElementById('mood-draft-save');
    if(moodSaveBtn) moodSaveBtn.addEventListener('click', ()=>{
      const noteEl = document.getElementById('mood-draft-note');
      const note = noteEl && noteEl.value.trim() ? noteEl.value.trim() : null;
      if(!mo.entries) mo.entries = [];
      mo.entries.push({
        moodScore: moodDraft.moodScore || null,
        energyScore: moodDraft.energyScore || null,
        note: note,
        loggedAt: new Date().toTimeString().slice(0,5)
      });
      moodDraftActive = false;
      renderGrowth();
    });
  }

  document.getElementById('open-growth-report').addEventListener('click',()=>{
    growthReportOpen=true;
    renderGrowth();
  });

  document.getElementById('save-growth').addEventListener('click', ()=>{
    const notesEl=document.getElementById('growth-notes');
    if(notesEl) g.notes=notesEl.value;
    // Persist check notes from visible textareas
    s.querySelectorAll('[data-chk-note]').forEach(ta=>{
      if(!g.checks) g.checks={};
      g.checks[ta.dataset.chkNote+'_note'] = ta.value.trim()||null;
    });
    saveDayNow();
  });
  patchAriaRoles(s);
}

/* ============ REVIEW ============ */
function renderReview(){
  const s = document.getElementById('s-review');
  const all = DB.allDays();

  function getWeekDays(offset){
    const d = new Date(EDIT_DATE);
    const daysSinceMon = (d.getDay()+6)%7;
    d.setDate(d.getDate()-daysSinceMon-offset*7);
    const days = [];
    for(let i=0;i<7;i++){
      const dd = new Date(d); dd.setDate(d.getDate()+i);
      const ds = dd.toISOString().slice(0,10);
      days.push({str:ds, date:dd, rec:all[ds]||null});
    }
    return days;
  }
  function weekAvgScore(offset){
    const wd = getWeekDays(offset).filter(d=>d.rec);
    if(!wd.length) return null;
    return Math.round(wd.reduce((a,d)=>a+dayScore(d.rec),0)/wd.length);
  }

  const wDays = getWeekDays(reviewWeekOffset);
  const wWithData = wDays.filter(d=>d.rec);
  const wStart = wDays[0].date, wEnd = wDays[6].date;
  const rangeLabel = wStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'–'+wEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const wAvg = weekAvgScore(reviewWeekOffset);
  const pwAvg = weekAvgScore(reviewWeekOffset+1);
  const wDelta = (wAvg!==null&&pwAvg!==null) ? wAvg-pwAvg : null;
  const deltaHtml = wDelta===null ? '' :
    wDelta>=0 ? '<span class="delta-pill" style="background:var(--delta-up-bg);color:var(--green)">&#8593; '+wDelta+' vs prior week</span>' :
    '<span class="delta-pill" style="background:var(--delta-dn-bg);color:var(--red)">&#8595; '+Math.abs(wDelta)+' vs prior week</span>';

  const ab = 'font-family:var(--mono);font-size:13px;padding:1px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;';
  const rr = (lbl,val,col)=>'<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--sep-alt);font-size:11px">'+
    '<span style="flex:1;color:var(--mute);font-size:10px">'+lbl+'</span>'+
    '<span style="font-family:var(--mono);color:'+(col||'var(--text)')+'">'+val+'</span></div>';

  let html = '<div class="datebar">REVIEW</div>';

  // ─ Week selector nav (standalone bracket container) ─
  const posLabel = reviewWeekOffset===0?'[ CURRENT WEEK ]':reviewWeekOffset===1?'[ LAST WEEK ]':'[ '+reviewWeekOffset+' WEEKS AGO ]';
  html += '<div class="card">'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button id="rev-back" style="'+ab+'color:var(--text);padding:5px 11px;font-size:15px">&#8592;</button>'
    +'<div style="flex:1;text-align:center">'
    +'<div style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.5px">'+rangeLabel.toUpperCase()+'</div>'
    +'<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-top:3px;letter-spacing:1px">'+posLabel+'</div>'
    +'</div>'
    +'<button id="rev-fwd" style="'+ab+'color:'+(reviewWeekOffset===0?'var(--border)':'var(--text)')+';padding:5px 11px;font-size:15px">&#8594;</button>'
    +'</div>'
    +'</div>';

  // ─ Week score hero card ─
  html += '<div class="card">'
    +'<div style="display:flex;align-items:center;gap:14px">'
    +ringSvg(wAvg||0,'var(--home)',wAvg!==null?wAvg:'--',70)
    +'<div><div style="font-family:var(--mono);font-size:9px;color:var(--mute)">WEEK SCORE</div>'
    +'<div style="margin-top:6px">'+deltaHtml+'</div>'
    +'<div style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px">'+wWithData.length+' of 7 days logged</div></div></div></div>';

  // ─ WEEK OVERVIEW ─
  html += sectionLabel('WEEK OVERVIEW','var(--home)');

  // Radar: per-category averages for current viewed week
  (function(){
    const rCats=[
      {key:'faith',   fn:faithScore  },
      {key:'health',  fn:healthScore },
      {key:'music',   fn:musicScore  },
      {key:'finance', fn:financeScore},
      {key:'growth',  fn:growthScore }
    ];
    const avgs=rCats.map(cat=>{
      const days=wDays.filter(d=>d.rec&&d.rec[cat.key]);
      return days.length?Math.round(days.reduce((a,d)=>a+cat.fn(d.rec),0)/days.length):null;
    });
    html+='<div class="card">'+weekRadarSvg(avgs[0],avgs[1],avgs[2],avgs[3],avgs[4])+'</div>';
  })();

  // 5×7 Weekly Grid
  (function(){
    const CAT_GRID=[
      {label:'FA',key:'faith',   fn:faithScore,   color:'var(--faith)'},
      {label:'HE',key:'health',  fn:healthScore,  color:'var(--health)'},
      {label:'MU',key:'music',   fn:musicScore,   color:'var(--music)'},
      {label:'FI',key:'finance', fn:financeScore, color:'var(--finance)'},
      {label:'GR',key:'growth',  fn:growthScore,  color:'var(--growth)'}
    ];
    let g='<div class="card"><div style="display:grid;grid-template-columns:20px repeat(7,1fr);gap:2px">';
    g+='<div></div>';
    ['M','T','W','T','F','S','S'].forEach(d=>{
      g+='<div style="text-align:center;font-family:var(--mono);font-size:8px;color:var(--mute);padding-bottom:3px">'+d+'</div>';
    });
    CAT_GRID.forEach(cat=>{
      g+='<div style="display:flex;align-items:center;font-family:var(--mono);font-size:7px;font-weight:700;color:'+cat.color+'">'+cat.label+'</div>';
      wDays.forEach(day=>{
        if(!day.rec||!day.rec[cat.key]){
          g+='<div style="height:26px;border-radius:3px;background:var(--track-bg);opacity:0.35"></div>';
        } else {
          const sc=cat.fn(day.rec);
          const isGreen=sc>=50;
          const intensity=isGreen?(sc-50)/50:(50-sc)/50;
          const bgOp=(0.12+intensity*0.38).toFixed(2);
          const bg='rgba('+(isGreen?'61,220,151':'210,45,45')+','+bgOp+')';
          const tc=isGreen?'var(--green)':'rgba(230,85,85,1)';
          g+='<div style="height:26px;border-radius:3px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:'+tc+'">'+sc+'</div>';
        }
      });
    });
    g+='</div></div>';
    html+=g;
  })();

  // 8-week trend-lines
  (function(){
    const WCOUNT=8;
    const trendCats=[
      {key:'faith',   fn:faithScore,   color:'var(--faith)',   label:'Faith'},
      {key:'health',  fn:healthScore,  color:'var(--health)',  label:'Health'},
      {key:'music',   fn:musicScore,   color:'var(--music)',   label:'Music'},
      {key:'finance', fn:financeScore, color:'var(--finance)', label:'Finance'},
      {key:'growth',  fn:growthScore,  color:'var(--growth)',  label:'Growth'}
    ];
    const weekData=[];
    for(let i=0;i<WCOUNT;i++){
      const wOff=reviewWeekOffset+(WCOUNT-1-i);
      const wd=getWeekDays(wOff);
      const entry={label:wd[0].date.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
      trendCats.forEach(cat=>{
        const days=wd.filter(d=>d.rec&&d.rec[cat.key]);
        entry[cat.key]=days.length?Math.round(days.reduce((a,d)=>a+cat.fn(d.rec),0)/days.length):null;
      });
      weekData.push(entry);
    }
    const WT=280,HT=140,lp=24,rp=6,tp=10,bp=22;
    const pW=WT-lp-rp,pH=HT-tp-bp;
    const xPos=i=>lp+i*(pW/(WCOUNT-1));
    const yPos=v=>tp+(1-v/100)*pH;
    const f=v=>v.toFixed(1);
    let ts=`<svg viewBox="0 0 ${WT} ${HT}" style="width:100%;max-width:${WT}px;height:auto;display:block">`;
    [0,25,50,75,100].forEach(v=>{
      const y=f(yPos(v));
      ts+=`<line x1="${lp}" y1="${y}" x2="${WT-rp}" y2="${y}" stroke="var(--sep-alt)" stroke-width="${v===50?0.8:0.5}" opacity="${v===50?0.6:0.35}"/>`;
      ts+=`<text x="${f(lp-2)}" y="${f(yPos(v)+2.5)}" text-anchor="end" font-size="5.5" font-family="Space Mono,monospace" fill="var(--mute)">${v}</text>`;
    });
    weekData.forEach((w,i)=>{
      if(i===0||i===WCOUNT-1||i===Math.floor((WCOUNT-1)/2)){
        const anchor=i===0?'start':i===WCOUNT-1?'end':'middle';
        ts+=`<text x="${f(xPos(i))}" y="${f(HT-4)}" text-anchor="${anchor}" font-size="5.5" font-family="Space Mono,monospace" fill="var(--mute)">${w.label}</text>`;
      }
    });
    trendCats.forEach(cat=>{
      let seg=[];
      const flush=()=>{
        if(seg.length>=2){
          const d=seg.map(([xi,v],si)=>(si===0?'M':'L')+f(xPos(xi))+','+f(yPos(v))).join(' ');
          ts+=`<path d="${d}" fill="none" stroke="${cat.color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>`;
        }
        seg=[];
      };
      weekData.forEach((w,i)=>{
        if(w[cat.key]!==null) seg.push([i,w[cat.key]]);
        else flush();
      });
      flush();
      weekData.forEach((w,i)=>{
        if(w[cat.key]!==null) ts+=`<circle cx="${f(xPos(i))}" cy="${f(yPos(w[cat.key]))}" r="2" fill="${cat.color}"/>`;
      });
    });
    ts+=`</svg>`;
    let leg='<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px">';
    trendCats.forEach(cat=>{
      leg+='<div style="display:flex;align-items:center;gap:4px"><div style="width:14px;height:2px;background:'+cat.color+';border-radius:1px"></div><span style="font-family:var(--mono);font-size:7px;color:var(--mute)">'+cat.label+'</span></div>';
    });
    leg+='</div>';
    html+='<div class="card">'+ts+leg+'</div>';
  })();

  // ─ FAITH ─
  const fDays = wWithData.filter(d=>d.rec.faith);
  html += sectionLabel('FAITH THIS WEEK','var(--faith)');
  html += '<div class="card">';
  if(fDays.length){
    const PRAYERS=['fajr','dhuhr','asr','maghrib','isha'];
    const avgPrayerPts=fDays.reduce((a,d)=>a+PRAYERS.reduce((b,p)=>b+(PRAYER_POINTS[d.rec.faith[p]||'unset']||0),0),0)/fDays.length;
    const avgExtraPts=fDays.reduce((a,d)=>a+(d.rec.faith.tahajjud?10:0)+(d.rec.faith.gratitude?10:0),0)/fDays.length;
    html+=progressRow('Prayers',Math.round(avgPrayerPts/80*100),Math.round(avgPrayerPts)+'/80','var(--faith)');
    html+=progressRow('Extras',Math.round(avgExtraPts/20*100),Math.round(avgExtraPts)+'/20','var(--faith)');
  }
  [['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']].forEach(([k,n])=>{
    const c = fDays.filter(d=>d.rec.faith[k]==='caught').length;
    const dl = fDays.filter(d=>d.rec.faith[k]==='delayed').length;
    const m = fDays.filter(d=>d.rec.faith[k]==='notprayed').length;
    html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--sep-alt);font-size:11px">'+
      '<span style="flex:1;color:var(--mute);font-size:10px">'+n+'</span>'+
      '<span><span style="font-family:var(--mono);color:var(--green)">'+c+'C</span>'+
      '<span style="font-family:var(--mono);color:var(--amber);margin:0 8px">'+dl+'D</span>'+
      '<span style="font-family:var(--mono);color:var(--red)">'+m+'M</span></span></div>';
  });
  const tahDays = fDays.filter(d=>d.rec.faith.tahajjud).length;
  const fastDays = fDays.filter(d=>d.rec.faith.fasting).length;
  const fajrStrk = computeStreak(r=>r.faith&&r.faith.fajr==='caught');
  const wFaithAvg = fDays.length ? Math.round(fDays.reduce((a,d)=>a+faithScore(d.rec),0)/fDays.length) : null;
  const pwFaithDays = getWeekDays(reviewWeekOffset+1).filter(d=>d.rec&&d.rec.faith);
  const pwFaithAvg = pwFaithDays.length ? Math.round(pwFaithDays.reduce((a,d)=>a+faithScore(d.rec),0)/pwFaithDays.length) : null;
  const faithDelta = (wFaithAvg!==null&&pwFaithAvg!==null) ? wFaithAvg-pwFaithAvg : null;
  html += rr('Tahajjud / Fasting', tahDays+' / '+fastDays+' days','var(--faith)');
  html += rr('Current Fajr streak', fajrStrk+' days','var(--faith)');
  html += rr('Avg score', (wFaithAvg!==null?wFaithAvg:'--')+(faithDelta!==null?' ('+(faithDelta>=0?'+':'')+faithDelta+')':''),'var(--faith)');
  html += '</div>';

  // ─ HEALTH ─
  const hDays = wWithData.filter(d=>d.rec.health);
  html += sectionLabel('HEALTH THIS WEEK','var(--health)');
  html += '<div class="card">';
  if(hDays.length){
    const avgSleepPts=hDays.reduce((a,d)=>{
      const sh=parseFloat(d.rec.health.sleepHours||0);
      let p;if(sh>=7&&sh<=9)p=20;else if(sh<7)p=(sh/7)*20;else p=Math.max(0,(1-(sh-9)/3))*20;
      return a+p;
    },0)/hDays.length;
    const avgHabitPts=hDays.reduce((a,d)=>{
      const h=d.rec.health,wt=25/9;let p=0;
      HEALTH_BOOL_GOOD.forEach(k=>{if(h[k])p+=wt;});
      HEALTH_BOOL_BAD.forEach(k=>{if(!h[k])p+=wt;});
      return a+p;
    },0)/hDays.length;
    const avgWBPts=hDays.reduce((a,d)=>{
      const h=d.rec.health;
      return a+Math.min((h.water||0)/5,1)*5+Math.min((h.brushing||0)/2,1)*5;
    },0)/hDays.length;
    const avgExPts=hDays.reduce((a,d)=>{
      const h=d.rec.health;
      return a+Math.min((h.pushupsReps||0)/30,1)*5+Math.min((h.abrollerReps||0)/15,1)*5+Math.min((h.kegelReps||0)/20,1)*5+Math.min((h.matroutineReps||0)/15,1)*5+Math.min((h.plankSeconds||0)/90,1)*5+Math.min((h.tennisMinutes||0)/45,1)*5+Math.min((h.runningKm||0)/3,1)*5+Math.min((h.hikingMinutes||0)/30,1)*5+Math.min((h.walkingMinutes||0)/30,1)*5;
    },0)/hDays.length;
    html+=progressRow('Sleep',Math.round(avgSleepPts/20*100),Math.round(avgSleepPts)+'/20','var(--health)');
    html+=progressRow('Habits',Math.round(avgHabitPts/25*100),Math.round(avgHabitPts)+'/25','var(--health)');
    html+=progressRow('Water & Brushing',Math.round(avgWBPts/10*100),Math.round(avgWBPts)+'/10','var(--health)');
    html+=progressRow('Exercise',Math.round(avgExPts/45*100),Math.round(avgExPts)+'/45','var(--health)');
  }
  const sleepDays = hDays.filter(d=>parseFloat(d.rec.health.sleepHours||0)>0);
  const sleepAvg = sleepDays.length ? Math.round(sleepDays.reduce((a,d)=>a+parseFloat(d.rec.health.sleepHours),0)/sleepDays.length*10)/10 : null;
  const waterDays = hDays.filter(d=>(d.rec.health.water||0)>0);
  const waterAvg = waterDays.length ? Math.round(waterDays.reduce((a,d)=>a+(d.rec.health.water||0),0)/waterDays.length*10)/10 : null;
  const smokeFreeCount = hDays.filter(d=>d.rec.health.smokeFree===true).length;
  html += rr('Sleep avg', sleepAvg!==null?sleepAvg+'h':'--','var(--health)');
  html += rr('Water avg', waterAvg!==null?waterAvg+'/5':'--','var(--health)');
  html += rr('Smoke-free days', smokeFreeCount+' / '+hDays.length,'var(--health)');
  [['pushupsReps','Push-ups'],['abrollerReps','Ab roller'],['kegelReps','Kegel'],['matroutineReps','Mat routine']].forEach(([k,lbl])=>{
    const total = hDays.reduce((a,d)=>a+(d.rec.health[k]||0),0);
    if(total>0) html += rr(lbl+' total', total+' reps','var(--health)');
  });
  const totalPlank = hDays.reduce((a,d)=>a+(d.rec.health.plankSeconds||0),0);
  if(totalPlank>0) html += rr('Plank total', formatSeconds(totalPlank),'var(--health)');
  const totalTennis = hDays.reduce((a,d)=>a+(d.rec.health.tennisMinutes||0),0);
  const totalRunning = hDays.reduce((a,d)=>a+(Math.round((d.rec.health.runningKm||0)*10)/10),0);
  const totalRunMin = hDays.reduce((a,d)=>a+(d.rec.health.runningMinutes||0),0);
  const totalHiking = hDays.reduce((a,d)=>a+(d.rec.health.hikingMinutes||0),0);
  const totalWalking = hDays.reduce((a,d)=>a+(d.rec.health.walkingMinutes||0),0);
  if(totalTennis>0) html += rr('Tennis', totalTennis+' min','var(--health)');
  if(totalRunning>0||totalRunMin>0) html += rr('Running', (totalRunning>0?Math.round(totalRunning*10)/10+' km':'')+(totalRunning>0&&totalRunMin>0?' / ':'')+(totalRunMin>0?totalRunMin+' min':''),'var(--health)');
  if(totalHiking>0) html += rr('Hiking', totalHiking+' min','var(--health)');
  if(totalWalking>0) html += rr('Walking', totalWalking+' min','var(--health)');
  if(!hDays.length) html += '<div style="font-size:10px;color:var(--mute);padding:4px 0">No health data this week.</div>';
  html += '</div>';

  // ─ MUSIC ─
  const mDays = wWithData.filter(d=>d.rec.music);
  html += sectionLabel('MUSIC THIS WEEK','var(--music)');
  html += '<div class="card">';
  if(mDays.length){
    const avgProjPts=mDays.reduce((a,d)=>{
      const sessions=d.rec.music.sessions||[];
      const distinct=new Set(sessions.map(s=>s.workedOn).filter(w=>w&&w!=='')).size;
      return a+Math.min(distinct/3,1)*40;
    },0)/mDays.length;
    const avgMinPts=mDays.reduce((a,d)=>{
      const mins=(d.rec.music.sessions||[]).reduce((b,s)=>b+(s.minutes||0),0);
      return a+Math.min(mins/90,1)*40;
    },0)/mDays.length;
    const avgQualPts=mDays.reduce((a,d)=>{
      const sessions=d.rec.music.sessions||[];
      const rated=sessions.filter(s=>s.quality!=null);
      const aq=rated.length?rated.reduce((b,s)=>b+s.quality,0)/rated.length:0;
      return a+(aq/5)*20;
    },0)/mDays.length;
    html+=progressRow('Projects',Math.round(avgProjPts/40*100),Math.round(avgProjPts)+'/40','var(--music)');
    html+=progressRow('Minutes',Math.round(avgMinPts/40*100),Math.round(avgMinPts)+'/40','var(--music)');
    html+=progressRow('Quality',Math.round(avgQualPts/20*100),Math.round(avgQualPts)+'/20','var(--music)');
  }
  const sessionCount = mDays.filter(d=>(d.rec.music.sessions||[]).length>0).length;
  const totalMins = mDays.reduce((a,d)=>a+(d.rec.music.sessions||[]).reduce((b,s)=>b+(s.minutes||0),0),0);
  const projIds = [...new Set(mDays.flatMap(d=>(d.rec.music.sessions||[]).map(s=>s.workedOn).filter(w=>w&&w!=='instrumentals')))];
  const projNames = projIds.map(id=>{const p=DB.projects().find(x=>x.id===id);return p?p.name:id;});
  const instrCount = mDays.filter(d=>(d.rec.music.sessions||[]).some(s=>s.workedOn==='instrumentals')).length;
  html += rr('Sessions', sessionCount+' days','var(--music)');
  html += rr('Total studio time', totalMins>0?totalMins+' min':'--','var(--music)');
  html += rr('Projects touched', projNames.length?projNames.join(', '):'--','var(--music)');
  html += rr('Instrumentals sessions', instrCount+' days','var(--music)');
  html += '</div>';

  // ─ FINANCE ─
  html += sectionLabel('FINANCE THIS WEEK','var(--finance)');
  const wTxs = DB.transactions().filter(t=>t.date>=wDays[0].str&&t.date<=wDays[6].str);
  const wIncome = wTxs.filter(t=>t.type==='income'||t.type==='withdraw').reduce((a,b)=>a+b.amount,0);
  const wExpense = wTxs.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
  const wDeposit = wTxs.filter(t=>t.type==='deposit').reduce((a,b)=>a+b.amount,0);
  const wWithdraw = wTxs.filter(t=>t.type==='withdraw').reduce((a,b)=>a+b.amount,0);
  const expCats2 = ['Rent','Food','Business costs','Transport','Weed','Cigarettes','Given to people','Home bills','Other'];
  let topCat=null, topCatAmt=0;
  expCats2.forEach(c=>{ const amt=wTxs.filter(t=>t.type==='expense'&&t.category===c).reduce((a,b)=>a+b.amount,0); if(amt>topCatAmt){topCatAmt=amt;topCat=c;} });
  html += '<div class="card">';
  const finLoggedCount=wDays.filter(d=>d.rec&&d.rec.finance&&d.rec.finance.logged).length;
  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;margin-bottom:4px;border-bottom:1px solid var(--sep-alt)">'
    +'<span style="font-size:10px;color:var(--mute)">Logged</span>'
    +'<span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--finance)">'+finLoggedCount+' / 7 days</span>'
    +'</div>';
  html += rr('Income', wIncome.toLocaleString(),'var(--finance)');
  html += rr('Expense', wExpense.toLocaleString(),'var(--red)');
  html += rr('Net', (wIncome-wExpense).toLocaleString(),(wIncome-wExpense)>=0?'var(--green)':'var(--red)');
  html += rr('Deposited', wDeposit.toLocaleString(),'var(--finance)');
  html += rr('Withdrawn', wWithdraw.toLocaleString(),'var(--finance)');
  if(topCat) html += rr('Top expense category', topCat+' ('+topCatAmt.toLocaleString()+')','var(--amber)');
  html += '</div>';

  // ─ GROWTH ─
  const gDays = wWithData.filter(d=>d.rec.growth);
  html += sectionLabel('GROWTH THIS WEEK','var(--growth)');
  html += '<div class="card">';
  const wGrowthAvg = gDays.length ? Math.round(gDays.reduce((a,d)=>a+growthScore(d.rec),0)/gDays.length) : null;
  html += rr('Completion avg', wGrowthAvg!==null?wGrowthAvg+'%':'--','var(--growth)');
  if(gDays.length){
    const newGDays = gDays.filter(d=>d.rec.growth.reps||d.rec.growth.checks);
    const oldGDays = gDays.filter(d=>!d.rec.growth.reps&&!d.rec.growth.checks);
    if(newGDays.length){
      // Top rep key by avg count
      const repAvgs = GR_REPS_KEYS.map(k=>({k, avg: newGDays.reduce((s,d)=>s+((d.rec.growth.reps&&d.rec.growth.reps[k])||0),0)/newGDays.length}));
      repAvgs.sort((a,b)=>b.avg-a.avg);
      if(repAvgs[0].avg>0) html += rr('Top affirmation', GR_REPS_LABELS[repAvgs[0].k]+' (avg '+repAvgs[0].avg.toFixed(1)+')','var(--growth)');
      // Most checked YES
      const chkHits = GR_CHK_KEYS.map(k=>({k, hits: newGDays.filter(d=>d.rec.growth.checks&&d.rec.growth.checks[k]==='yes').length}));
      chkHits.sort((a,b)=>b.hits-a.hits);
      if(chkHits[0].hits>0) html += rr('Most consistent check', GR_CHK_LABELS[chkHits[0].k]+' ('+chkHits[0].hits+'/'+newGDays.length+'d)','var(--growth)');
    }
    if(oldGDays.length){
      const hitCounts = {};
      GROWTH_ITEMS.forEach(k=>{ hitCounts[k]=oldGDays.filter(d=>d.rec.growth[k]).length; });
      const sorted = GROWTH_ITEMS.slice().sort((a,b)=>hitCounts[b]-hitCounts[a]).filter(k=>hitCounts[k]>0);
      if(sorted.length) html += rr('Legacy — most consistent', sorted[0]+' ('+hitCounts[sorted[0]]+'/'+oldGDays.length+'d)','var(--growth)');
    }
  }
  html += '</div>';

  // ─ BEST / WORST DAY ─
  if(wWithData.length){
    html += sectionLabel('BEST / WORST DAY','var(--home)');
    const scored = wWithData.map(d=>({str:d.str,score:dayScore(d.rec),date:d.date}));
    const best = scored.reduce((a,b)=>b.score>a.score?b:a);
    const worst = scored.reduce((a,b)=>b.score<a.score?b:a);
    html += '<div class="grid2">';
    html += '<div class="card" style="text-align:center">'+
      '<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:4px">BEST DAY</div>'+
      '<div class="hero-num" style="font-size:22px;color:var(--green)">'+best.score+'</div>'+
      '<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-top:4px">'+best.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</div></div>';
    html += '<div class="card" style="text-align:center">'+
      '<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-bottom:4px">WORST DAY</div>'+
      '<div class="hero-num" style="font-size:22px;color:var(--red)">'+worst.score+'</div>'+
      '<div style="font-family:var(--mono);font-size:8px;color:var(--mute);margin-top:4px">'+worst.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</div></div>';
    html += '</div>';
  }

  // ─ NEEDS ATTENTION ─
  html += sectionLabel('NEEDS ATTENTION','var(--amber)');
  if(wWithData.length){
    const items = [];
    const fDaysNa = wWithData.filter(d=>d.rec.faith);
    if(fDaysNa.length){
      [['fajr','Faith: Fajr'],['dhuhr','Faith: Dhuhr'],['asr','Faith: Asr'],['maghrib','Faith: Maghrib'],['isha','Faith: Isha']].forEach(([k,n])=>{
        items.push({label:n, rate:fDaysNa.filter(d=>d.rec.faith[k]==='caught').length/fDaysNa.length});
      });
    }
    const hDaysNa = wWithData.filter(d=>d.rec.health);
    if(hDaysNa.length){
      [['fruits','Health: Fruits'],['milk','Health: Milk'],['stopstart','Health: Stop-start'],['smokeFree','Health: Smoke-free']].forEach(([k,n])=>{
        items.push({label:n, rate:hDaysNa.filter(d=>d.rec.health[k]===true).length/hDaysNa.length});
      });
      [['junk','Health: Avoid junk'],['weed','Health: Avoid weed'],['nailbiting','Health: Avoid nail-biting']].forEach(([k,n])=>{
        items.push({label:n, rate:hDaysNa.filter(d=>d.rec.health[k]!==true).length/hDaysNa.length});
      });
    }
    const gDaysNa = wWithData.filter(d=>d.rec.growth);
    if(gDaysNa.length){
      const newGNa = gDaysNa.filter(d=>d.rec.growth.reps||d.rec.growth.checks);
      const oldGNa = gDaysNa.filter(d=>!d.rec.growth.reps&&!d.rec.growth.checks);
      if(newGNa.length){
        GR_CHK_KEYS.forEach(k=>{ items.push({label:'Growth: '+GR_CHK_LABELS[k], rate:newGNa.filter(d=>d.rec.growth.checks&&d.rec.growth.checks[k]==='yes').length/newGNa.length}); });
      }
      if(oldGNa.length){
        GROWTH_ITEMS.forEach(k=>{ items.push({label:'Growth (legacy): '+k, rate:oldGNa.filter(d=>d.rec.growth[k]).length/oldGNa.length}); });
      }
    }
    const mDaysNa = wWithData.filter(d=>d.rec.music);
    if(mDaysNa.length) items.push({label:'Music: Studio session', rate:mDaysNa.filter(d=>(d.rec.music.sessions||[]).length>0).length/mDaysNa.length});
    const fDaysNaFin = wWithData.filter(d=>d.rec.finance);
    if(fDaysNaFin.length) items.push({label:'Finance: Log daily', rate:fDaysNaFin.filter(d=>d.rec.finance.logged).length/fDaysNaFin.length});

    if(items.length){
      items.sort((a,b)=>a.rate-b.rate);
      const wItem = items[0];
      const pct = Math.round(wItem.rate*100);
      html += '<div class="card">'+
        '<div style="font-family:var(--mono);font-size:9px;color:var(--mute);margin-bottom:6px">LOWEST HIT RATE THIS WEEK</div>'+
        '<div style="font-size:13px;color:var(--text);margin-bottom:8px">'+wItem.label+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--amber)"></div></div>'+
        '<div style="font-family:var(--mono);font-size:9px;color:var(--amber);margin-top:4px">'+pct+'% across logged days</div></div>';
    } else {
      html += '<div class="card">'+'<div style="font-size:11px;color:var(--mute)">No data to analyze this week.</div></div>';
    }
  } else {
    html += '<div class="card">'+'<div style="font-size:11px;color:var(--mute)">No days logged this week.</div></div>';
  }

  // ─ RECORDS SET THIS WEEK ─
  const bests = computeAllTimeBests();
  const weekRecords = [];
  if(hDays.length){
    const wMaxPlank = hDays.reduce((a,d)=>Math.max(a,d.rec.health.plankSeconds||0),0);
    if(wMaxPlank>0&&wMaxPlank>=bests.plankSeconds) weekRecords.push('Plank: '+formatSeconds(wMaxPlank));
    [['pushupsReps','Push-ups'],['abrollerReps','Ab roller'],['kegelReps','Kegel'],['matroutineReps','Mat routine']].forEach(([k,lbl])=>{
      const wMax = hDays.reduce((a,d)=>Math.max(a,d.rec.health[k]||0),0);
      if(wMax>0&&wMax>=bests[k]) weekRecords.push(lbl+': '+wMax+' reps');
    });
  }
  if(mDays.length){
    const wMaxStudio = mDays.reduce((a,d)=>Math.max(a,(d.rec.music.sessions||[]).reduce((b,s)=>b+(s.minutes||0),0)),0);
    if(wMaxStudio>0&&wMaxStudio>=bests.studioMins) weekRecords.push('Studio session: '+wMaxStudio+' min');
  }
  if(weekRecords.length){
    html += sectionLabel('RECORDS SET THIS WEEK','var(--amber)');
    html += '<div class="card">'+weekRecords.map(r=>'<div class="stat-row"><span>'+r+'</span><span style="color:var(--amber);font-family:var(--mono)">NEW PR</span></div>').join('')+'</div>';
  }

  // ─ WEEK STREAK ─
  function computeWeekStreak(){
    let count = 0;
    for(let wso=0;;wso++){
      const wd2 = getWeekDays(wso).filter(d=>d.rec);
      if(!wd2.length) break;
      const avg2 = wd2.reduce((a,d)=>a+dayScore(d.rec),0)/wd2.length;
      if(avg2>=70) count++; else break;
      if(wso>500) break;
    }
    return count;
  }
  const weekStreakVal = computeWeekStreak();
  html += sectionLabel('WEEKLY STREAK','var(--home)');
  html += flameStat('CONSECUTIVE WEEKS ≥ 70', weekStreakVal, 'var(--home)');

  s.innerHTML = html;

  const revBack = document.getElementById('rev-back');
  const revFwd = document.getElementById('rev-fwd');
  if(revBack) revBack.addEventListener('click',()=>{ reviewWeekOffset++; renderReview(); });
  if(revFwd) revFwd.addEventListener('click',()=>{ if(reviewWeekOffset>0){ reviewWeekOffset--; renderReview(); } });
  patchAriaRoles(s);
}
