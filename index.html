/* ============ NEGLECT CHECK ============ */
function computeNeglectGaps(){
  const all=DB.allDays();
  function gapDays(checkFn){
    if(checkFn(day)) return 0;
    for(let i=1;i<=60;i++){
      const d=new Date(TODAY); d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      const rec=all[ds];
      if(rec&&checkFn(rec)) return i;
    }
    return 999;
  }
  const H=r=>(r.health||{}),F=r=>(r.faith||{}),G=r=>(r.growth||{});
  const tiers=[
    {threshold:1,items:[
      {key:'water',label:'Water',fn:r=>H(r).water>0},
      {key:'smokeFree',label:'Smoke-free',fn:r=>!!H(r).smokeFree},
      {key:'fruits',label:'Fruits',fn:r=>!!H(r).fruits},
      {key:'milk',label:'Milk',fn:r=>!!H(r).milk},
      {key:'brushing',label:'Brushing',fn:r=>H(r).brushing>0},
      {key:'dhikr',label:'Dhikr',tab:'faith',fn:r=>!!F(r).dhikr},
      {key:'gratitude',label:'Gratitude',tab:'faith',fn:r=>!!F(r).gratitude},
      ...GR_CHK_KEYS.map(k=>({key:'gc_'+k,label:GR_CHK_LABELS[k],tab:'growth',fn:r=>{const g2=G(r);return (g2.checks&&g2.checks[k]==='yes')||(g2[k.replace(/^gc_/,'')]===true);}}))
    ]},
    {threshold:2,items:[
      {key:'pushupsReps',label:'Push-ups',fn:r=>H(r).pushupsReps>0},
      {key:'abrollerReps',label:'Ab roller',fn:r=>H(r).abrollerReps>0},
      {key:'kegelReps',label:'Kegel',fn:r=>H(r).kegelReps>0},
      {key:'matroutineReps',label:'Mat routine',fn:r=>H(r).matroutineReps>0},
      {key:'plankSeconds',label:'Plank',fn:r=>H(r).plankSeconds>0}
    ]},
    {threshold:4,items:[
      {key:'tennisMinutes',label:'Tennis',fn:r=>H(r).tennisMinutes>0},
      {key:'runningKm',label:'Running',fn:r=>H(r).runningKm>0},
      {key:'hikingMinutes',label:'Hiking',fn:r=>H(r).hikingMinutes>0},
      {key:'walkingMinutes',label:'Walking',fn:r=>H(r).walkingMinutes>0},
      {key:'sessionLogged',label:'Music session',tab:'music',fn:r=>((r.music||{}).sessions||[]).length>0},
      {key:'tahajjud',label:'Tahajjud',tab:'faith',fn:r=>!!F(r).tahajjud},
      {key:'fasting',label:'Fasting',tab:'faith',fn:r=>!!F(r).fasting},
      {key:'knifesharpening',label:'Knife sharpening',fn:r=>!!H(r).knifesharpening},
      {key:'penilemassage',label:'Penile massage',fn:r=>!!H(r).penilemassage},
      {key:'stopstart',label:'Stop-start',fn:r=>!!H(r).stopstart}
    ]}
  ];
  const gaps=[];
  for(const tier of tiers){
    for(const item of tier.items){
      const g=gapDays(item.fn);
      if(g>=tier.threshold) gaps.push({...item,gap:g,threshold:tier.threshold});
    }
  }
  const pt=calcPrayerTimes(TODAY);
  const base=new Date(TODAY+'T00:00:00Z').getTime();
  const now=Date.now();
  const pNames={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
  const pUTC={fajr:'fajrUTC',dhuhr:'dhuhrUTC',asr:'asrUTC',maghrib:'maghribUTC',isha:'ishaUTC'};
  for(const [pk,pl] of Object.entries(pNames)){
    if(base+pt[pUTC[pk]]*3600000<now && day.faith[pk]===undefined){
      gaps.push({key:'prayer_'+pk,label:pl+' — not logged today',tab:'faith',prayerKey:pk,gap:1,threshold:0});
    }
  }
  gaps.sort((a,b)=>(b.gap-b.threshold)-(a.gap-a.threshold));
  return gaps;
}

function neglectBannerHtml(gaps){
  if(!gaps.length||neglectDismissed) return '';
  const top3=gaps.slice(0,3);
  const gapLabel=g=>g===999?'Never logged':g===1?'Not today':g+' days ago';
  const tabOf=item=>item.tab||(item.key.startsWith('g_')?'growth':'health');
  const rows=top3.map(g=>'<div class="checkline" data-neglect-tab="'+tabOf(g)+'" style="cursor:pointer">'+
    '<span style="flex:1;font-size:12px">'+g.label+'</span>'+
    '<span style="font-family:var(--mono);font-size:10px;color:var(--red)">'+gapLabel(g.gap)+'</span>'+
    '</div>').join('');
  const more=gaps.length>3?'<div style="font-size:10px;color:var(--mute);text-align:center;margin-top:6px">+'+(gaps.length-3)+' more</div>':'';
  return '<div class="card" style="border-color:var(--red)">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<span style="font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:1px">NEGLECT CHECK</span>'+
    '<button id="neglect-dismiss" style="background:transparent;border:none;color:var(--mute);cursor:pointer;font-size:18px;padding:0;line-height:1">&#215;</button>'+
    '</div>'+rows+more+'</div>';
}

  }

async function checkAndNotify(gaps){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  if(localStorage.getItem('lo_notif_enabled')!=='true') return;
  if(!gaps.length) return;
  const tieredGaps=gaps.filter(g=>!g.prayerKey);
  const prayerGaps=gaps.filter(g=>!!g.prayerKey);
  async function fireNotif(title,body,tag){
    try{
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification(title,{body,icon:'icon-192.png',tag,renotify:false});
    }catch(e){
      try{new Notification(title,{body});}catch(_){}
    }
  }
  if(tieredGaps.length){
    const lastSeen=localStorage.getItem('lo_lastNudgeSeen');
    if(lastSeen!==TODAY){
      localStorage.setItem('lo_lastNudgeSeen',TODAY);
      const top=tieredGaps[0];
      const body=tieredGaps.length===1
        ? top.label+' hasn\'t been logged recently.'
        : top.label+' and '+(tieredGaps.length-1)+' other item'+(tieredGaps.length>2?'s':'')+' need attention.';
      await fireNotif('Life OS — Neglect Check',body,'lo-neglect');
    }
  }
  for(const p of prayerGaps){
    const gate='lo_lastPrayerNudge_'+p.prayerKey+'_'+TODAY;
    if(!localStorage.getItem(gate)){
      localStorage.setItem(gate,'1');
      await fireNotif('Life OS — Prayer',p.label,'lo-prayer-'+p.prayerKey);
    }
  }
}

/* ============ FACE ID LOCK ============ */
const FACEID_KEY='lo_faceid_cred_id';

function renderFaceIdToggle(){
  const el=document.getElementById('home-faceid-toggle');
  if(!el) return;
  const enabled=!!localStorage.getItem(FACEID_KEY);
  if(enabled){
    el.innerHTML='<button style="background:transparent;border:none;color:var(--mute);font-size:10px;cursor:pointer;opacity:.7;letter-spacing:.3px;font-family:var(--sans)" onclick="disableFaceIdLock()">Disable Face ID lock</button>';
  } else {
    if(!(window.PublicKeyCredential&&navigator.credentials)){el.innerHTML='';return;}
    el.innerHTML='<button style="background:transparent;border:none;color:var(--mute);font-size:10px;cursor:pointer;opacity:.7;letter-spacing:.3px;font-family:var(--sans)" onclick="enableFaceIdLock()">Enable Face ID lock</button>';
  }
}
async function enableFaceIdLock(){
  if(!window.PublicKeyCredential||!navigator.credentials){showToast('Face ID not available on this device');return;}
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.create({publicKey:{
      challenge,
      rp:{name:'Life OS'},
      user:{id:new Uint8Array(16),name:'local',displayName:'Local User'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    if(!cred){showToast('Face ID setup cancelled');return;}
    localStorage.setItem(FACEID_KEY,btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
    showToast('Face ID lock enabled');
    renderFaceIdToggle();
  }catch(e){
    if(e.name==='NotAllowedError') showToast('Face ID setup cancelled');
    else showToast('Face ID setup failed: '+e.message);
  }
}
function disableFaceIdLock(){
  if(!confirm('Remove Face ID lock? The app will open without authentication.')) return;
  localStorage.removeItem(FACEID_KEY);
  showToast('Face ID lock disabled');
  renderFaceIdToggle();
}
function resetFaceIdLock(){
  localStorage.removeItem(FACEID_KEY);
  document.getElementById('faceid-lock').style.display='none';
  if(window._faceIdProceed) window._faceIdProceed();
}
function checkFaceIdLock(proceedFn){
  if(!localStorage.getItem(FACEID_KEY)){proceedFn();return;}
  document.getElementById('faceid-lock').style.display='flex';
  window._faceIdProceed=proceedFn;
}
async function unlockWithFaceId(){
  const stored=localStorage.getItem(FACEID_KEY);
  if(!stored){document.getElementById('faceid-lock').style.display='none';return;}
  if(!window.PublicKeyCredential||!navigator.credentials){
    showToast('Face ID unavailable — lock bypassed');
    localStorage.removeItem(FACEID_KEY);
    document.getElementById('faceid-lock').style.display='none';
    if(window._faceIdProceed) window._faceIdProceed();
    return;
  }
  try{
    let rawId;
    try{
      const bytes=atob(stored);
      rawId=new Uint8Array(bytes.length);
      for(let i=0;i<bytes.length;i++) rawId[i]=bytes.charCodeAt(i);
    }catch(_){
      showToast('Credential corrupted — lock cleared');
      localStorage.removeItem(FACEID_KEY);
      document.getElementById('faceid-lock').style.display='none';
      if(window._faceIdProceed) window._faceIdProceed();
      return;
    }
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const assertion=await navigator.credentials.get({publicKey:{
      challenge,
      allowCredentials:[{type:'public-key',id:rawId}],
      userVerification:'required',
      timeout:60000
    }});
    if(assertion){
      document.getElementById('faceid-lock').style.display='none';
      if(window._faceIdProceed) window._faceIdProceed();
    }
  }catch(e){
    if(e.name==='NotAllowedError') showToast('Face ID verification cancelled');
    else{
      showToast('Face ID error — lock bypassed');
      localStorage.removeItem(FACEID_KEY);
      document.getElementById('faceid-lock').style.display='none';
      if(window._faceIdProceed) window._faceIdProceed();
    }
  }
}

/* ============ SCROLL REVEAL ============ */
function animateCardsIn(screenEl){
  const cards=Array.from(screenEl.querySelectorAll(':scope > .card,:scope > .card-shell,:scope > .cat-scroll'));
  cards.forEach(c=>{c.classList.remove('visible');c.classList.add('card-animate');});
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const idx=cards.indexOf(entry.target);
        setTimeout(()=>entry.target.classList.add('visible'),idx*40);
        observer.unobserve(entry.target);
      }
    });
  },{root:screenEl,threshold:0.05});
  cards.forEach(c=>observer.observe(c));
}

/* ============ ARIA / KEYBOARD ============ */
function patchAriaRoles(container){
  (container||document).querySelectorAll('.pill,.checkline,.cd,.cal-bubble-cell').forEach(el=>{
    if(el.getAttribute('role')==='button') return;
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
  });
}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){
    e.preventDefault();
    e.target.click();
  }
});

function migrateMusicSessions(){
  if(localStorage.getItem('lo_music_v3')) return; // already migrated
  const all = JSON.parse(localStorage.getItem('lo_days')||'{}');
  let changed = false;
  Object.keys(all).forEach(ds=>{
    const m = all[ds].music;
    if(!m) return;
    if('sessionLogged' in m){ // old flat format → convert
      const session = m.sessionLogged ? [{
        workedOn: m.workedOn || '',
        minutes: m.sessionMinutes || 0,
        quality: (m.sessionQuality != null) ? m.sessionQuality : null,
        startTime: null,
        endTime: null,
        minutesSource: 'manual'
      }] : [];
      all[ds].music = { sessions: session, notes: m.notes || '' };
      changed = true;
    } else if(!Array.isArray(m.sessions)){ // music:{} with no sessions array
      all[ds].music = { sessions: [], notes: m.notes || '' };
      changed = true;
    }
  });
  if(changed) localStorage.setItem('lo_days', JSON.stringify(all));
  localStorage.setItem('lo_music_v3','1');
}

const PROFILE_AVATARS=[
  {key:'builtin:lion',e:'🦁'},{key:'builtin:wave',e:'🌊'},{key:'builtin:star',e:'⭐'},
  {key:'builtin:mountain',e:'⛰'},{key:'builtin:flame',e:'🔥'},{key:'builtin:crescent',e:'🌙'}
];

function compressAvatar(file,cb){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    const cv=document.createElement('canvas'); cv.width=cv.height=160;
    const ctx=cv.getContext('2d');
    const sz=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,160,160);
    URL.revokeObjectURL(url); cb(cv.toDataURL('image/jpeg',0.75));
  };
  img.src=url;
}

  const avHtml=PROFILE_AVATARS.map(a=>
    `<div class="profile-avatar-item${(!p.avatarPhoto&&a.key===sel)?' selected':''}" data-av="${a.key}">${a.e}</div>`
  ).join('')+
  `<div class="profile-avatar-item${p.avatarPhoto?' selected':''}" data-av="upload" id="${pre}-upload-btn">📷</div>`+
  `<input type="file" id="${pre}-file-input" accept="image/*" style="display:none">`;
  const closeBtn=isNew?'':
    `<button onclick="document.getElementById('${pre}-overlay').remove()" `+
    `style="position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--mute);font-size:22px;cursor:pointer;line-height:1">×</button>`;
  const gM=p.gender==='male'?' selected':'', gF=p.gender==='female'?' selected':'';
  const nick=(p.nickname||'').replace(/"/g,'&quot;');
  const btnDisabled=(isNew&&!p.nickname)?' disabled':'';
  return `<div class="profile-card" style="position:relative">
    ${closeBtn}
    <div style="text-align:center;margin-bottom:20px">
      <img src="image_holographic_logo-825a1b.png" style="width:44px;height:44px;margin-bottom:8px">
      <div style="font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--green)">${isNew?'WELCOME TO LIFE OS':'PROFILE &amp; SETTINGS'}</div>
      <div style="font-family:var(--sans);font-size:11px;color:var(--mute);margin-top:4px">${isNew?"Let's set up your profile":'Edit your profile below'}</div>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:8px">AVATAR</div>
    <div class="profile-avatar-row" id="${pre}-avatar-row">${avHtml}</div>
    <div id="${pre}-photo-preview" style="${p.avatarPhoto?'':'display:none'};text-align:center;margin-bottom:12px">
      <img id="${pre}-photo-img" src="${p.avatarPhoto||''}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--green)">
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:6px">NICKNAME <span style="color:var(--red)">*</span></div>
    <input type="text" id="${pre}-nickname" class="profile-input" placeholder="What do you go by?" maxlength="30" value="${nick}">
    <div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:6px;margin-top:14px">GENDER <span style="font-size:8px;color:var(--mute)">(optional)</span></div>
    <div class="profile-gender-row" id="${pre}-gender-row">
      <button class="profile-gender-pill${gM}" data-g="male">Male</button>
      <button class="profile-gender-pill${gF}" data-g="female">Female</button>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:6px;margin-top:14px">DATE OF BIRTH <span style="font-size:8px;color:var(--mute)">(optional)</span></div>
    <input type="date" id="${pre}-dob" class="profile-input" value="${p.dob||''}">
    <button id="${pre}-save-btn" class="profile-save-btn"${btnDisabled} onclick="saveProfileForm('${pre}',${isNew})">${isNew?'Let\'s go →':'Save'}</button>
  </div>`;
}

function _wireProfileForm(pre){
  document.querySelectorAll(`#${pre}-avatar-row .profile-avatar-item`).forEach(el=>{
    el.addEventListener('click',function(){
      if(this.dataset.av==='upload'){ document.getElementById(pre+'-file-input').click(); return; }
      document.querySelectorAll(`#${pre}-avatar-row .profile-avatar-item`).forEach(x=>x.classList.remove('selected'));
      this.classList.add('selected');
      document.getElementById(pre+'-photo-preview').style.display='none';
    });
  });
  const fi=document.getElementById(pre+'-file-input');
  if(fi) fi.addEventListener('change',function(){
    const f=this.files[0]; if(!f) return;
    compressAvatar(f,function(d){
      document.getElementById(pre+'-photo-img').src=d;
      document.getElementById(pre+'-photo-preview').style.display='block';
      document.querySelectorAll(`#${pre}-avatar-row .profile-avatar-item`).forEach(x=>x.classList.remove('selected'));
      document.getElementById(pre+'-upload-btn').classList.add('selected');
    });
  });
  document.querySelectorAll(`#${pre}-gender-row .profile-gender-pill`).forEach(pill=>{
    pill.addEventListener('click',function(){
      const was=this.classList.contains('selected');
      document.querySelectorAll(`#${pre}-gender-row .profile-gender-pill`).forEach(p=>p.classList.remove('selected'));
      if(!was) this.classList.add('selected');
    });
  });
  const nickEl=document.getElementById(pre+'-nickname');
  const saveBtn=document.getElementById(pre+'-save-btn');
  if(nickEl&&saveBtn) nickEl.addEventListener('input',function(){ saveBtn.disabled=!this.value.trim(); });
}

function _readProfileForm(pre){
  const nick=document.getElementById(pre+'-nickname').value.trim();
  const selAv=document.querySelector(`#${pre}-avatar-row .profile-avatar-item.selected`);
  const avKey=selAv?selAv.dataset.av:null;
  const hasPhoto=document.getElementById(pre+'-photo-preview').style.display!=='none';
  const selG=document.querySelector(`#${pre}-gender-row .profile-gender-pill.selected`);
  return {
    nickname: nick,
    gender: selG?selG.dataset.g:null,
    dob: document.getElementById(pre+'-dob').value||null,
    avatar: (!hasPhoto&&avKey&&avKey!=='upload')?avKey:'builtin:lion',
    avatarPhoto: hasPhoto?document.getElementById(pre+'-photo-img').src:null
  };
}

function saveProfileForm(pre,isNew){
  const p=_readProfileForm(pre);
  if(!p.nickname) return;
  DB.saveProfile(p);
  document.getElementById(pre+'-overlay').remove();
  applyProfileNickname();
  if(isNew) renderAll(); else renderHome();
}

function showOnboarding(){

/* ============ HOME — HOURGLASS + TIME BARS ============ */
function hourglassCardHtml(sf, daysUntil){
  // sf = sandFraction: 0 = just after birthday (top full), 1 = birthday today (bottom full)
  const f=sf;
  // Top sand: drains from top toward waist as f increases
  const yTop=4+46*f, xTL=5+23*f, xTR=55-23*f;
  // Bottom sand: rises from bottom toward waist as f increases
  const yBot=106-46*f, xBL=5+23*f, xBR=55-23*f;
  const p=v=>v.toFixed(1);
  const topFrame='M 5,4 L 55,4 L 32,50 L 28,50 Z';
  const botFrame='M 28,60 L 32,60 L 55,106 L 5,106 Z';
  const topSand=f<1?`M ${p(xTL)},${p(yTop)} L ${p(xTR)},${p(yTop)} L 32,50 L 28,50 Z`:null;
  const botSand=f>0?`M ${p(xBL)},${p(yBot)} L ${p(xBR)},${p(yBot)} L 55,106 L 5,106 Z`:null;
  const trickle=f>0&&f<1?'<rect x="29" y="50" width="2" height="10" fill="var(--green)" opacity="0.45"/>':'';
  let svg='<svg width="60" height="110" viewBox="0 0 60 110">';
  svg+=`<path d="${topFrame}" fill="rgba(61,220,151,0.06)" stroke="var(--green)" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round"/>`;
  svg+=`<path d="${botFrame}" fill="rgba(61,220,151,0.06)" stroke="var(--green)" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round"/>`;
  if(topSand) svg+=`<path d="${topSand}" fill="var(--green)" opacity="0.7"/>`;
  if(botSand) svg+=`<path d="${botSand}" fill="var(--green)" opacity="0.7"/>`;
  svg+=trickle+'</svg>';
  const bdayText=daysUntil===0?'HAPPY BIRTHDAY! 🎂':'🎂 in '+daysUntil+' day'+(daysUntil===1?'':'s');
  return '<div class="card" style="text-align:center;padding:14px 16px">'
    +'<div style="font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:2px;margin-bottom:10px">NEXT BIRTHDAY</div>'
    +svg
    +'<div style="font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:1px;margin-top:8px">'+bdayText+'</div>'
    +'</div>';
}

function progressBarSvg(pct, segments){
  const W=340, H=6, gap=2;
  const segW=(W-(segments-1)*gap)/segments;
  const filled=Math.max(0,Math.min(segments,pct*segments));
  const gid='tbg'+segments;
  let svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">`;
  svg+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="${W}" y2="0" gradientUnits="userSpaceOnUse">`;
  svg+=`<stop offset="0%" stop-color="var(--cyan)"/><stop offset="100%" stop-color="var(--green)"/>`;
  svg+=`</linearGradient></defs>`;
  for(let i=0;i<segments;i++){
    const x=i*(segW+gap), frac=Math.min(1,Math.max(0,filled-i));
    svg+=`<rect x="${x.toFixed(1)}" y="0" width="${segW.toFixed(1)}" height="${H}" rx="1.5" fill="rgba(255,255,255,0.07)"/>`;
    if(frac>0.001) svg+=`<rect x="${x.toFixed(1)}" y="0" width="${(segW*frac).toFixed(1)}" height="${H}" rx="1.5" fill="url(#${gid})"/>`;
  }
  return svg+'</svg>';
}

function yearBarSvg(pct){
  const W=340, H=6, filled=Math.max(0,Math.min(W,pct*W));
  let svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">`;
  svg+=`<defs><linearGradient id="tbgyr" x1="0" y1="0" x2="${W}" y2="0" gradientUnits="userSpaceOnUse">`;
  svg+=`<stop offset="0%" stop-color="var(--cyan)"/><stop offset="100%" stop-color="var(--green)"/>`;
  svg+=`</linearGradient></defs>`;
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" rx="3" fill="rgba(255,255,255,0.07)"/>`;
  if(filled>0.5) svg+=`<rect x="0" y="0" width="${filled.toFixed(1)}" height="${H}" rx="3" fill="url(#tbgyr)"/>`;
  return svg+'</svg>';
}

function renderTimeElapsed(){
  const el=document.getElementById('home-time-bars');
  if(!el) return;
  const now=new Date();
  const midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dayElapsedSec=(now-midnight)/1000;
  // DAY
  const dayPct=dayElapsedSec/86400;
  const dayRemSec=86400-dayElapsedSec;
  const dRH=Math.floor(dayRemSec/3600), dRM=Math.floor((dayRemSec%3600)/60);
  const dayRemStr=dRH>0?dRH+'h '+dRM+'m left':dRM+'m left';
  // WEEK (Monday-start)
  const dow0=(now.getDay()+6)%7;
  const weekElapsedSec=dow0*86400+dayElapsedSec;
  const weekPct=weekElapsedSec/(7*86400);
  const weekRemSec=7*86400-weekElapsedSec;
  const wRD=Math.floor(weekRemSec/86400), wRH=Math.floor((weekRemSec%86400)/3600);
  const weekRemStr=wRD>=2?wRD+'d '+wRH+'h left':wRD===1?'1d '+wRH+'h left':wRH+'h left';
  // YEAR
  const yearStart=new Date(now.getFullYear(),0,1);
  const yearEnd=new Date(now.getFullYear()+1,0,1);
  const yearPct=(now-yearStart)/(yearEnd-yearStart);
  const yearRemMs=yearEnd-now;
  const yRD=Math.floor(yearRemMs/86400000), yRH=Math.floor((yearRemMs%86400000)/3600000);
  const yearRemStr=yRD>0?yRD+'d '+yRH+'h left':yRH+'h left';
  const row=(lbl,rem,bar)=>`<div style="margin-bottom:10px">`
    +`<div style="display:flex;justify-content:space-between;margin-bottom:4px">`
    +`<span style="font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--mute)">${lbl}</span>`
    +`<span style="font-family:var(--mono);font-size:9px;color:var(--mute)">${rem}</span>`
    +`</div>${bar}</div>`;
  el.innerHTML=row('DAY',dayRemStr,progressBarSvg(dayPct,24))
    +row('WEEK',weekRemStr,progressBarSvg(weekPct,7))
    +`<div><div style="display:flex;justify-content:space-between;margin-bottom:4px">`
    +`<span style="font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--mute)">YEAR</span>`
    +`<span style="font-family:var(--mono);font-size:9px;color:var(--mute)">${yearRemStr}</span>`
    +`</div>${yearBarSvg(yearPct)}</div>`;
}

function doInit(){
  migrateMusicSessions();
  backfillTransactionIds();
  renderAll();
  applyProfileNickname();
  animateCardsIn(document.getElementById('s-home'));
  renderFaithCountdown();

  swalatInterval = setInterval(renderFaithCountdown, 1000);
  if(timeElapsedInterval) clearInterval(timeElapsedInterval);
  timeElapsedInterval = setInterval(renderTimeElapsed, 1000);
  checkAndNotify(computeNeglectGaps());
  if(!DB.profile().nickname) showOnboarding();
}
checkFaceIdLock(doInit);
